<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Desk</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  .ol-pane { padding: 12px; --covered: #c9f2d6; --open: #fdd3cf; --skip: #eef0f3; }
  .ol-pane section { padding: 12px; margin-bottom: 12px; }
  .ol-pane dl { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: 13px; }
  .ol-pane dt { color: var(--muted); } .ol-pane dd { margin: 0; overflow-wrap: anywhere; }
  .ol-pane .grid { grid-template-columns: minmax(0, 1fr); }
  :root { --chrome: 74px; /* header (50px) + footer (24px) */
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b1f24; --muted: #667085; --line: #e3e6eb;
    --accent: #0b5cad; --accent-soft: #e8f1fb; --ok: #067647; --err: #b42318; --dirty: #fff6dd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .2px; }
  #who { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  #navToggle { display: none; margin-left: auto; font-size: 18px; line-height: 1; padding: 6px 10px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.busy { opacity: .8; cursor: progress; }
  .spin { display: inline-block; width: .9em; height: .9em; margin-right: 8px; vertical-align: -.1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  .spin.dark { color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }
  button:disabled { opacity: .45; cursor: default; }
  button.danger { color: #b42318; border-color: #f0b4ae; }
  button.danger:hover:not(:disabled) { background: #b42318; border-color: #b42318; color: #fff; }
  input, select, textarea { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  input:disabled, select:disabled, textarea:disabled { background: var(--bg); color: var(--muted); }
  .dirty { background: var(--dirty); border-color: #e6b94a; }

  main { display: grid; grid-template-columns: clamp(280px, 20vw, 380px) minmax(0, 1fr); height: calc(100vh - var(--chrome)); height: calc(100dvh - var(--chrome)); }
  #list { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #list .controls { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  #list .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  #list .controls input[type=checkbox] { width: auto; }
  #accounts { overflow: auto; flex: 1; }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px;
    color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--line); }
  .pager button { width: auto; padding: 4px 10px; white-space: nowrap; }
  .pager span { white-space: nowrap; }
  .pager:last-child { border-bottom: 0; border-top: 1px solid var(--line); }
  .acct { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .acct:hover { background: var(--bg); }
  .acct.sel { background: var(--accent-soft); }
  .acct .n { font-weight: 600; }
  .acct .m { color: var(--muted); font-size: 12px; }
  .group { padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); position: sticky; top: 0; }
  section h3 label { display: flex; gap: 6px; align-items: center; font-weight: 400; font-size: 13px; color: var(--muted); }
  section h3 input[type=checkbox] { width: auto; }
  .acct { display: flex; gap: 8px; align-items: flex-start; }
  .acct .body { flex: 1; min-width: 0; }
  .acct input[type=checkbox], td.pick input { width: auto; margin-top: 3px; }
  .is-hidden { opacity: .55; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 400; }
  .selbar { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .selbar[hidden] { display: none; }
  .selbar input { width: auto; } label.selbar { white-space: nowrap; font-weight: 400; }
  td.pick, th.pick { width: 1%; }
  .acct-tools { display: flex; gap: 4px; align-items: center; padding: 6px 10px 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .acct-tools label { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .acct-tools label span { overflow: hidden; text-overflow: ellipsis; }
  .acct-tools input[type=checkbox] { width: auto; margin: 0; }
  .acct-tools button { width: auto; padding: 3px 5px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--ink); }
  .acct-tools button svg { width: 16px; height: 16px; }
  .acct-tools button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  .empty { padding: 24px 16px; color: var(--muted); }

  #detail { overflow: auto; padding: 18px clamp(12px, 2vw, 32px) 40px; min-width: 0; }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .title-row h2 { margin: 0; font-size: 20px; }
  .rep-pill { align-self: center; display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 12px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; }
  .rep-pill .k { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; opacity: .85; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
  section h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
  section h3 .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
  .grid label span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .grid label.wide { grid-column: 1 / -1; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.closed td { opacity: .65; }
  tr.new td { background: #fafbfc; }
  td.actions { white-space: nowrap; width: 1%; }
  .tablewrap { overflow-x: auto; }
  .col-name { min-width: 180px; } .col-stage { min-width: 150px; } .col-num { min-width: 100px; } .col-date { min-width: 140px; } .col-next { min-width: 180px; }

  .back { margin-bottom: 8px; }
  .ds-row { cursor: pointer; }
  .ds-row:hover td { background: var(--bg); }
  .ds-more td { background: #fafbfc; }
  .ds-more dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 14px; margin: 4px 0; }
  .ds-more dt { font-size: 12px; color: var(--muted); }
  .ds-more dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .grid label span.req { display: inline; color: var(--err); }
  [hidden] { display: none !important; }
  .grid input[type=checkbox] { width: auto; }
  details.optional summary { cursor: pointer; color: var(--accent); margin: 12px 0 8px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .opp-row1 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 14px; }
  @media (max-width: 1000px) { .opp-row1 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .team-row { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 14px; }
  @media (max-width: 760px) { .team-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .pick { position: relative; max-width: 360px; }
  .pick-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 2px); margin: 0; padding: 4px 0; list-style: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 220px; overflow: auto; }
  .pick-list li { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .pick-list li span { color: var(--muted); font-size: 12px; }
  .pick-list li.on, .pick-list li:hover { background: var(--bg); }
  .pick-list li.none { color: var(--muted); cursor: default; }
  .reassign-list { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; max-height: 160px; overflow: auto; }

  .center { display: grid; place-items: center; height: calc(100vh - var(--chrome)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; max-width: 420px; text-align: center; }
  .card p { color: var(--muted); }

  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; } #app { flex: 1 0 auto; min-width: 0; }
  footer#ver { height: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); }
  #toast { position: fixed; right: 16px; bottom: 32px; max-width: min(420px, calc(100vw - 32px)); z-index: 30; padding: 10px 14px; border-radius: 8px; background: #1b1f24; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; }
  #toast.ok { background: var(--ok); } #toast.err { background: var(--err); }

  /* ---------- dashboard ---------- */
  header { position: sticky; top: 0; z-index: 20; }
  header nav { display: flex; gap: 4px; margin-left: 12px; flex: 1; align-items: center; min-width: 0; }
  header nav button { border-color: transparent; background: none; color: var(--muted); }
  header nav .hdr-right button { border-color: var(--line); background: var(--panel); color: var(--ink); }
  header nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .dash { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #a3a29c; --grid: #eceef1;
    max-width: 1720px; margin: 0 auto; padding: 18px clamp(12px, 2vw, 32px) 48px; height: calc(100vh - var(--chrome)); height: calc(100dvh - var(--chrome)); overflow: auto; }
  .dash-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 2px; }
  .dash-head h2 { margin: 0; font-size: 20px; }
  .dash-head label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .dash-head input, .dash-head select { width: auto; }
  .tiles { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .tiles.even { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  button.tile { text-align: left; font: inherit; color: inherit; cursor: pointer; }
  button.tile:hover { border-color: var(--accent); }
  button.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .picks { display: flex; gap: 12px; flex-wrap: wrap; }
  .picks select { width: auto; max-width: 280px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { white-space: nowrap; overflow-wrap: normal; font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile.hero .v { font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; }
  .tile .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile.warn .d { color: var(--err); }
  .charts { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; }
  .charts section { margin-bottom: 0; }
  .dash section { margin-bottom: 18px; }
  .dash .charts { margin-bottom: 18px; } .dash .charts section { margin-bottom: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .fynav { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
  .fynav button { padding: 2px 8px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .hbars { display: grid; grid-template-columns: fit-content(40%) minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
  .hbars .lbl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; cursor: pointer; }
  .hbars .track { display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; padding: 3px 0; }
  .hbars .bar { height: 20px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
  .hbars .val { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hbars .val span { color: var(--muted); }
  .dim { opacity: .35; }
  svg.cols { display: block; width: 100%; overflow: visible; }
  svg.cols text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg.cols text.now { fill: var(--ink); font-weight: 700; }
  svg.cols text.cap { fill: var(--ink); font-variant-numeric: tabular-nums; }
  svg.cols .hit { fill: transparent; cursor: pointer; }
  svg.cols .hit:hover { fill: rgba(11, 92, 173, .06); }
  #tip { position: fixed; pointer-events: none; z-index: 10; background: #1b1f24; color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; max-width: 260px; }
  #tip b { display: block; margin-bottom: 3px; }
  #tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  #tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .deals td { white-space: nowrap; } .deals td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .deals th.n { text-align: right; }
  .deals tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
  .deals tbody tr { cursor: pointer; } .deals tbody tr.nolink { cursor: default; } .deals tr.subtotal td { font-weight: 600; background: var(--bg); } .deals tbody tr:hover td { background: var(--bg); }
  .deals td.wrap { white-space: normal; min-width: 180px; }
  .pastdue { color: var(--err); }
  /* ---------- my calendar ---------- */
  .cal { --covered: #c9f2d6; --covered-line: #12924a; --open: #fdd3cf; --open-line: #d92d20; --skip: #eef0f3; --skip-line: #98a2b3; --hour: 48px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 18px clamp(12px, 2vw, 32px) 40px; height: calc(100vh - var(--chrome)); height: calc(100dvh - var(--chrome)); overflow: auto; }
  .cal.with-panel { grid-template-columns: minmax(0, 1fr) clamp(380px, 28vw, 540px); }
  .cal-panel { position: sticky; top: 0; align-self: start; max-height: calc(100vh - var(--chrome) - 36px); max-height: calc(100dvh - var(--chrome) - 36px); overflow: auto; }
  .cal.with-panel #calWeekDs .deals td { white-space: normal; } .cal.with-panel #calWeekDs .deals td.wrap { min-width: 0; }
  .cal.with-panel #calWeekDs .deals td:nth-child(3), .cal.with-panel #calWeekDs .deals td.n { white-space: nowrap; }
  .cal-empty { border-style: dashed; text-align: center; padding: 28px 20px; }
  .cal-empty h3 { justify-content: center; }
  #calWeekDs { margin: 18px 0 0; }
  .agenda { display: grid; gap: 10px; }
  .agenda-day { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .agenda-head { font-size: 13px; font-weight: 600; color: var(--muted); }
  .agenda-day.today .agenda-head { color: var(--accent); }
  .agenda .ev { position: static; display: block; width: 100%; padding: 8px 10px; font-size: 14px; }
  .agenda .ev .t { font-size: 12px; }
  .mobile-only { display: none; }
  .cal-main { min-width: 0; }
  .cal-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .cal-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border-left: 3px solid; }
  .week { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .week-row { display: grid; grid-template-columns: 52px repeat(var(--days), minmax(0, 1fr)); }
  .week-row > div { border-left: 1px solid var(--line); min-width: 0; }
  .week-row > div:first-child { border-left: 0; }
  .day-head { padding: 6px 8px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .day-head b { display: block; font-size: 16px; color: var(--ink); }
  .day-head.today b { color: var(--accent); }
  .allday { padding: 3px; border-bottom: 1px solid var(--line); min-height: 26px; display: grid; gap: 3px; align-content: start; }
  .gutter-label { font-size: 11px; color: var(--muted); padding: 4px 6px; text-align: right; }
  .hours-col { position: relative; }
  .hours-col .hl { position: absolute; left: 0; right: 0; border-top: 1px solid #f0f1f4; }
  .hours-col .now-line { position: absolute; left: 0; right: 0; border-top: 2px solid var(--accent); z-index: 2; }
  .gutter .hl-label { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .ev { position: absolute; border-radius: 4px; padding: 2px 5px; font-size: 12px; line-height: 1.3; overflow: hidden; cursor: pointer;
    border-left: 3px solid; text-align: left; font-family: inherit; color: var(--ink); min-height: 18px; }
  .allday .ev { position: static; }
  .ev.covered { background: var(--covered); border-color: var(--covered-line); }
  .ev.open { background: var(--open); border-color: var(--open-line); }
  .ev.skipped { background: var(--skip); border-color: var(--skip-line); color: var(--muted); }
  .ev.sel { box-shadow: 0 0 0 2px var(--accent); z-index: 3; }
  .ev .t { font-size: 11px; opacity: .8; }
  .ev .s { font-weight: 600; overflow-wrap: anywhere; }
  .cal-panel section { margin-bottom: 14px; }
  button.linkish { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-align: left; display: block; }
  button.icon-btn { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; }
  button.icon-btn:hover { color: var(--accent); }
  td.edit-cell { width: 1%; padding-right: 0; }
  section.ds-edit { margin-bottom: 14px; }
  .deals tr.sel td { background: var(--accent-soft); }
  .cal-panel .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .cal-panel .desc { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; font-size: 13px; background: var(--bg); border-radius: 6px; padding: 8px; }
  .cal-panel dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; margin: 0 0 10px; font-size: 13px; }
  .cal-panel dt { color: var(--muted); } .cal-panel dd { margin: 0; overflow-wrap: anywhere; }
  .status-pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 10px; padding: 1px 9px; }
  .status-pill.covered { background: var(--covered); color: #05603a; } .status-pill.open { background: var(--open); color: #912018; }
  .status-pill.skipped { background: var(--skip); color: var(--muted); }
  .opp-pick { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; }
  .opp-pick button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 6px 8px; }
  .opp-pick button:last-child { border-bottom: 0; }
  .opp-pick button.on { background: var(--accent-soft); }
  .opp-pick button.active { outline: 2px solid var(--accent); outline-offset: -2px; }
  .opp-pick .m { color: var(--muted); font-size: 12px; }
  .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  /* ---------- responsive ---------- */
  @media (max-width: 1000px) {
    .cal.with-panel { grid-template-columns: minmax(0, 1fr); }
    .cal-panel { order: -1; scroll-margin-top: 60px; position: static; max-height: none; overflow: visible; }
    .tiles { grid-template-columns: repeat(2, 1fr); } .tile.hero { grid-column: 1 / -1; }
    .tiles.even { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .charts { grid-template-columns: 1fr; }
  }

  /* Phones and small tablets: one column, tabs in a menu, the page scrolls as a whole. */
  @media (max-width: 760px) {
    header { padding: 0 12px; }
    #navToggle { display: inline-block; }
    header nav { display: none; }
    header.menu-open nav:not([hidden]) { display: flex; flex-direction: column; align-items: stretch; gap: 2px; position: absolute; top: 50px; left: 0; right: 0;
      margin: 0; padding: 8px 12px 12px; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
    header.menu-open nav button { text-align: left; padding: 10px 12px; }
    .hdr-right { margin: 8px 0 0; padding-top: 10px; border-top: 1px solid var(--line); justify-content: space-between; }
    .dash, .cal, main, #detail { height: auto; overflow: visible; }
    .dash, .cal, #detail { padding: 14px 12px 32px; }
    main { grid-template-columns: minmax(0, 1fr); }
    #list { border-right: 0; }
    #accounts { overflow: visible; }
    main.has-detail #list { display: none; }
    main:not(.has-detail) #detail { display: none; }
    .mobile-only { display: inline-block; }
    .tiles.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile { padding: 12px; }
    .tile .v { font-size: 20px; }
    section { padding: 12px; }
    .dash-head { gap: 8px 10px; }
    .dash-head h2, .title-row h2 { font-size: 18px; }
    .picks { gap: 8px; width: 100%; }
    .picks label, .picks > * { flex: 1 1 140px; }
    .picks select { max-width: none; width: 100%; }
    .cal-legend { flex-wrap: wrap; gap: 6px 12px; }
    #calSource { max-width: 100% !important; flex: 1 1 100%; }
    .form-actions { position: sticky; bottom: 0; background: var(--panel); padding: 10px 0 2px; margin-bottom: -2px; }
    .form-actions button { flex: 1; }
    .cal-panel dl { grid-template-columns: 80px minmax(0, 1fr); }
    .hbars { grid-template-columns: fit-content(45%) minmax(0, 1fr); }
    #toast { left: 16px; right: 16px; max-width: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
    .cal-panel h3 { flex-wrap: nowrap; align-items: flex-start; }
    .seg { max-width: 100%; overflow-x: auto; }
    .seg button { white-space: nowrap; }
    .charts { grid-template-columns: minmax(0, 1fr); }
    .tiles.even > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  }

  /* Phones: list tables become stacked cards, one per row, each value under its column's name. */
  @media (max-width: 640px) {
    .tablewrap:has(> table.deals) { overflow: visible; }
    table.deals thead { display: none; }
    table.deals, .deals tbody, .deals tfoot { display: block; }
    .deals tbody tr { display: block; position: relative; padding: 8px 2px; border-bottom: 1px solid var(--line); }
    .deals tbody td { display: flex; justify-content: space-between; gap: 12px; padding: 2px 4px; border: 0; white-space: normal; text-align: right; min-width: 0; overflow-wrap: anywhere; }
    .deals tbody td.wrap { min-width: 0; }
    .deals tbody td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; flex: none; max-width: 45%; }
    .deals tbody td:first-child { font-weight: 600; }
    .deals tbody td.edit-cell { position: absolute; top: 4px; right: 0; width: auto; padding: 0; }
    .deals tbody td.edit-cell + td { padding-right: 48px; }
    .deals tbody tr.subtotal, .deals tfoot tr { display: flex; justify-content: space-between; padding: 8px 4px; }
    .deals tbody tr.subtotal td, .deals tfoot td { display: block; border: 0; padding: 0; }
    .deals td.empty { display: block; text-align: left; }
  }

  /* Touch: bigger targets, and 16px text in fields so iOS doesn't zoom in. */
  @media (pointer: coarse), (max-width: 760px) {
    button:not(.ev), .btn, select, input:not([type=checkbox]):not([type=radio]) { min-height: 40px; }
    input, select, textarea { font-size: 16px; }
    input[type=checkbox] { width: 20px !important; height: 20px; }
    button.icon-btn { padding: 8px 10px; font-size: 18px; min-height: 0; }
    button.linkish { min-height: 0; padding: 4px 0; }
    .seg button { padding: 8px 12px; min-height: 0; }
    .fynav button { padding: 6px 12px; min-height: 0; }
    td { padding: 8px 6px; }
  }
</style>
</head>
<body>
<header id="hdr">
  <h1>SF Desk</h1>
  <button id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="nav" hidden>☰</button>
  <nav id="nav" hidden>
    <button id="navDash" onclick="showDashboard()">Deals</button>
    <button id="navTime" onclick="showTime()">My Time</button>
    <button id="navCal" onclick="showCalendar()">Time Entry</button>
    <button id="navAccts" onclick="showMain()">Accounts</button>
  <div class="hdr-right">
    <span id="who"></span>
    <button id="logout" hidden>Disconnect</button>
  </div>
  </nav>
</header>
<div id="app"></div>
<footer id="ver">SF Desk</footer>
<div id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>

<script src="xlsx.js"></script>
<script>
const ACCOUNT_UI = [
  ['Name', 'text'], ['Type', 'picklist'], ['Industry', 'picklist'], ['Phone', 'text'], ['Website', 'text'],
  ['AnnualRevenue', 'number'], ['NumberOfEmployees', 'number'], ['BillingCity', 'text'], ['BillingState', 'text'],
  ['Description', 'textarea'],
];
const OPP_UI = [
  ['Name', 'text', 'col-name'], ['StageName', 'picklist', 'col-stage'], ['Amount', 'number', 'col-num'],
  ['CloseDate', 'date', 'col-date'], ['Probability', 'number', 'col-num'], ['NextStep', 'text', 'col-next'],
];
const LABELS = { StageName: 'Stage', AnnualRevenue: 'Annual revenue', NumberOfEmployees: 'Employees',
  BillingCity: 'Billing city', BillingState: 'Billing state', CloseDate: 'Close date', NextStep: 'Next step',
  Probability: 'Probability %' };
const label = (f) => LABELS[f] || f;

let me = null, meta = null, current = null, accounts = [], dsMeta = null;
// Account list: filter to one sales rep (account owner) and/or group the list by rep.
// Opportunities: closed ones are hidden unless showClosed is ticked.
let repFilter = '', groupByRep = false, showClosed = false, sortRecent = false;
// The filters the Accounts, Deals and My Time tabs share, in this order:
// boatFilter: 'mine' (the BOATs of my accounts), 'all', a SailPoint BOAT, or '__blank__' (no BOAT);
// teamFilter: 'mine' (My Accounts: I'm in one of the account's role fields), 'team' (me or anyone on
//   my team is), a team member's User Id, or 'all' (My Time picks whose time instead, see timePrefs);
// repFilter: one sales rep (the account owner), from the reps the first two filters leave.
let boatFilter = 'mine', teamFilter = 'mine', acctFilters = null;
// The sales reps the BOAT and team filters leave on the Accounts and Deals tabs: { key, reps }.
let repChoices = null;
// The account list shows ACCT_PAGE accounts at a time, with paging controls above and below when there are more.
const ACCT_PAGE = 200, ACCT_MAX = 5000;
let acctPage = 0;
let savedRepName = ''; // the picked rep's name from the saved filters, until the rep choices load

// Each launch starts on My BOAT, My Accounts and All sales reps (and My Time on the My Time tab); the
// picks then carry across the tabs. The sort, grouping and "Show hidden" are kept in SF Desk's local
// database, so they survive a restart.
async function loadAcctPrefs() {
  boatFilter = 'mine'; teamFilter = 'mine'; repFilter = ''; savedRepName = '';
  saveTimePrefs('who', 'me', 'me');
  try {
    const p = await api('/prefs/accounts');
    sortRecent = !!p.sortRecent; groupByRep = !!p.groupByRep; showHiddenAccts = !!p.showHidden;
  } catch { /* first run or offline: keep the defaults */ }
}
function saveAcctPrefs() {
  const repName = repFilter ? (repChoices?.reps.find((r) => r.value === repFilter)?.label
    || [...acctOwners.values()].find((r) => r.id === repFilter)?.name || savedRepName) : '';
  if (repName) savedRepName = repName;
  api('/prefs/accounts', { method: 'PUT', body: { boat: boatFilter, team: teamFilter, rep: repFilter, repName,
    sortRecent, groupByRep, showHidden: showHiddenAccts } }).catch(() => {});
}

// Which fields My Accounts checks, the BOAT choices, my BOATs and my team; looked up once per session.
let acctFiltersLoading = null;
function ensureAcctFilters() {
  if (acctFilters) return Promise.resolve(acctFilters);
  acctFiltersLoading ??= api('/account-filters').then((f) => (acctFilters = f)).finally(() => { acctFiltersLoading = null; });
  return acctFiltersLoading;
}
const filterQuery = () => ({ boat: boatFilter, team: teamFilter });

// The three filter dropdowns, in order: SailPoint BOAT, team, sales rep. `time` makes the team
// dropdown pick whose time (My Time / My Team / a member); otherwise it picks whose accounts.
function filterSelects({ onBoat, onTeam, onRep, time = false }) {
  const boat = el('select', { 'aria-label': 'SailPoint BOAT' }, el('option', { value: 'mine' }, 'My BOAT'), el('option', { value: 'all' }, 'All BOATs'));
  const team = el('select', { 'aria-label': time ? 'Whose time' : 'Whose accounts' });
  const rep = el('select', { 'aria-label': 'Sales rep' }, el('option', { value: '' }, 'All sales reps'));
  boat.addEventListener('change', () => { boatFilter = boat.value; saveAcctPrefs(); onBoat(); });
  team.addEventListener('change', () => {
    if (time) saveTimePrefs('who', team.value, 'me'); else { teamFilter = team.value; saveAcctPrefs(); }
    onTeam();
  });
  rep.addEventListener('change', () => { repFilter = rep.value; saveAcctPrefs(); onRep(); });
  const f = { boat, team, rep, time };
  fillBoatSelect(f); fillTeamSelect(f);
  return f;
}

// BOAT choices: My BOAT, All BOATs, then every BOAT A–Z (and accounts with none).
function fillBoatSelect(f) {
  const b = acctFilters?.boat, mine = acctFilters?.myBoats || [];
  if (acctFilters && !b) {
    f.boat.replaceChildren(el('option', { value: 'all' }, 'BOAT: not found'));
    f.boat.disabled = true;
    f.boat.title = 'No "SailPoint BOAT" field found on Account. Set SF_BOAT_FIELD in .env to its API name.';
    return;
  }
  f.boat.replaceChildren(
    el('option', { value: 'mine' }, mine.length === 1 ? `My BOAT: ${mine[0]}` : mine.length ? `My BOATs (${mine.length})` : 'My BOAT'),
    el('option', { value: 'all' }, 'All BOATs'),
    ...(b?.options || []).map((o) => el('option', { value: o.value }, o.label)),
    b ? el('option', { value: '__blank__' }, '(No BOAT)') : null);
  if (acctFilters && ![...f.boat.options].some((o) => o.value === boatFilter)) boatFilter = 'mine';
  f.boat.value = boatFilter;
  f.boat.title = b ? `${b.label} (${b.name})\nMy BOAT: the BOAT of your accounts (${mine.join(', ') || 'none found, so all BOATs'})` : '';
}

// Team choices: My Accounts (or My Time), My Team, each team member A–Z, and All accounts.
function fillTeamSelect(f) {
  const members = [...(f.time ? time.data?.team?.members : acctFilters?.team) || []].sort((a, b) => a.name.localeCompare(b.name));
  const value = f.time ? (time.data?.who || timePrefs().who || 'me') : teamFilter;
  f.team.replaceChildren(
    el('option', { value: f.time ? 'me' : 'mine' }, f.time ? 'My Time' : 'My Accounts'),
    el('option', { value: 'team' }, 'My Team'),
    ...members.map((m) => el('option', { value: m.id }, m.name)),
    f.time ? null : el('option', { value: 'all' }, 'All accounts'));
  if (!f.time && acctFilters && ![...f.team.options].some((o) => o.value === teamFilter)) teamFilter = 'mine';
  f.team.value = f.time ? value : teamFilter;
  if (f.time || !acctFilters) return;
  const roles = acctFilters.mine.map((m) => m.role === m.label ? m.label : `${m.role} (${m.label})`);
  f.team.title = `Accounts where you (My Accounts), you or anyone on your team (My Team), or that person is ` +
    `${roles.join(', ') || '…'}` + (acctFilters.missing.length ? `\nNot found on Account: ${acctFilters.missing.join(', ')}` : '');
}

// Sales rep choices, A–Z; a picked rep who isn't among them goes back to All sales reps.
function fillRepSelect(f, reps) {
  const list = [...reps].sort((a, b) => a.label.localeCompare(b.label));
  if (repFilter && !list.some((r) => r.value === repFilter)) repFilter = '';
  f.rep.replaceChildren(el('option', { value: '' }, 'All sales reps'), ...list.map((r) => el('option', { value: r.value }, r.label)));
  f.rep.value = repFilter;
}

// The sales reps of the accounts the BOAT and team filters cover (Accounts and Deals tabs).
async function loadRepChoices() {
  const key = JSON.stringify(filterQuery());
  if (repChoices?.key === key) return repChoices;
  const { reps } = await api('/account-filters/people?' + new URLSearchParams(filterQuery()));
  repChoices = { key, reps };
  return repChoices;
}

// "My Accounts · My BOAT: X · Sales rep: Y", for the lines under the headings.
function filterText(f) {
  const t = (s) => s.options[s.selectedIndex]?.textContent || '';
  return [t(f.team), t(f.boat), repFilter ? `Sales rep: ${t(f.rep)}` : ''].filter(Boolean).join(' · ');
}
const acctOwners = new Map(); // account Id -> { id, name } of its owner, for every account loaded this session

// Hidden records live in the local database (never in Salesforce). Lists leave them out
// unless "Show hidden" is ticked; ticked rows can be hidden or unhidden in one go.
let hidden = new Map();          // id -> { id, type, name, hiddenAt }
let showHiddenAccts = false, showHiddenOpps = false;
const pickedAccts = new Set(), pickedOpps = new Set();
let reloadAccounts = () => {};   // re-runs the Accounts list query (set by showMain)
const isHidden = (id) => hidden.has(id);

async function loadHidden() {
  setHidden(await api('/hidden'));
}
function setHidden(list) {
  hidden = new Map(list.map((h) => [h.id, h]));
}
async function setHiddenState(type, recs, hide) {
  const ids = recs.map((r) => r.Id);
  const names = Object.fromEntries(recs.map((r) => [r.Id, r.Name]));
  setHidden(await api(hide ? '/hidden' : '/hidden/remove', { method: 'POST', body: { type, ids, names } }));
  const what = `${ids.length} ${type === 'Account' ? 'account' : 'opportunit'}${type === 'Account' ? (ids.length === 1 ? '' : 's') : (ids.length === 1 ? 'y' : 'ies')}`;
  toast(hide ? `Hid ${what}. Tick "Show hidden" to see them again.` : `Unhid ${what}.`, 'ok');
}

// ---------- helpers ----------
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
  return n;
}

async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-SFDesk': '1' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) showConnect(data.error);
    throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  }
  // The server answered from its local copy because Salesforce couldn't be reached.
  const cached = r.headers.get('X-SFDesk-Cached');
  if (cached) {
    const when = isNaN(Date.parse(cached)) ? '' : ' from ' + new Date(cached).toLocaleString();
    toast(`Salesforce is unreachable. Showing your saved copy${when}; changes can't be saved until it's back.`, 'err');
  }
  return data;
}

let toastTimer;
function toast(msg, kind = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = kind; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = 'none'), kind === 'err' ? 8000 : 3000);
}

const money = (n) => n == null ? '' : n.toLocaleString(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });

function field(def, value, editable, onChange) {
  const [name, kind] = def;
  let n;
  if (kind === 'picklist') {
    const options = [...(meta.picklists[name] || [])];
    if (value && !options.includes(value)) options.unshift(value);
    n = el('select', {}, el('option', { value: '' }, '—'), options.map((o) => el('option', { value: o }, o)));
  } else if (kind === 'textarea') {
    n = el('textarea', { rows: 3 });
  } else {
    n = el('input', { type: kind === 'number' ? 'number' : kind === 'date' ? 'date' : 'text', step: kind === 'number' ? 'any' : null });
  }
  n.value = value ?? '';
  n.dataset.field = name;
  n.dataset.kind = kind;
  n.disabled = !editable;
  n.setAttribute('aria-label', label(name));
  n.addEventListener('input', onChange);
  n.addEventListener('change', onChange);
  return n;
}

function readValue(n) {
  if (n.value === '') return null;
  return n.dataset.kind === 'number' ? Number(n.value) : n.value;
}

// Returns only changed fields, and highlights them.
function changes(container, original) {
  const out = {};
  container.querySelectorAll('[data-field]').forEach((n) => {
    const v = readValue(n), o = original[n.dataset.field] ?? null;
    if (v !== o) { out[n.dataset.field] = v; n.classList.add('dirty'); } else n.classList.remove('dirty');
  });
  return out;
}

// ---------- views ----------
// On phones the tabs fold into a menu under the ☰ button.
function menu(open) {
  document.getElementById('hdr').classList.toggle('menu-open', open);
  document.getElementById('navToggle').setAttribute('aria-expanded', String(open));
}
// On phones the list tables (class "deals") show each row as a card: every cell gets its column's
// heading as a label. Done here for all of them as they're drawn.
function labelCells(table) {
  const heads = [...table.querySelectorAll('thead th')].map((th) => th.textContent.trim());
  for (const tr of table.querySelectorAll('tbody tr')) {
    if (tr.cells.length < 2) continue;
    let col = 0;
    for (const td of tr.cells) {
      if (heads[col] && !td.hasAttribute('data-label')) td.dataset.label = heads[col];
      col += td.colSpan || 1;
    }
  }
}
new MutationObserver(() => document.querySelectorAll('#app table.deals').forEach(labelCells))
  .observe(document.getElementById('app'), { childList: true, subtree: true });
document.getElementById('navToggle').addEventListener('click', () => menu(!document.getElementById('hdr').classList.contains('menu-open')));
document.addEventListener('click', (e) => { if (!e.target.closest('#hdr')) menu(false); });

function showConnect(message) {
  document.getElementById('who').textContent = '';
  document.getElementById('logout').hidden = true;
  document.getElementById('nav').hidden = true;
  document.getElementById('navToggle').hidden = true;
  const app = document.getElementById('app');
  app.replaceChildren(el('div', { class: 'center' }, el('div', { class: 'card' },
    el('h2', {}, 'Connect to Salesforce'),
    el('p', {}, message || 'Sign in with your Salesforce account. The app only sees what your user can see, and only saves when you click Save.'),
    el('a', { class: 'btn primary', href: IN_OUTLOOK ? '/login?next=/outlook/pane' : '/login', onclick: connecting }, 'Connect'),
  )));
}

// Connecting can take a while before anything comes back: show it was clicked, and don't start it twice.
function connecting(e) {
  const b = e.currentTarget;
  if (b.classList.contains('busy')) return e.preventDefault();
  b.classList.add('busy');
  b.setAttribute('aria-disabled', 'true');
  b.replaceChildren(el('span', { class: 'spin', 'aria-hidden': 'true' }), 'Connecting…');
  b.after(el('p', { class: 'sub', role: 'status' }, 'Signing in to Salesforce. This can take a little while.'));
}
// Between connecting and the first screen: say what's happening instead of a blank page.
function showLoading(text) {
  document.getElementById('app').replaceChildren(el('div', { class: 'center' }, el('div', { class: 'card', role: 'status' },
    el('h2', {}, el('span', { class: 'spin dark', 'aria-hidden': 'true' }), text))));
}

function setNav(which) {
  document.getElementById('nav').hidden = false;
  document.getElementById('navToggle').hidden = false;
  menu(false);
  window.scrollTo(0, 0);
  document.getElementById('navDash').classList.toggle('on', which === 'dash');
  document.getElementById('navTime').classList.toggle('on', which === 'time');
  document.getElementById('navCal').classList.toggle('on', which === 'cal');
  document.getElementById('navAccts').classList.toggle('on', which === 'accts');
}

function showMain() {
  setNav('accts');
  current = null;
  const app = document.getElementById('app');
  const search = el('input', { type: 'search', placeholder: 'Search accounts…' });
  // BOAT and team narrow the sales reps, then the list; a rep change only reloads the list.
  const refilter = () => { loadAccounts(); renderReps(true); };
  const filters = filterSelects({ onBoat: refilter, onTeam: refilter, onRep: () => loadAccounts() });
  acctFilterSelects = filters;
  const group = el('input', { type: 'checkbox', checked: groupByRep });
  const sort = el('select', { 'aria-label': 'Sort accounts' },
    el('option', { value: 'name' }, 'Sort: Name A–Z'), el('option', { value: 'recent' }, 'Sort: Recently modified'));
  sort.value = sortRecent ? 'recent' : 'name';
  sort.addEventListener('change', () => { sortRecent = sort.value === 'recent'; saveAcctPrefs(); loadAccounts(); });
  let timer;
  group.addEventListener('change', () => { groupByRep = group.checked; saveAcctPrefs(); renderList(); });
  search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(loadAccounts, 300); });
  const showHidden = el('input', { type: 'checkbox', checked: showHiddenAccts, id: 'showHiddenAccts' });
  showHidden.addEventListener('change', () => { showHiddenAccts = showHidden.checked; saveAcctPrefs(); renderList(); });

  app.replaceChildren(el('main', {},
    el('div', { id: 'list' },
      el('div', { class: 'controls' }, search, filters.boat, filters.team, filters.rep, sort,
        el('label', {}, group, 'Group by sales rep'),
        el('label', {}, showHidden, el('span', { id: 'hiddenAcctLabel' }, 'Show hidden'))),
      el('div', { class: 'acct-tools', id: 'acctTools' }),
      el('div', { id: 'accounts' }, el('div', { class: 'empty' }, 'Loading…')),
    ),
    el('div', { id: 'detail' }, el('div', { class: 'empty' }, 'Pick an account to see its details and opportunities.')),
  ));

  async function loadAccounts() {
    const params = new URLSearchParams({ q: search.value.trim(), ...filterQuery() });
    if (repFilter) params.set('owner', repFilter);
    if (sortRecent) params.set('sort', 'recent');
    const seq = ++acctLoads;
    try {
      const list = await api('/accounts?' + params);
      if (seq !== acctLoads) return; // a newer filter choice is loading
      accounts = list;
      acctPage = 0;
      for (const a of accounts) if (a.OwnerId) acctOwners.set(a.Id, { id: a.OwnerId, name: a.Owner?.Name || a.OwnerId });
      renderList();
    } catch (e) { toast(e.message, 'err'); }
  }
  filters.reload = loadAccounts;
  reloadAccounts = loadAccounts;
  renderAcctFilters();
  loadAccounts();
}

// The Accounts tab's filter dropdowns, while it's shown, and a count of list loads (the latest wins).
let acctFilterSelects = null, acctLoads = 0;

// Fill the BOAT and team choices once the filter fields are known, then the sales reps.
async function renderAcctFilters() {
  try { await ensureAcctFilters(); } catch (e) { return toast(e.message, 'err'); }
  const f = acctFilterSelects;
  if (!f || !f.boat.isConnected) return;
  const before = JSON.stringify(filterQuery());
  fillBoatSelect(f); fillTeamSelect(f);
  // A saved BOAT or team member that's gone went back to the default, so the list needs reloading.
  if (JSON.stringify(filterQuery()) !== before) f.reload?.();
  renderReps(true);
}

function renderList() {
  const box = document.getElementById('accounts');
  const hiddenCount = accounts.filter((a) => isHidden(a.Id)).length;
  document.getElementById('hiddenAcctLabel').textContent = `Show hidden (${hiddenCount})`;
  const shown = shownAccounts();
  for (const id of [...pickedAccts]) if (!shown.some((a) => a.Id === id)) pickedAccts.delete(id);
  renderAcctSelbar();
  renderReps();
  if (!shown.length) {
    return box.replaceChildren(el('div', { class: 'empty' },
      accounts.length ? 'All accounts here are hidden. Tick "Show hidden" to see them.' : 'No accounts found.'));
  }
  const row = (a) => {
    const pick = el('input', { type: 'checkbox', checked: pickedAccts.has(a.Id), 'aria-label': `Select ${a.Name}` });
    pick.addEventListener('click', (e) => e.stopPropagation());
    pick.addEventListener('change', () => { pick.checked ? pickedAccts.add(a.Id) : pickedAccts.delete(a.Id); renderAcctSelbar(); });
    return el('div', {
      class: 'acct' + (current?.account.Id === a.Id ? ' sel' : '') + (isHidden(a.Id) ? ' is-hidden' : ''),
      onclick: () => openAccount(a.Id),
    },
      pick,
      el('div', { class: 'body' },
        el('div', { class: 'n' }, a.Name, isHidden(a.Id) ? el('span', { class: 'tag' }, 'Hidden') : null),
        el('div', { class: 'm' }, [a.Type, a.Industry, [a.BillingCity, a.BillingState].filter(Boolean).join(', ')].filter(Boolean).join(' · ') || '—'),
      ),
    );
  };
  // Page through long lists: Previous / Next above and below this page's rows.
  // Grouped by sales rep: reps A–Z across the whole list (each keeping the list's order), then paged.
  const repOf = (a) => a.Owner?.Name || 'No owner';
  const ordered = groupByRep ? [...shown].sort((x, y) => repOf(x).localeCompare(repOf(y))) : shown;
  const pages = Math.ceil(ordered.length / ACCT_PAGE);
  acctPage = Math.min(acctPage, pages - 1);
  const pageRows = ordered.slice(acctPage * ACCT_PAGE, (acctPage + 1) * ACCT_PAGE);
  const pager = () => pages > 1 ? el('div', { class: 'pager' },
    el('button', { disabled: acctPage === 0, onclick: () => { acctPage--; renderList(); box.scrollTop = 0; } }, '‹ Prev'),
    el('span', {}, `${(acctPage * ACCT_PAGE + 1).toLocaleString()}–${(acctPage * ACCT_PAGE + pageRows.length).toLocaleString()} of ` +
      `${shown.length.toLocaleString()}${accounts.length >= ACCT_MAX ? '+' : ''}`),
    el('button', { disabled: acctPage >= pages - 1, onclick: () => { acctPage++; renderList(); box.scrollTop = 0; } }, 'Next ›')) : null;
  if (!groupByRep) return box.replaceChildren(...[pager(), ...pageRows.map(row), pager()].filter(Boolean));
  // A heading before each rep's rows on this page, with the rep's count across all pages.
  const total = new Map();
  for (const a of shown) total.set(repOf(a), (total.get(repOf(a)) || 0) + 1);
  const out = [];
  pageRows.forEach((a, i) => {
    if (i === 0 || repOf(pageRows[i - 1]) !== repOf(a)) out.push(el('div', { class: 'group' }, `${repOf(a)} (${total.get(repOf(a))})`));
    out.push(row(a));
  });
  box.replaceChildren(...[pager(), ...out, pager()].filter(Boolean));
}

// Sales rep choices: the owners of the accounts the BOAT and team filters cover (looked up with
// `reload`). Until they load, or if they can't be, the owners of the accounts seen this session.
async function renderReps(reload = false) {
  const f = acctFilterSelects;
  if (!f || !f.rep.isConnected) return;
  if (reload) {
    const key = JSON.stringify(filterQuery());
    try { await loadRepChoices(); } catch (e) { if (!repChoices || repChoices.key !== key) repChoices = null; }
    if (JSON.stringify(filterQuery()) !== key || !f.rep.isConnected) return;
    const before = repFilter;
    if (repChoices) fillRepSelect(f, repChoices.reps);
    // The picked rep has no accounts here any more: list them all again.
    if (repFilter !== before) { saveAcctPrefs(); f.reload?.(); }
    if (repChoices) return;
  }
  if (repChoices?.key === JSON.stringify(filterQuery())) return;
  const byId = new Map();
  for (const [acctId, r] of acctOwners) if (showHiddenAccts || !isHidden(acctId)) byId.set(r.id, r.name);
  if (repFilter && !byId.has(repFilter)) byId.set(repFilter, savedRepName || repFilter);
  fillRepSelect(f, [...byId].map(([value, label]) => ({ value, label })));
}

// The "N selected · Hide · Unhide" bar shown above a list while rows are ticked.
function selbar(bar, picked, records, type, after) {
  const recs = records.filter((r) => picked.has(r.Id));
  bar.hidden = !recs.length;
  if (!recs.length) return bar.replaceChildren();
  const toHide = recs.filter((r) => !isHidden(r.Id)), toShow = recs.filter((r) => isHidden(r.Id));
  const act = (list, hide) => async () => {
    try { await setHiddenState(type, list, hide); picked.clear(); after(); } catch (e) { toast(e.message, 'err'); }
  };
  bar.replaceChildren(
    el('span', {}, `${recs.length} selected`),
    toHide.length ? el('button', { onclick: act(toHide, true) }, `Hide ${toHide.length}`) : null,
    toShow.length ? el('button', { onclick: act(toShow, false) }, `Unhide ${toShow.length}`) : null,
    el('button', { onclick: () => { picked.clear(); after(); } }, 'Clear'),

}

// The accounts the list shows right now (all pages), leaving out hidden ones unless "Show hidden" is ticked.
const shownAccounts = () => showHiddenAccts ? accounts : accounts.filter((a) => !isHidden(a.Id));

// The row above the Accounts list: a select-all box with the count, and icons that act on the ticked accounts.
function renderAcctSelbar() {
  const bar = document.getElementById('acctTools');
  if (!bar) return;
  const shown = shownAccounts();
  const recs = shown.filter((a) => pickedAccts.has(a.Id));
  const all = el('input', { type: 'checkbox', 'aria-label': 'Select all accounts', checked: !!recs.length && recs.length === shown.length, disabled: !shown.length });
  all.indeterminate = !!recs.length && recs.length < shown.length;
  all.addEventListener('change', () => {
    if (all.checked) for (const a of shown) pickedAccts.add(a.Id); else pickedAccts.clear();
    renderList();
  });
  const toHide = recs.filter((a) => !isHidden(a.Id)), toShow = recs.filter((a) => isHidden(a.Id));
  const btn = (name, text, title, enabled, onclick) =>
    el('button', { title, 'aria-label': title, disabled: !enabled, onclick }, icon(name), text);
  const plural = (n) => `${n} account${n === 1 ? '' : 's'}`;
  bar.replaceChildren(
    el('label', { title: 'Select all accounts in the list' }, all, el('span', {}, recs.length ? `${recs.length.toLocaleString()} selected` : 'All')),
    btn('hide', null, toHide.length ? `Hide ${plural(toHide.length)}` : 'Hide selected accounts', toHide.length, () => hideAccts(toHide, true)),
    btn('unhide', null, toShow.length ? `Unhide ${plural(toShow.length)}` : 'Unhide selected hidden accounts', toShow.length, () => hideAccts(toShow, false)),
    btn('person', 'SE', recs.length ? `Change the SE on ${plural(recs.length)} and their open opportunities` : 'Change SE on selected accounts', recs.length, () => bulkChangeRole(recs, 'se')),
    btn('person', 'Rep', recs.length ? `Change the sales rep on ${plural(recs.length)} and their open opportunities` : 'Change Rep on selected accounts', recs.length, () => bulkChangeRole(recs, 'rep')),
  );
}

async function hideAccts(list, hide) {
  const n = list.length, what = n === 1 ? `"${list[0].Name}"` : `these ${n.toLocaleString()} accounts`;
  if (!confirm(hide ? `Hide ${what}? They stay in Salesforce; tick "Show hidden" to see them again.` : `Unhide ${what}?`)) return;
  try { await setHiddenState('Account', list, hide); } catch (e) { return toast(e.message, 'err'); }
  pickedAccts.clear();
  renderList();
  // Hiding the open account closes it, unless hidden accounts are being shown.
  if (current && isHidden(current.account.Id) && !showHiddenAccts) {
    current = null;
    document.getElementById('detail').replaceChildren(el('div', { class: 'empty' }, 'Pick an account to see its details and opportunities.'));
  }
}

// ---------- Change Rep / Change SE ----------
// Pick a user, then make them the sales rep (owner) or Lead SE of the account and all its open opportunities.
async function changeRole(a, role) {
  const box = document.getElementById('reassignBox');
  const title = role === 'rep' ? 'Change Rep' : 'Change SE';
  const close = () => box.replaceChildren();
  const cancel = el('button', { onclick: close }, 'Cancel');
  const say = (...kids) => box.replaceChildren(el('section', {}, el('h3', {}, title), ...kids, el('div', { class: 'form-actions' }, cancel)));
  say(el('div', { class: 'empty' }, 'Loading…'));
  let d;
  try { d = await api(`/accounts/${a.Id}/reassign?role=${role}`); } catch (e) { return say(el('div', { class: 'empty' }, e.message)); }
  if (current?.account.Id !== a.Id) return;
  const who = d.label === 'Sales rep' ? 'sales rep' : 'Lead SE';

  const go = el('button', { class: 'primary', disabled: true }, 'Assign');
  const pk = personPicker(who, () => { go.disabled = !pk.picked; showPlan(); });
  const search = pk.input;
  let picked = null;

  const opps = d.opportunities;
  const lines = [
    d.accountField ? `Account: ${d.account.Name} (now ${d.account.current || 'nobody'})` : null,
    ...opps.map((o) => `${o.Name} (now ${o.current || 'nobody'})`),
  ].filter(Boolean);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  // What picking `u` would do: which records change and which already have them.
  const has = (value, isUser, u) => value != null && (isUser ? String(value).slice(0, 15) === u.Id.slice(0, 15)
    : String(value).toLowerCase() === u.Name.toLowerCase());
  const plan = (u) => {
    const acctChanges = d.accountField && !has(d.account.value, d.accountIsUser, u);
    const oppChanges = opps.filter((o) => !has(o.value, d.oppIsUser, u));
    const oppHave = opps.length - oppChanges.length;
    // Always say what happens to the account first, then the opportunities.
    const acct = !d.accountField ? `The account has no ${who} field, so it stays as it is.`
      : acctChanges ? `The account ${d.account.Name} will change from ${d.account.current || 'nobody'} to ${u.Name}.`
      : `The account ${d.account.Name} already has ${u.Name} and stays as it is.`;
    const oppParts = [
      d.oppField ? `${plural(oppChanges.length, 'open opportunity', 'open opportunities')} will change to ${u.Name}.` : null,
      oppHave ? `${plural(oppHave, 'open opportunity already has', 'open opportunities already have')} ${u.Name} and will be skipped.` : null,
      d.closedCount ? `${plural(d.closedCount, 'closed opportunity', 'closed opportunities')} will be left alone.` : null,
    ].filter(Boolean);
    return { count: (acctChanges ? 1 : 0) + oppChanges.length, acct, opps: oppParts.join(' ') };
  };
  const summary = el('div', { class: 'sub', style: 'margin:8px 0 0' });
  // Who holds the role now; replaced by the summary once a person is picked.
  const list = el('ul', { class: 'reassign-list' }, lines.map((l) => el('li', {}, l)));
  const showPlan = () => {
    picked = pk.picked;
    list.hidden = !!picked;
    if (!picked) return summary.replaceChildren();
    const p = plan(picked);
    summary.replaceChildren(el('div', {}, el('b', {}, p.acct)), el('div', {}, p.opps),
      ...(p.count ? [] : [el('div', {}, `Nothing to change: everything already has ${picked.Name}.`)]));
    go.disabled = !p.count;
  };
  go.addEventListener('click', async () => {
    const u = picked;
    if (!u) return;
    const p = plan(u);
    if (!p.count) return;
    if (!confirm(`Make ${u.Name} the ${who}?\n\n${p.acct} ${p.opps}`)) return;
    go.disabled = search.disabled = cancel.disabled = true;
    try {
      const r = await api(`/accounts/${a.Id}/reassign`, { method: 'POST', body: { role, userId: u.Id, oppIds: opps.map((o) => o.Id) } });
      const done = `${u.Name} is now ${who} on ${r.updated.length + r.unchanged.length} of ${r.updated.length + r.unchanged.length + r.failed.length} records`;
      if (r.failed.length) toast(`${done}. ${r.failed.length} failed: ` + r.failed.map((f) => `${f.Name}: ${f.error}`).join('; '), 'err');
      else toast(done + '.', 'ok');
      close();
      openAccount(a.Id);
    } catch (e) { toast(e.message, 'err'); go.disabled = search.disabled = cancel.disabled = false; }
  });

  const notes = [];
  if (!d.accountField) notes.push(`Accounts have no ${who} field, so only the opportunities change.`);
  if (!d.oppField) notes.push(`Opportunities have no ${who} field, so only the account changes.`);
  box.replaceChildren(el('section', {},
    el('h3', {}, title),
    el('div', { class: 'sub' }, `Pick the new ${who} for ${d.account.Name}` +
      (d.oppField ? ` and its ${opps.length} open ${opps.length === 1 ? 'opportunity' : 'opportunities'}` : '') + '. ' + notes.join(' ')),
    pk.node,
    summary,
    list,
    el('div', { class: 'form-actions' }, cancel, go),
  ));
  search.focus();
}

// A type-to-search box that picks one active user: matches drop down under it while typing.
// `onChange` runs whenever the pick changes (picked, or cleared by typing).
function personPicker(who, onChange) {
  const search = el('input', { type: 'text', placeholder: `Type a name to pick the ${who}…`, 'aria-label': `New ${who}`,
    role: 'combobox', 'aria-autocomplete': 'list', autocomplete: 'off' });
  const results = el('ul', { class: 'pick-list', role: 'listbox', hidden: true });
  let users = [], picked = null, active = -1, timer, seq = 0;
  const showList = () => {
    results.hidden = !users.length && !search.value.trim();
    results.replaceChildren(...(users.length ? users.map((u, i) => el('li', {
      role: 'option', class: i === active ? 'on' : null,
      onmousedown: (e) => { e.preventDefault(); choose(u); },
    }, el('b', {}, u.Name), u.Title ? el('span', {}, u.Title) : null))
      : search.value.trim().length >= 2 ? [el('li', { class: 'none' }, 'No active users match')] : []));
    if (!results.children.length) results.hidden = true;
  };
  const choose = (u) => {
    picked = u; search.value = u.Name; users = []; active = -1;
    results.hidden = true; onChange();
  };
  const find = async () => {
    const q = search.value.trim(), n = ++seq;
    if (q.length < 2) { users = []; return showList(); }
    try {
      const found = await api('/users?q=' + encodeURIComponent(q));
      if (n !== seq) return;
      users = found; active = users.length ? 0 : -1;
      showList();
    } catch (e) { toast(e.message, 'err'); }
  };
  search.addEventListener('input', () => {
    if (picked) { picked = null; onChange(); }
    clearTimeout(timer); timer = setTimeout(find, 250);
  });
  search.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!users.length) return;
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : users.length - 1)) % users.length;
      showList();
    } else if (e.key === 'Enter' && users[active]) { e.preventDefault(); choose(users[active]); }
    else if (e.key === 'Escape') { users = []; results.hidden = true; }
  });
  search.addEventListener('blur', () => { results.hidden = true; });
  search.addEventListener('focus', () => { if (users.length) showList(); });
  return { node: el('div', { class: 'pick' }, search, results), input: search, get picked() { return picked; } };
}

// Change Rep / Change SE on every ticked account in the list and all of their open opportunities:
// pick a person, read one combined summary with counts, confirm, then apply.
async function bulkChangeRole(recs, role) {
  const detail = document.getElementById('detail');
  const n = recs.length, accts = `${n.toLocaleString()} account${n === 1 ? '' : 's'}`;
  const title = `${role === 'rep' ? 'Change Rep' : 'Change SE'} on ${accts}`;
  const close = () => {
    if (current) return renderDetail();
    detail.replaceChildren(el('div', { class: 'empty' }, 'Pick an account to see its details and opportunities.'));
  };
  const cancel = el('button', { onclick: close }, 'Cancel');
  const say = (...kids) => detail.replaceChildren(el('section', {}, el('h3', {}, title), ...kids, el('div', { class: 'form-actions' }, cancel)));
  document.querySelector('main')?.classList.add('has-detail');
  say(el('div', { class: 'empty' }, el('span', { class: 'spin dark', 'aria-hidden': 'true' }), ' Loading the accounts and their open opportunities…'));
  const token = {};
  bulkChangeRole.token = token;
  let d;
  try { d = await api('/accounts/reassign-preview', { method: 'POST', body: { role, ids: recs.map((a) => a.Id) } }); }
  catch (e) { return say(el('div', { class: 'empty' }, e.message)); }
  if (bulkChangeRole.token !== token) return;
  const who = d.label === 'Sales rep' ? 'sales rep' : 'Lead SE';
  const plural = (k, one, many) => `${k.toLocaleString()} ${k === 1 ? one : many}`;
  const has = (value, isUser, u) => value != null && (isUser ? String(value).slice(0, 15) === u.Id.slice(0, 15)
    : String(value).toLowerCase() === u.Name.toLowerCase());
  const plan = (u) => {
    const acctChange = d.accountField ? d.accounts.filter((a) => !has(a.value, d.accountIsUser, u)) : [];
    const oppChange = d.opportunities.filter((o) => !has(o.value, d.oppIsUser, u));
    const acctHave = d.accountField ? d.accounts.length - acctChange.length : 0, oppHave = d.opportunities.length - oppChange.length;
    const acct = [
      !d.accountField ? `Accounts have no ${who} field, so the accounts stay as they are.`
        : acctChange.length ? `${plural(acctChange.length, 'account', 'accounts')} will change to ${u.Name}.` : null,
      acctHave ? `${plural(acctHave, 'account already has', 'accounts already have')} ${u.Name} and will be skipped.` : null,
    ].filter(Boolean).join(' ');
    const opps = [
      d.oppField && (oppChange.length || !oppHave) ? `${plural(oppChange.length, 'open opportunity', 'open opportunities')} will change to ${u.Name}.` : null,
      oppHave ? `${plural(oppHave, 'open opportunity already has', 'open opportunities already have')} ${u.Name} and will be skipped.` : null,
      d.closedCount ? `${plural(d.closedCount, 'closed opportunity', 'closed opportunities')} will be left alone.` : null,
    ].filter(Boolean).join(' ');
    return { count: acctChange.length + oppChange.length, acct, opps };
  };

  const go = el('button', { class: 'primary', disabled: true }, 'Assign');
  const summary = el('div', { class: 'sub', style: 'margin:8px 0 0' });
  // Who holds the role on each account now; replaced by the summary once a person is picked.
  const oppCount = new Map();
  for (const o of d.opportunities) oppCount.set(o.AccountId, (oppCount.get(o.AccountId) || 0) + 1);
  const list = el('ul', { class: 'reassign-list' }, d.accounts.map((a) => el('li', {},
    `${a.Name}` + (d.accountField ? ` (now ${a.current || 'nobody'})` : '') +
    (d.oppField ? `, ${plural(oppCount.get(a.Id) || 0, 'open opportunity', 'open opportunities')}` : ''))));
  const pk = personPicker(who, () => {
    const u = pk.picked;
    list.hidden = !!u;
    if (!u) { go.disabled = true; return summary.replaceChildren(); }
    const p = plan(u);
    summary.replaceChildren(el('div', {}, el('b', {}, p.acct)), el('div', {}, p.opps),
      ...(p.count ? [] : [el('div', {}, `Nothing to change: everything already has ${u.Name}.`)]));
    go.disabled = !p.count;
  });
  go.addEventListener('click', async () => {
    const u = pk.picked;
    if (!u) return;
    const p = plan(u);
    if (!p.count) return;
    if (!confirm(`Make ${u.Name} the ${who} on ${accts}?\n\n${p.acct} ${p.opps}`)) return;
    go.disabled = pk.input.disabled = cancel.disabled = true;
    go.replaceChildren(el('span', { class: 'spin', 'aria-hidden': 'true' }), ' Assigning…');
    try {
      const r = await api('/accounts/reassign-bulk', { method: 'POST', body: { role, userId: u.Id, ids: d.accounts.map((a) => a.Id) } });
      const total = r.updated.length + r.unchanged.length + r.failed.length;
      const done = `${u.Name} is now ${who} on ${(r.updated.length + r.unchanged.length).toLocaleString()} of ${total.toLocaleString()} records`;
      if (r.failed.length) toast(`${done}. ${r.failed.length} failed: ` + r.failed.slice(0, 5).map((f) => `${f.Name}: ${f.error}`).join('; ') +
        (r.failed.length > 5 ? `; and ${r.failed.length - 5} more` : ''), 'err');
      else toast(done + '.', 'ok');
      pickedAccts.clear();
      reloadAccounts();
      if (current && d.accounts.some((a) => a.Id === current.account.Id)) openAccount(current.account.Id);
      else close();
    } catch (e) {
      toast(e.message, 'err');
      go.replaceChildren('Assign');
      go.disabled = pk.input.disabled = cancel.disabled = false;
    }
  });

  const notes = [];
  if (!d.accountField) notes.push(`Accounts have no ${who} field, so only the opportunities change.`);
  if (!d.oppField) notes.push(`Opportunities have no ${who} field, so only the accounts change.`);
  detail.replaceChildren(el('section', {},
    el('h3', {}, title),
    el('div', { class: 'sub' }, `Pick the new ${who} for ${accts}` +
      (d.oppField ? ` and their ${plural(d.opportunities.length, 'open opportunity', 'open opportunities')}` : '') + '. ' + notes.join(' ')),
    pk.node,
    summary,
    list,
    el('div', { class: 'form-actions' }, cancel, go),
  ));
  pk.input.focus();
}

// ---------- account Deal Supports ----------
// Everyone's Deal Supports on this account and its opportunities for the last 30, 60 or 90 days or this
// fiscal year: count, hours and the list (newest first; click one to open it in Salesforce).
let acctDsRange = '90', acctDsGroup = false;
async function loadAccountDealSupports(accountId) {
  const sec = document.getElementById('acctDs');
  if (acctDsEdit.accountId !== accountId) Object.assign(acctDsEdit, { accountId, editing: null });
  if (!acctDsEdit.editing) sec.replaceChildren(el('h3', {}, 'Deal Supports'), el('div', { class: 'empty' }, 'Loading…'));
  const today = todayStr(), fyStart = `${fiscal(today).fy - 1}-02-01`;
  const since = [addDays(today, -90), fyStart].sort()[0];
  try {
    const [data] = await Promise.all([api(`/accounts/${accountId}/deal-supports?since=${since}`),
      dsMeta ? null : api('/deal-supports/meta').then((m) => { dsMeta = m; }, () => {})]);
    data.accountId = accountId;
    if (document.getElementById('acctDs') === sec && current?.account.Id === accountId) renderAccountDealSupports(data, fyStart);
  } catch (e) {
    sec.replaceChildren(el('h3', {}, 'Deal Supports'), el('div', { class: 'empty' }, e.message));
  }
}

function renderAccountDealSupports(data, fyStart) {
  const sec = document.getElementById('acctDs');
  const today = todayStr();
  const ranges = { 30: ['Last 30 days', addDays(today, -30)], 60: ['Last 60 days', addDays(today, -60)],
    90: ['Last 90 days', addDays(today, -90)], fy: [`${fyName(fiscal(today).fy)} to date`, fyStart] };
  const [rangeLabel, from] = ranges[acctDsRange];
  const toHours = (v) => v == null || v === '' ? 0
    : data.hoursUnit === 'text' ? parseDuration(v) : data.hoursUnit === 'minutes' ? Number(v) / 60 : Number(v) || 0;
  const list = data.records.filter((r) => r.date && r.date >= from && r.date <= today);
  const total = list.reduce((s, r) => s + toHours(r.hours), 0);
  const seg = el('span', { class: 'seg' }, Object.entries({ 30: '30 days', 60: '60 days', 90: '90 days', fy: fyName(fiscal(today).fy) })
    .map(([k, t]) => el('button', { class: acctDsRange === k ? 'on' : null, onclick: () => { acctDsRange = k; renderAccountDealSupports(data, fyStart); } }, t)));
  const showRole = list.some((r) => r.role);
  const showActivity = !!data.activityLabel;
  // The opportunity only when it tells rows apart: not when they're all on one, nor when the name already says it.
  const opps = new Set(list.map((r) => r.oppId));
  // Grouped by opportunity (the default), each group's subtotal names it, so the column isn't needed.
  const bySe = acctDsGroup && !!data.whoLabel;
  const showOpp = bySe && opps.size > 1 && list.some((r) => r.oppName && !String(r.Name || '').toLowerCase().includes(r.oppName.toLowerCase()));
  // The record number only (e.g. "DR-012345" -> "012345") keeps the first column narrow; the full name is its tooltip.
  const canEdit = !!dsMeta?.canUpdate;
  const ncols = 3 + showActivity + showOpp + !!data.whoLabel + showRole + canEdit;
  const edit = (r) => editDealSupport(r.Id, acctDsEdit, () => renderAccountDealSupports(data, fyStart), () => loadAccountDealSupports(data.accountId));
  const row = (r) => el('tr', { class: 'nolink' + (acctDsEdit.editing?.id === r.Id ? ' sel' : '') },
    canEdit ? editPencil(r.Name, () => edit(r)) : null,
    el('td', {}, el('a', { href: `${me.instanceUrl}/${r.Id}`, target: '_blank', rel: 'noopener', title: `${r.Name || r.Id} · Open in Salesforce` }, dsNum(r.Name) || r.Id)),
    el('td', {}, r.date),
    showActivity ? el('td', { class: 'wrap' }, r.activity) : null,
    showOpp ? el('td', { class: 'wrap' }, r.oppName) : null,
    data.whoLabel ? el('td', {}, r.who) : null,
    showRole ? el('td', {}, r.role) : null,
    el('td', { class: 'n' }, fmtH(toHours(r.hours))));
  const sumRow = (text, rows, cls) => el('tr', { class: 'nolink ' + cls },
    el('td', { colspan: ncols - 1 }, `${text} (${rows.length})`),
    el('td', { class: 'n' }, fmtH(rows.reduce((s, r) => s + toHours(r.hours), 0))));
  const tbody = el('tbody');
  const blocks = [];
  {
    // One block per opportunity (or per Assigned SE when ticked), A–Z, each ending in its subtotal.
    const groups = new Map();
    for (const r of list) {
      const k = (bySe ? r.who : r.oppName) || '(none)';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    for (const [k, rows] of [...groups].sort((x, y) => x[0].localeCompare(y[0]))) {
      blocks.push([k, rows]);
      tbody.append(...rows.map(row), sumRow(`Subtotal ${k}`, rows, 'subtotal'));
    }
  }
  if (!list.length) tbody.append(el('tr', {}, el('td', { colspan: ncols, class: 'empty' }, `No ${data.labelPlural.toLowerCase()} in this period.`)));
  const group = data.whoLabel ? el('label', { class: 'selbar' }, el('input', { type: 'checkbox', checked: acctDsGroup,
    onchange: (e) => { acctDsGroup = e.target.checked; renderAccountDealSupports(data, fyStart); } }), `Group by ${data.whoLabel}`) : null;
  sec.replaceChildren(
    el('h3', {}, `${data.labelPlural}: ${rangeLabel}`, el('span', { class: 'spacer' }), group, seg,
      el('button', { disabled: !list.length, onclick: () => exportAccountDealSupports(data, blocks, bySe, toHours, rangeLabel) }, 'Export to Excel')),
    el('div', { class: 'tiles', style: 'grid-template-columns:repeat(2, minmax(0, 220px));margin-bottom:12px' },
      el('div', { class: 'tile' }, el('div', { class: 'k' }, data.labelPlural), el('div', { class: 'v' }, list.length.toLocaleString())),
      el('div', { class: 'tile' }, el('div', { class: 'k' }, data.hoursLabel), el('div', { class: 'v' }, fmtH(total)))),
    acctDsEdit.editing?.box || '',
    el('div', { class: 'tablewrap' }, el('table', { class: 'deals' },
      el('thead', {}, el('tr', {}, canEdit ? el('th', { 'aria-label': 'Edit' }) : null, el('th', {}, '#'), el('th', {}, data.dateLabel),
        showActivity ? el('th', {}, data.activityLabel) : null, showOpp ? el('th', {}, 'Opportunity') : null,
        data.whoLabel ? el('th', {}, data.whoLabel) : null, showRole ? el('th', {}, 'Role') : null, el('th', { class: 'n' }, 'Hours'))),
      tbody,
      list.length ? el('tfoot', {}, sumRow('Total', list, '')) : null)),
  );
}

// The panel's rows as shown (same period and grouping), with full names, subtotals, the total and links.
function exportAccountDealSupports(data, blocks, bySe, toHours, rangeLabel) {
  const showRole = blocks.some(([, rows]) => rows.some((r) => r.role));
  const cols = [
    { header: data.label, width: 34 }, { header: data.dateLabel, type: 'date', width: 13 },
    ...(data.activityLabel ? [{ header: data.activityLabel, width: 22 }] : []), { header: 'Opportunity', width: 36 },
    ...(data.whoLabel ? [{ header: data.whoLabel, width: 22 }] : []), ...(showRole ? [{ header: 'Role', width: 14 }] : []),
    { header: 'Hours', type: 'number', width: 10 }, { header: 'Salesforce link', width: 45 },
  ];
  const line = (r) => [r.Name || r.Id, r.date, ...(data.activityLabel ? [r.activity] : []), r.oppName,
    ...(data.whoLabel ? [r.who] : []), ...(showRole ? [r.role] : []), toHours(r.hours), `${me.instanceUrl}/${r.Id}`];
  const sumLine = (label, rows) => ({ bold: true, values: [label, ...Array(cols.length - 3).fill(''), rows.reduce((s, r) => s + toHours(r.hours), 0), ''] });
  const rows = [];
  for (const [k, list] of blocks) rows.push(...list.map(line), sumLine(`Subtotal ${k}`, list));
  rows.push(sumLine('Total', blocks.flatMap(([, list]) => list)));
  const acct = current?.account?.Name || 'Account';
  downloadXlsx(`${acct} - ${data.labelPlural} - ${rangeLabel}${bySe ? ' by SE' : ''} - ${todayStr()}.xlsx`.replace(/[\\/:*?"<>|]/g, '-'),
    data.labelPlural, cols, rows)
    .catch((e) => toast("Couldn't build the Excel file: " + e.message, 'err'));
}

function renderOpps() {

  // Hidden ones go first (unless "Show hidden"), then closed ones (unless "Show closed").
  const visible = showHiddenOpps ? all : all.filter((o) => !isHidden(o.Id));
  const hiddenCount = all.length - visible.length;
  const shown = showClosed ? visible : visible.filter((o) => !o.IsClosed);
  const closed = visible.length - visible.filter((o) => !o.IsClosed).length;
  for (const id of [...pickedOpps]) if (!shown.some((o) => o.Id === id)) pickedOpps.delete(id);
  const tbody = el('tbody', {}, shown.map(oppRow));

// Show a field value from a Deal Support record as text.
function dsText(f, v) {
  if (v == null || v === '') return '';
  if (f.type === 'boolean') return v ? 'Yes' : 'No';
  if (f.type === 'currency') return money(v);
  if (f.type === 'percent') return v + '%';
  if (f.type === 'datetime') return new Date(String(v).replace(/\+0000$/, 'Z')).toLocaleString();
  if (f.type === 'multipicklist') return String(v).split(';').join(', ');
  return String(v);
}

// Up to five columns for the list: the name, then required fields, then status/type-like picklists.
function dsColumns() {
  const name = dsMeta.fields.find((f) => f.name === 'Name');
  const rest = dsMeta.fields.filter((f) => f !== name && f.type !== 'textarea' && f.type !== 'reference');
  const picked = [...rest.filter((f) => f.required),
    ...rest.filter((f) => f.type === 'picklist' && /status|type|stage|request|product/i.test(f.name + f.label))];
  return [name, ...picked].filter((f, i, all) => f && all.indexOf(f) === i).slice(0, 5);
}
