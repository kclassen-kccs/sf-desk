  const sec = document.getElementById('dealSupports');
  const cols = dsColumns();
  const canEdit = dsMeta.canUpdate;
  const ncols = cols.length + 2 + (canEdit ? 1 : 0);
  const edit = (r) => editDealSupport(r.Id, oppDsEdit, () => renderDealSupports(o, records), () => loadDealSupports(o));
  const tbody = el('tbody');
  for (const r of records) {
    const more = el('tr', { class: 'ds-more', hidden: true }, el('td', { colspan: ncols },
      el('dl', {}, dsMeta.fields.filter((f) => r[f.name] != null && r[f.name] !== '' && f.type !== 'reference')
        .map((f) => el('div', {}, el('dt', {}, f.label), el('dd', {}, dsText(f, r[f.name]))))),
      el('a', { href: `${me.instanceUrl}/${r.Id}`, target: '_blank', rel: 'noopener' }, 'Open in Salesforce ↗'),
    ));
    tbody.append(
      el('tr', { class: 'ds-row' + (oppDsEdit.editing?.id === r.Id ? ' sel' : ''), onclick: () => { more.hidden = !more.hidden; } },
        canEdit ? editPencil(r.Name, () => edit(r)) : null,
        cols.map((f) => f.name === 'Name' ? dsNameCell(r.Name) : el('td', {}, dsText(f, r[f.name]) || '—')),
        el('td', {}, r.CreatedBy?.Name || ''),
        el('td', {}, shortDate(r.CreatedDate)),
      ),
      more,
    );
  }
  if (!records.length) tbody.append(el('tr', {}, el('td', { colspan: ncols, class: 'empty' }, `No ${dsMeta.labelPlural.toLowerCase()} on this opportunity yet.`)));

  const formBox = el('div');
  const add = dsMeta.canCreate ? el('button', { class: 'primary', onclick: () => {
    add.hidden = true;
    formBox.replaceChildren(dealSupportForm(o, () => { add.hidden = false; formBox.replaceChildren(); }));
  } }, `New ${dsMeta.label}`) : null;

  // Move My Time: on a closed opportunity, move my Deal Supports to an open one on the same account.
  const moveBox = el('div');
  const move = o.IsClosed && dsMeta.canUpdate && dsMeta.oppUpdateable ? el('button', { onclick: () => {
    move.hidden = true;
    moveMyTime(o, moveBox, () => { move.hidden = false; moveBox.replaceChildren(); });
  } }, 'Move My Time') : null;

  sec.replaceChildren(
    el('h3', {}, `${dsMeta.labelPlural} (${records.length})`, el('span', { class: 'spacer' }),
      el('button', { onclick: () => loadDealSupports(o) }, 'Reload'), move, add),
    moveBox,
    formBox,
    oppDsEdit.editing?.box || '',
    el('div', { class: 'tablewrap' }, el('table', {},
      el('thead', {}, el('tr', {}, canEdit ? el('th', { 'aria-label': 'Edit' }) : null, cols.map((f) => el('th', {}, f.label)), el('th', {}, 'Created by'), el('th', {}, 'Created'))),
      tbody,
    )),
  );
}

// Pick an open opportunity on the same account, confirm, then move every Deal Support of mine on `o` to it.
async function moveMyTime(o, box, close) {
  box.replaceChildren(el('section', {}, el('h3', {}, 'Move My Time'), el('div', { class: 'empty' }, 'Loading…')));
  let d;
  try { d = await api(`/opportunities/${o.Id}/move-time`); } catch (e) { toast(e.message, 'err'); return close(); }
  const toHours = (v) => v == null || v === '' ? 0 : d.hoursUnit === 'text' ? parseDuration(v) : d.hoursUnit === 'minutes' ? Number(v) / 60 : Number(v) || 0;
  const total = d.records.reduce((s, r) => s + toHours(r.hours), 0);
  const hrs = total.toLocaleString(undefined, { maximumFractionDigits: 2 });
  const plural = d.records.length === 1 ? d.label : d.labelPlural;
  const cancel = el('button', { onclick: close }, 'Cancel');
  const say = (...kids) => box.replaceChildren(el('section', {}, el('h3', {}, 'Move My Time'), ...kids, el('div', { class: 'form-actions' }, cancel)));
  if (!d.records.length) return say(el('div', { class: 'empty' }, `You have no ${d.labelPlural.toLowerCase()} on this opportunity (${d.mineLabel} = you).`));
  if (!d.targets.length) return say(el('div', { class: 'empty' }, `${d.from.accountName || 'This account'} has no open opportunities to move your time to.`));
  const pick = el('select', { 'aria-label': 'Open opportunity' }, el('option', { value: '' }, 'Pick an open opportunity…'),
    d.targets.map((t) => el('option', { value: t.Id }, [t.Name, t.StageName, t.CloseDate && `closes ${t.CloseDate}`].filter(Boolean).join(' · '))));
  const go = el('button', { class: 'primary', disabled: true }, 'Move');
  pick.addEventListener('change', () => { go.disabled = !pick.value; });
  go.addEventListener('click', async () => {
    const to = d.targets.find((t) => t.Id === pick.value);
    if (!to) return;
    const stay = d.others ? `\n\nOnly yours move. ${d.others === 1 ? `1 ${d.label} belonging to someone else stays` : `${d.others} ${d.labelPlural} belonging to other people stay`} on "${d.from.Name}".`
      : '\n\nOnly yours move.';
    if (!confirm(`Move ${d.records.length} ${plural} (${hrs} hours) of yours\nfrom "${d.from.Name}"\nto "${to.Name}"?${stay}`)) return;
    go.disabled = pick.disabled = cancel.disabled = true;
    try {
      const r = await api('/deal-supports/move', { method: 'POST', body: { fromOppId: o.Id, toOppId: to.Id, ids: d.records.map((x) => x.Id) } });
      if (r.failed.length) {
        toast(`Moved ${r.moved.length}; ${r.failed.length} failed: ` + r.failed.map((f) => `${f.Name}: ${f.error}`).join('; '), 'err');
      } else toast(`Moved ${r.moved.length} ${r.moved.length === 1 ? d.label : d.labelPlural} to "${to.Name}"`, 'ok');
      close();
      loadDealSupports(o);
    } catch (e) { toast(e.message, 'err'); go.disabled = pick.disabled = cancel.disabled = false; }
  });
  box.replaceChildren(el('section', {},
    el('h3', {}, 'Move My Time'),
    el('div', { class: 'sub' }, `${d.records.length} ${plural} of yours on this opportunity, ${hrs} hours in all. ` +
      (d.others ? `${d.others} belonging to other people ${d.others === 1 ? 'stays' : 'stay'} here. ` : '') +
      `Pick an open opportunity on ${d.from.accountName || 'this account'} to move them to.`),
    el('label', { style: 'display:block;margin-top:8px' }, pick),
    el('div', { class: 'form-actions' }, cancel, go),
  ));
}

// Multi-select picklists picked one value at a time here, as a dropdown like Role.
const singlePick = (f) => f.type === 'multipicklist' && (f.name === 'Platform_Request__c' || /^platform request$/i.test(f.label));

function dsInput(f) {
  let n;
  if (f.type === 'picklist' || f.type === 'multipicklist') {
    const multiple = f.type === 'multipicklist' && !singlePick(f);
    n = el('select', { multiple },
      !multiple ? el('option', { value: '' }, '—') : null,
      (f.picklist || []).map((v) => el('option', { value: v }, v)));
  } else if (f.type === 'boolean') {
    n = el('input', { type: 'checkbox' });
  } else if (f.type === 'textarea') {
    n = el('textarea', { rows: 3, maxlength: f.length });
  } else {
    const type = { date: 'date', datetime: 'datetime-local', double: 'number', currency: 'number', percent: 'number',
      int: 'number', email: 'email', url: 'url', phone: 'tel' }[f.type] || 'text';
    n = el('input', { type, step: type === 'number' ? 'any' : null, maxlength: type === 'text' ? f.length : null,
      placeholder: f.type === 'reference' ? `${f.referenceTo?.[0] || 'Record'} Id` : null });
  }
  if (f.defaultValue != null) {
    if (f.type === 'boolean') n.checked = f.defaultValue === true || f.defaultValue === 'true';
    else if (typeof f.defaultValue !== 'object') n.value = f.defaultValue;
  }
  n.setAttribute('aria-label', f.label);
  return n;
}

function dsValue(f, n) {
  if (f.type === 'boolean') return n.checked;
  if (f.type === 'multipicklist') return [...n.selectedOptions].map((x) => x.value).join(';') || null;
  if (n.value === '') return null;
  if (['double', 'currency', 'percent', 'int'].includes(f.type)) return Number(n.value);
  if (f.type === 'datetime') return new Date(n.value).toISOString();
  return n.value;
}

// opts.values prefills fields by name; opts.submit(fields) does the create instead of posting to `o`
// (My Calendar uses both); opts.title replaces the heading. opts.edit makes it an edit form for the
// record in opts.values: fields Salesforce won't let you change are read-only, and submit gets only
// the changed fields (null for a cleared one).
function dealSupportForm(o, close, opts = {}) {
  const fields = dsMeta.fields.filter((f) => f.createable);
  const inputs = new Map(fields.map((f) => [f, dsInput(f)]));
  for (const [f, n] of inputs) {
    if (opts.edit) {
      if (f.type === 'boolean') n.checked = false; else if (!n.multiple) n.value = '';
      if (f.updateable === false) n.disabled = true;
    }
    const v = opts.values?.[f.name];
    if (v == null || v === '') continue;
    if (f.type === 'boolean') n.checked = !!v;
    else if (f.type === 'multipicklist' && n.multiple) for (const x of n.options) x.selected = String(v).split(';').includes(x.value);
    else if (f.type === 'multipicklist') n.value = String(v).split(';')[0];
    else if (f.type === 'datetime') n.value = `${localDay(new Date(v))}T${hhmm24(new Date(v))}`;
    else n.value = v;
  }
  // opts.derived fills one field from others as they change, e.g. the details from the activity and platform,
  // until it is typed in.
  if (opts.derived) {
    const { field, from, value } = opts.derived;
    const target = fields.find((f) => f.name === field), srcs = from.map((n) => fields.find((f) => f.name === n)).filter(Boolean);
    if (target && srcs.length) {
      const t = inputs.get(target);
      let typed = false;
      t.addEventListener('input', () => { typed = true; });
      const update = () => { if (!typed) t.value = value(srcs.map((f) => dsText(f, dsValue(f, inputs.get(f))))); };
      for (const f of srcs) for (const ev of ['input', 'change']) inputs.get(f).addEventListener(ev, update);
      update();
    }
  }
  const initial = new Map([...inputs].map(([f, n]) => [f, JSON.stringify(dsValue(f, n))]));
  // opts.changes: values put in after loading, so they are saved as edits (e.g. a cleaned-up description).
  for (const [name, v] of Object.entries(opts.changes || {})) {
    const f = fields.find((x) => x.name === name), n = f && inputs.get(f);
    if (n && !n.disabled) n.value = v;
  }
  // A lookup on a saved record shows its record's name, with the Id it holds underneath (until it's changed).
  const refName = (f) => {
    const name = opts.edit && f.relationshipName && opts.values?.[f.relationshipName]?.Name;
    if (!name) return null;
    const n = inputs.get(f), id = n.value;
    const note = el('span', { class: 'sub', style: 'margin:2px 0 0;display:block' }, 'Id: ' + id);
    const show = el('b', { style: 'display:block;padding:6px 0' }, name);
    n.hidden = true;
    const change = el('button', { type: 'button', class: 'linkish', style: 'display:inline;margin-left:8px' }, 'Change');
    change.addEventListener('click', (ev) => { ev.preventDefault(); n.hidden = false; show.remove(); note.remove(); change.remove(); n.focus(); });
    return [show, note, n.disabled ? null : change];
  };
  const cell = (f) => el('label', { class: f.type === 'textarea' ? 'wide' : null },
    el('span', {}, f.label, f.required ? el('span', { class: 'req' }, ' *') : null), inputs.get(f), refName(f));
  // Shown up front: required fields and Description of Request, then the time fields (customer-facing,
  // internal, travel) with a live total.
  const time = fields.filter((f) => f.timeEntry);
  const required = fields.filter((f) => (f.required || f.upFront) && !f.timeEntry);
  const optional = fields.filter((f) => !f.required && !f.upFront && !f.timeEntry);
  const total = el('output', { style: 'display:block;padding:6px 0;font-weight:600' });
  const showTotal = () => {
    const h = time.reduce((s, f) => s + (Number(inputs.get(f).value) || 0), 0);
    total.textContent = h.toLocaleString(undefined, { maximumFractionDigits: 2 });
  };
  for (const f of time) inputs.get(f).addEventListener('input', showTotal);
  showTotal();
  const create = el('button', { class: 'primary' }, opts.edit ? 'Save changes' : `Create ${dsMeta.label}`);
  // opts.remove deletes the record, after asking.
  const remove = el('button', { class: 'danger', style: 'margin-right:auto' }, 'Remove');
  remove.addEventListener('click', async () => {
    if (!confirm(`Remove this ${dsMeta.label} from Salesforce? This can't be undone here.`)) return;
    remove.disabled = create.disabled = true;
    try { await opts.remove(); } catch (e) { toast(e.message, 'err'); remove.disabled = create.disabled = false; }
  });
  const box = el('section', {},
    el('h3', {}, opts.title || `New ${dsMeta.label} for ${o.Name}`),
    el('div', { class: 'grid' }, required.map(cell)),
    time.length ? el('div', { class: 'grid', style: 'margin-top:10px' }, time.map(cell),
      time.length > 1 ? el('label', {}, el('span', {}, 'Total time'), total) : null) : null,
    optional.length ? el('details', { class: 'optional' },
      el('summary', {}, `More fields (${optional.length})`), el('div', { class: 'grid' }, optional.map(cell))) : null,
    el('div', { class: 'form-actions' }, opts.remove ? remove : null, el('button', { onclick: close }, 'Cancel'), create),
  );
  create.addEventListener('click', async () => {
    const body = {}, now = new Map();
    for (const [f, n] of inputs) {
      const v = dsValue(f, n);
      now.set(f, v);
      if (opts.edit) { if (!n.disabled && JSON.stringify(v) !== initial.get(f)) body[f.name] = v; }
      else if (v !== null && !(f.type === 'boolean' && v === false && f.defaultValue !== true)) body[f.name] = v;
    }
    const missing = fields.filter((f) => f.required && now.get(f) == null);
    if (missing.length) return toast('Required: ' + missing.map((f) => f.label).join(', '), 'err');
    create.disabled = true;
    try {
      if (opts.submit) return await opts.submit(body);
      const rec = await api(`/opportunities/${o.Id}/deal-supports`, { method: 'POST', body: { fields: body } });
      toast(`Created ${dsMeta.label}${rec?.Name ? ` "${rec.Name}"` : ''} in Salesforce`, 'ok');
      loadDealSupports(o);
    } catch (e) {
      toast(e.message, 'err'); create.disabled = false;
      // Salesforce wants a field that sits under "More fields": open it so the field can be filled in.
      const named = optional.find((f) => e.message.includes(f.name) || e.message.includes(f.label));
      if (named) { box.querySelector('details.optional').open = true; inputs.get(named).focus(); }
    }
  });
  return box;
}

// ---------- dashboard ----------
// Statistics on the open opportunities in your list (hidden records left out): totals by stage,
// and the forecast by close date per fiscal month, quarter or year.
// The fiscal year starts Feb 1 and is named for the calendar year it ends in: FY27 = Feb 2026 – Jan 2027.
const FY_START = 1; // month index (0 = January)
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fyName = (fy) => 'FY' + String(fy % 100).padStart(2, '0');
// Forecast categories, bottom of the stack first, with their series colors.
const FORECAST = [['Commit'], ['Best Case'], ['Pipeline'], ['Omitted']];

function fiscal(date) { // 'YYYY-MM-DD' -> { y, m, fy, q }
  const y = Number(date.slice(0, 4)), m = Number(date.slice(5, 7)) - 1;
  const fy = m >= FY_START ? y + 1 : y;
  return { y, m, fy, q: Math.floor(((m - FY_START + 12) % 12) / 3) + 1 };
}
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const periodKey = (view, f) => view === 'year' ? fyName(f.fy)
  : view === 'quarter' ? `${fyName(f.fy)} Q${f.q}` : `${f.y}-${String(f.m + 1).padStart(2, '0')}`;
const amt = (o) => Number(o.Amount) || 0;
const sum = (list) => list.reduce((s, o) => s + amt(o), 0);
const weighted = (list) => list.reduce((s, o) => s + amt(o) * (Number(o.Probability) || 0) / 100, 0);
const compact = (n) => n.toLocaleString(undefined, { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: n >= 1e6 ? 1 : 0 });
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;

const dash = { all: [], view: 'month', fy: null, pick: null, filters: null, loads: 0 };

async function showDashboard() {
  setNav('dash');
  current = null;
  // The same BOAT, team and sales rep filters as the Accounts tab (and saved with them). The rep
  // filter is applied here, to each opportunity's account owner.
  const refilter = () => { loadDashboard(); dashReps(); };
  const filters = dash.filters = filterSelects({ onBoat: refilter, onTeam: refilter, onRep: () => renderDashboard() });
  ensureAcctFilters().then(() => {
    const before = JSON.stringify(filterQuery());
    fillBoatSelect(filters); fillTeamSelect(filters);
    if (JSON.stringify(filterQuery()) !== before) loadDashboard();
    dashReps();
  }).catch(() => {});
  document.getElementById('app').replaceChildren(el('div', { class: 'dash' },
    el('div', { class: 'dash-head' },
      el('h2', {}, 'Pipeline'),
      el('span', { class: 'picks' }, filters.boat, filters.team, filters.rep),
      el('span', { class: 'spacer', style: 'flex:1' }),
      el('button', { onclick: loadDashboard }, 'Reload'),
    ),
    el('div', { class: 'sub', id: 'dashSub' }, 'Loading…'),
    el('div', { id: 'dashBody' }),
  ));
  loadDashboard();
}

// The Deals tab's sales rep choices: the owners of the accounts the BOAT and team filters cover,
// else (offline, or until they load) the account owners of the opportunities loaded.
async function dashReps() {
  const f = dash.filters, key = JSON.stringify(filterQuery());
  try { await loadRepChoices(); } catch { /* use the opportunities' owners */ }
  if (!f?.rep.isConnected || JSON.stringify(filterQuery()) !== key) return;
  const before = repFilter;
  if (repChoices?.key === key) fillRepSelect(f, repChoices.reps);
  else {
    const byId = new Map(dash.all.filter((o) => o.Account?.OwnerId).map((o) => [o.Account.OwnerId, o.Account.Owner?.Name || o.Account.OwnerId]));
    fillRepSelect(f, [...byId].map(([value, label]) => ({ value, label })));
  }
  if (repFilter !== before) { saveAcctPrefs(); if (document.getElementById('dashBody')) renderDashboard(); }
}

async function loadDashboard() {
  const seq = ++dash.loads;
  try {
    const { opportunities } = await api('/pipeline?' + new URLSearchParams(filterQuery()));
    if (seq !== dash.loads) return; // a newer filter choice is loading
    dash.all = opportunities.filter((o) => o.CloseDate);
    if (document.getElementById('dashBody')) renderDashboard();
  } catch (e) {
    const sub = document.getElementById('dashSub');
    if (sub) sub.textContent = e.message;
  }
}

function renderDashboard() {
  document.getElementById('tip').style.display = 'none';
  const inRep = dash.all.filter((o) => !repFilter || o.Account?.OwnerId === repFilter);
  const opps = inRep.filter((o) => !isHidden(o.Id) && !isHidden(o.AccountId));
  const hiddenCount = inRep.length - opps.length;
  const today = todayStr(), now = fiscal(today);
  dash.fy ??= now.fy;
  document.getElementById('dashSub').textContent =
    `${plural(opps.length, 'open opportunity', 'open opportunities')} · ${filterText(dash.filters)}` +
    (hiddenCount ? `, not counting ${hiddenCount} hidden` : '') +
    ` · Fiscal years start Feb 1 and are named for the year they end in (${fyName(now.fy)} = Feb ${now.fy - 1} – Jan ${now.fy})`;

  const inQ = opps.filter((o) => { const f = fiscal(o.CloseDate); return f.fy === now.fy && f.q === now.q; });
  const inFy = opps.filter((o) => fiscal(o.CloseDate).fy === now.fy);
  const late = opps.filter((o) => o.CloseDate < today);
  const tile = (k, v, d, cls = '') => el('div', { class: 'tile ' + cls }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, v), el('div', { class: 'd' }, d));

  document.getElementById('dashBody').replaceChildren(
    el('div', { class: 'tiles' },
      tile('Open pipeline', compact(sum(opps)), `${money(sum(opps))} · ${plural(opps.length, 'opportunity', 'opportunities')}`, 'hero'),
      tile('Weighted pipeline', compact(weighted(opps)), 'Amount × probability'),
      tile(`This quarter (${fyName(now.fy)} Q${now.q})`, compact(sum(inQ)), `${plural(inQ.length, 'deal')} · ${compact(weighted(inQ))} weighted`),
      tile(`This fiscal year (${fyName(now.fy)})`, compact(sum(inFy)), `${plural(inFy.length, 'deal')} · ${compact(weighted(inFy))} weighted`),
      tile('Past close date', compact(sum(late)), late.length ? `⚠ ${plural(late.length, 'deal')} still open` : 'None overdue', late.length ? 'warn' : ''),
    ),
    el('div', { class: 'charts' },
      el('section', { id: 'stageChart' }),
      el('section', { id: 'forecastChart' }),
    ),
    el('section', { id: 'dealList' }),
  );
  renderStageChart(opps);
  renderForecastChart(opps, now, today);
  renderDeals(opps, today);
}

// Pipeline by stage: one horizontal bar per stage, in the org's stage order.
function renderStageChart(opps) {
  const sec = document.getElementById('stageChart');
  const by = new Map();
  for (const o of opps) {
    const k = o.StageName || 'No stage';
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(o);
  }
  const order = meta.picklists.StageName || [];
  const stages = [...by.keys()].sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));
  const max = Math.max(1, ...stages.map((k) => sum(by.get(k))));
  const pick = dash.pick?.kind === 'stage' ? dash.pick.key : null;
  const grid = el('div', { class: 'hbars' });
  for (const k of stages) {
    const list = by.get(k), total = sum(list);
    const choose = () => { dash.pick = pick === k ? null : { kind: 'stage', key: k, label: k }; renderDashboard(); };
    const dim = pick && pick !== k ? ' dim' : '';
    const track = el('div', { class: 'track' + dim, onclick: choose },
      el('div', { class: 'bar', style: `width: calc((100% - 96px) * ${total / max})` }),
      el('div', { class: 'val' }, compact(total), el('span', {}, ` · ${list.length}`)));
    hover(track, () => tipHtml(k, [['Total', money(total)], ['Weighted', money(weighted(list))], ['Opportunities', list.length]]));
    grid.append(el('div', { class: 'lbl' + dim, title: k, onclick: choose }, k), track);
  }
  sec.replaceChildren(el('h3', {}, 'Pipeline by stage'),
    stages.length ? grid : el('div', { class: 'empty' }, 'No open opportunities.'));
}

// Forecast by close date: stacked columns per fiscal month / quarter / year, by forecast category.
function renderForecastChart(opps, now, today) {
  const sec = document.getElementById('forecastChart');
  const view = dash.view;
  const fys = opps.map((o) => fiscal(o.CloseDate).fy);
  const minFy = Math.min(now.fy, ...fys), maxFy = Math.max(now.fy, ...fys);
  dash.fy = Math.min(maxFy, Math.max(minFy, dash.fy));

  // The periods to show, in order.
  let periods = [];
  if (view === 'month') {
    for (let i = 0; i < 12; i++) {
      const m = (FY_START + i) % 12, y = dash.fy - 1 + (FY_START + i >= 12 ? 1 : 0);
      periods.push({ key: periodKey('month', { y, m }), label: MONTHS[m], long: `${MONTHS[m]} ${y} (${fyName(dash.fy)})` });
    }
  } else {
    const lo = Math.min(...(opps.length ? fys : [now.fy])), hi = Math.max(now.fy, ...fys);
    for (let fy = Math.min(lo, now.fy); fy <= hi; fy++) {
      if (view === 'year') periods.push({ key: fyName(fy), label: fyName(fy), long: `${fyName(fy)} (Feb ${fy - 1} – Jan ${fy})` });
      else for (let q = 1; q <= 4; q++) periods.push({ key: `${fyName(fy)} Q${q}`, label: `Q${q} ${fyName(fy)}`, long: `${fyName(fy)} Q${q}` });
    }
    // Drop empty quarters at either end, but keep the current one.
    const nowKey = periodKey(view, now);
    const has = new Set(opps.map((o) => periodKey(view, fiscal(o.CloseDate))));
    while (periods.length > 1 && !has.has(periods[0].key) && periods[0].key !== nowKey) periods.shift();
    while (periods.length > 1 && !has.has(periods.at(-1).key) && periods.at(-1).key !== nowKey) periods.pop();
  }
  const byKey = new Map(periods.map((p) => [p.key, []]));
  for (const o of opps) byKey.get(periodKey(view, fiscal(o.CloseDate)))?.push(o);
  const nowKey = periodKey(view, now);

  // One series in the same blue as the other charts; the tooltip still splits it by forecast category.
  const cats = [['Amount', 'var(--s1)']];
  const catOf = () => 'Amount';
  const byCat = (list) => [...FORECAST.map(([c]) => c), 'Other'].map((c) => [c,
    sum(list.filter((o) => (FORECAST.some(([f]) => f === o.ForecastCategoryName) ? o.ForecastCategoryName : 'Other') === c))])
    .filter(([c, v]) => v > 0 && (c !== 'Other' || list.some((o) => o.ForecastCategoryName)));

  const seg = el('div', { class: 'seg' }, [['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year']].map(([v, t]) =>
    el('button', { class: view === v ? 'on' : null, onclick: () => { dash.view = v; dash.pick = null; renderDashboard(); } }, t)));
  const fynav = view === 'month' ? el('span', { class: 'fynav' },
    el('button', { disabled: dash.fy <= minFy, onclick: () => { dash.fy--; dash.pick = null; renderDashboard(); }, 'aria-label': 'Previous fiscal year' }, '‹'),
    fyName(dash.fy),
    el('button', { disabled: dash.fy >= maxFy, onclick: () => { dash.fy++; dash.pick = null; renderDashboard(); }, 'aria-label': 'Next fiscal year' }, '›')) : null;
  const legend = cats.length > 1 ? el('div', { class: 'legend' },
    cats.map(([c, color]) => el('span', {}, el('i', { style: `background:${color}` }), c))) : null;
  const box = el('div');
  sec.replaceChildren(el('h3', {}, 'Forecast by close date', el('span', { class: 'spacer' }), fynav, seg), legend || '', box);

  // Draw once the section is in the page, so its width is known.
  const W = Math.max(320, box.clientWidth || 600), H = 250, top = 18, bottom = 26, left = 46, right = 4;
  const totals = periods.map((p) => sum(byKey.get(p.key)));
  const ticks = niceTicks(Math.max(...totals, 1));
  const ymax = ticks.at(-1), plotH = H - top - bottom;
  const y = (v) => top + plotH - (v / ymax) * plotH;
  const slot = (W - left - right) / periods.length;
  const bw = Math.min(24, slot * 0.6);
  const pick = dash.pick?.kind === 'period' ? dash.pick.key : null;
  const g = svgEl('svg', { class: 'cols', viewBox: `0 0 ${W} ${H}`, height: H, role: 'img',
    'aria-label': 'Open pipeline by close date' });
  for (const t of ticks) {
    g.append(svgEl('line', { x1: left, x2: W - right, y1: y(t), y2: y(t), stroke: t ? 'var(--grid)' : 'var(--line)', 'stroke-width': 1 }),
      svgEl('text', { x: left - 6, y: y(t) + 4, 'text-anchor': 'end' }, t ? compact(t) : '$0'));
  }
  const labelEvery = Math.ceil(28 / slot) || 1;
  periods.forEach((p, i) => {
    const list = byKey.get(p.key), cx = left + slot * i + slot / 2, x = cx - bw / 2;
    const parts = cats.map(([c, color]) => [c, color, sum(list.filter((o) => catOf(o) === c))]).filter((s) => s[2] > 0);
    const col = svgEl('g', { class: pick && pick !== p.key ? 'dim' : null });
    let base = 0;
    parts.forEach(([, color, v], j) => {
      const y0 = y(base), y1 = y(base + v), last = j === parts.length - 1;
      const h = Math.max(1, y0 - y1 - (j ? 2 : 0)); // 2px surface gap between stacked segments
      col.append(svgEl('path', { d: barPath(x, y0 - (j ? 2 : 0) - h, bw, h, last ? 4 : 0), fill: color }));
      base += v;
    });
    g.append(col);
    if (totals[i] && slot >= 40) g.append(svgEl('text', { class: 'cap', x: cx, y: y(totals[i]) - 5, 'text-anchor': 'middle' }, compact(totals[i])));
    if (i % labelEvery === 0 || p.key === nowKey) {
      g.append(svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: p.key === nowKey ? 'now' : null }, p.label));
    }
    const hit = svgEl('rect', { class: 'hit', x: left + slot * i, y: top, width: slot, height: plotH });
    hit.addEventListener('click', () => {
      dash.pick = pick === p.key ? null : { kind: 'period', view, key: p.key, label: p.long };
      renderDashboard();
    });
    hover(hit, () => tipHtml(p.long + (p.key === nowKey ? ' · now' : ''), [
      ...(list.some((o) => o.ForecastCategoryName) ? byCat(list).map(([c, v]) => [c, money(v)]) : []),
      ['Total', money(totals[i])], ['Weighted', money(weighted(list))], ['Opportunities', list.length]]));
    g.append(hit);
  });
  box.append(g);
}

// Round axis steps: 0 and 4–5 clean values covering max.
function niceTicks(max) {
  const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => s >= raw);
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out.at(-1) < max) out.push(out.at(-1) + step);
  return out;
}

// A column with square bottom and rounded top corners (r = 0 for a square top).
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function svgEl(tag, attrs = {}, text) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}

function tipHtml(title, rows) {
  return [el('b', {}, title), ...rows.map(([k, v, color]) =>
    el('div', { class: 'row' }, el('span', {}, color ? el('i', { style: `background:${color}` }) : null, k), el('span', {}, String(v))))];
}

function hover(node, content) {
  const tip = document.getElementById('tip');
  node.addEventListener('mouseenter', () => { tip.replaceChildren(...content()); tip.style.display = 'block'; });
  node.addEventListener('mousemove', (e) => {
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
  node.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}

// ---------- My Time ----------
// Your hours from the Deal Supports where you are the chosen user (Owner by default), across all
// opportunities: this week, last week, the last 30 days, this fiscal quarter and year, per week,
// and per opportunity. Weeks start on Monday.
const time = { data: null, range: 'fy', opp: null };
// Field picks that differ from the server's defaults, kept in this browser. (v2: picks saved by the
// first version, which had different defaults, are ignored.)
const TIME_PREFS = 'sfdesk.time.v2';
const timePrefs = () => { try { return JSON.parse(localStorage.getItem(TIME_PREFS)) || {}; } catch { return {}; } };
const saveTimePrefs = (key, value, dflt) => {
  try {
    const p = timePrefs();
    if (value === dflt) delete p[key]; else p[key] = value;
    localStorage.setItem(TIME_PREFS, JSON.stringify(p));
  } catch {}
};

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10) + n, 12); return ymd(d); };
const mondayOf = (s) => addDays(s, -((new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10), 12).getDay() + 6) % 7));
const monDay = (s) => `${MONTHS[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}`;
const fmtH = (h) => h.toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' h';
const hoursOf = (list) => list.reduce((s, e) => s + e.hours, 0);

// "1.5 hours", "30 min", "1 hr 30 mins", "0:45" -> hours. A bare number counts as hours.
function parseDuration(v) {
  const t = String(v).toLowerCase();
  const hm = t.match(/(\d+):(\d{2})/);
  if (hm) return +hm[1] + +hm[2] / 60;
  let h = 0, any = false;
  for (const [, n, u = 'h'] of t.matchAll(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)?\b/g)) {
    h += u.startsWith('m') ? n / 60 : +n;
    any = true;
  }
  if (!any && /half/.test(t)) return 0.5;
  return any ? h : 0;
}

// The fields the hours, date and "mine" come from: the saved choice if still offered, else the server's pick.
function timeChoice() {
  const d = time.data, p = timePrefs();
  const hoursOpts = d.hoursFields.flatMap((f) => f.unit === 'text' ? [{ ...f, key: f.name + '|text' }]
    : [{ ...f, key: `${f.name}|${f.unit}` }, { ...f, unit: f.unit === 'hours' ? 'minutes' : 'hours', key: `${f.name}|${f.unit === 'hours' ? 'minutes' : 'hours'}` }]);
  const hours = hoursOpts.find((o) => o.key === p.hours) || hoursOpts[0];
  const date = d.dateFields.find((f) => f.name === p.date) || d.dateFields[0];
  return { hoursOpts, hours, date };
}

function timeEntries() {
  const d = time.data, { hours, date } = timeChoice();
  return d.records.map((r) => {
    const raw = r[hours.name], dv = r[date.name];
    const opp = d.oppRel ? r[d.oppRel] : null;
    return {
      id: r.Id,
      name: r.Name,
      date: !dv ? null : String(dv).length > 10 ? ymd(new Date(String(dv).replace(/\+0000$/, 'Z'))) : String(dv).slice(0, 10),
      hours: raw == null || raw === '' ? 0 : hours.unit === 'text' ? parseDuration(raw) : hours.unit === 'minutes' ? Number(raw) / 60 : Number(raw) || 0,
      person: (d.byRel ? r[d.byRel]?.Name : null) || '',
      oppId: r[d.oppField] || null,
      oppName: opp?.Name || (r[d.oppField] ? 'Opportunity' : 'No opportunity'),
      accountId: opp?.AccountId || null,
      accountName: opp?.Account?.Name || '',
      // The account's SailPoint BOAT and owner, for the BOAT and sales rep filters.
      boat: d.boatField ? opp?.Account?.[d.boatField] ?? null : null,
      ownerId: opp?.Account?.OwnerId || null,
      ownerName: opp?.Account?.Owner?.Name || opp?.Account?.OwnerId || '',
      role: d.roleField ? r[d.roleField] || '' : '',
    };
  });
}

// Whether a time entry's account is in the picked BOAT (see boatFilter). Without a BOAT field, or
// with no BOAT on any of my accounts for My BOAT, every entry is.
function inBoat(e) {
  if (!time.data.boatField || boatFilter === 'all') return true;
  const has = (v) => String(e.boat ?? '').toLowerCase().split(';').includes(String(v).toLowerCase());
  if (boatFilter === '__blank__') return e.boat == null || e.boat === '';
  if (boatFilter === 'mine') { const mine = acctFilters?.myBoats || []; return !mine.length || mine.some(has); }
  return has(boatFilter);
}

// The periods on the tiles, plus "all time" and any week picked on the chart.
function timeRanges(today) {
  const now = fiscal(today), mon = mondayOf(today), qm = (FY_START + (now.q - 1) * 3) % 12;
  const span = (a, b) => (e) => e.date && e.date >= a && e.date <= b;
  return {
    week: { label: 'This week', sub: `${monDay(mon)} – ${monDay(addDays(mon, 6))}`, test: span(mon, addDays(mon, 6)) },
    prev: { label: 'Previous week', sub: `${monDay(addDays(mon, -7))} – ${monDay(addDays(mon, -1))}`, test: span(addDays(mon, -7), addDays(mon, -1)) },
    d30: { label: 'Last 30 days', sub: `${monDay(addDays(today, -29))} – ${monDay(today)}`, test: span(addDays(today, -29), today) },
    q: { label: `This quarter (${fyName(now.fy)} Q${now.q})`, sub: `${MONTHS[qm]} – ${MONTHS[(qm + 2) % 12]}`, test: (e) => { if (!e.date) return false; const f = fiscal(e.date); return f.fy === now.fy && f.q === now.q; } },
    fy: { label: `This fiscal year (${fyName(now.fy)})`, sub: `Feb ${now.fy - 1} – Jan ${now.fy}`, test: (e) => !!e.date && fiscal(e.date).fy === now.fy },
    all: { label: 'All time', sub: null, test: () => true },
  };
}
function timeRange(today) {
  const ranges = timeRanges(today), r = time.range;
  if (r.startsWith('w:')) {
    const a = r.slice(2), b = addDays(a, 6);
    return { label: `Week of ${monDay(a)} ${a.slice(0, 4)}`, test: (e) => e.date && e.date >= a && e.date <= b };
  }
  return ranges[r] || ranges.fy;
}

async function showTime() {
  setNav('time');
  current = null;
  document.getElementById('app').replaceChildren(el('div', { class: 'dash' },
    el('div', { class: 'dash-head' },
      el('h2', { id: 'timeTitle' }, 'My Time'),
      el('span', { id: 'timePicks', class: 'picks' }),
      el('span', { class: 'spacer', style: 'flex:1' }),
      el('button', { onclick: loadTime }, 'Reload'),
    ),
    el('div', { class: 'sub', id: 'timeSub' }, 'Loading…'),
    el('div', { id: 'timeBody' }),
  ));
  loadTime();
}

async function loadTime() {
  try {
    const { by, who } = timePrefs();
    const q = new URLSearchParams({ ...(by ? { by } : {}), ...(who ? { who } : {}) }).toString();
    [time.data] = await Promise.all([api('/my-time' + (q ? '?' + q : '')),
      dsMeta ? null : api('/deal-supports/meta').then((m) => { dsMeta = m; }, () => {}),
      // The BOAT choices and my BOATs, for the BOAT filter.
      ensureAcctFilters().catch(() => {})]);
    if (document.getElementById('timeBody')) renderTime();
  } catch (e) {
    const sub = document.getElementById('timeSub');
    if (sub) sub.textContent = e.message;
  }
}

function renderTime() {
  document.getElementById('tip').style.display = 'none';
  const d = time.data, today = todayStr(), now = fiscal(today);
  const { hoursOpts, hours, date } = timeChoice();
  const by = d.userFields.find((f) => f.name === d.by) || d.userFields[0];
  // Whose time: mine, my whole team's, or one team member's.
  const members = d.team?.members || [];
  const whoName = d.who === 'me' ? 'you' : d.who === 'team' ? 'you or your team'
    : members.find((m) => m.id === d.who)?.name || 'them';
  document.getElementById('timeTitle').textContent = d.who === 'me' ? 'My Time' : d.who === 'team' ? 'My Team'
    : `${members.find((m) => m.id === d.who)?.name || 'Team member'}'s Time`;

  // Which fields count: picked here, remembered on this machine. Each shows how many of your records fill it.
  // "Total Time (Hours)" needs no "(hours)"; only say the unit when the label doesn't, or when reading it the other way.
  const unitLabel = (o) => o.unit === 'text' ? o.label
    : o.key !== hoursOpts.find((x) => x.name === o.name).key ? `${o.label} (read as ${o.unit})`
    : new RegExp(o.unit === 'hours' ? 'hour|hrs' : 'min', 'i').test(o.label) ? o.label : `${o.label} (${o.unit})`;
  const counted = (f) => f.count != null ? ` · ${plural(f.count, 'record').replace(/^\d+/, f.count.toLocaleString())}` : '';
  const pick = (labelText, opts, value, onPick) => {
    const s = el('select', {}, opts.map(([v, t]) => el('option', { value: v, selected: v === value }, t)));
    s.addEventListener('change', () => onPick(s.value));
    return el('label', {}, labelText, s);
  };
  // The same BOAT and sales rep filters as the Accounts and Deals tabs (saved with them); the team
  // filter picks whose time. BOAT and rep are applied here, to each entry's account.
  const filters = filterSelects({ time: true, onBoat: renderTime, onRep: renderTime,
    onTeam: () => { time.opp = null; document.getElementById('timeSub').textContent = 'Loading…'; loadTime(); } });
  const inTeam = timeEntries(), boatEntries = inTeam.filter(inBoat);
  const repsHere = new Map(boatEntries.filter((e) => e.ownerId).map((e) => [e.ownerId, e.ownerName]));
  const before = repFilter;
  fillRepSelect(filters, [...repsHere].map(([value, label]) => ({ value, label })));
  if (repFilter !== before) saveAcctPrefs();
  document.getElementById('timePicks').replaceChildren(...[filters.boat, filters.team, filters.rep,
    pick('Mine by', d.userFields.map((f) => [f.name, f.label + counted(f)]), by.name,
      (v) => { saveTimePrefs('by', v, d.userFields[0].name); loadTime(); }),
    pick('Hours from', hoursOpts.map((o) => [o.key, unitLabel(o) + counted(o)]), hours.key,
      (v) => { saveTimePrefs('hours', v, hoursOpts[0].key); renderTime(); }),
    d.dateFields.length > 1 ? pick('Date', d.dateFields.map((f) => [f.name, f.label]), date.name,
      (v) => { saveTimePrefs('date', v, d.dateFields[0].name); renderTime(); }) : null,
  ].filter(Boolean));

  const all = boatEntries.filter((e) => !repFilter || e.ownerId === repFilter);
  const left = inTeam.length - all.length;
  const undated = all.filter((e) => !e.date).length;
  document.getElementById('timeSub').textContent =
    `${plural(all.length, d.label, d.labelPlural)} where ${by.label} is ${whoName} · ${filterText(filters).replace(/^[^·]*· /, '')}` +
    (left ? ` (${left.toLocaleString()} more outside these filters)` : '') + ` · hours from ${hours.label}` +
    `, dated by ${date.label}${undated ? ` (${undated} undated, counted only in All time)` : ''}` +
    ` · Weeks start Monday · ${fyName(now.fy)} = Feb ${now.fy - 1} – Jan ${now.fy}`;

  const ranges = timeRanges(today);
  const tile = (key) => {
    const r = ranges[key], list = all.filter(r.test), opps = new Set(list.map((e) => e.oppId)).size;
    return el('button', { class: 'tile' + (time.range === key ? ' on' : ''), title: 'Show this period below',
      onclick: () => { time.range = key; time.opp = null; renderTime(); } },
      el('div', { class: 'k' }, r.label), el('div', { class: 'v' }, fmtH(hoursOf(list))),
      el('div', { class: 'd' }, [r.sub, list.length ? `${plural(list.length, 'activity', 'activities')} · ${plural(opps, 'opp', 'opps')}` : 'Nothing logged'].filter(Boolean).join(' · ')));
  };
  document.getElementById('timeBody').replaceChildren(
    el('div', { class: 'tiles even' }, ['week', 'prev', 'd30', 'q', 'fy'].map(tile)),
    el('div', { class: 'charts' },
      el('section', { id: 'weekChart' }),
      el('section', { id: 'oppTime' }),
    ),
    el('section', { id: 'timeList' }),
  );
  renderWeekChart(all, today);
  renderOppTime(all, today);

}

// Hours per week for the last 13 weeks; click a week to list it.
function renderWeekChart(all, today) {
  const sec = document.getElementById('weekChart');
  const thisMon = mondayOf(today);
  const weeks = Array.from({ length: 13 }, (_, i) => addDays(thisMon, (i - 12) * 7));
  const byWeek = new Map(weeks.map((w) => [w, []]));
  for (const e of all) if (e.date) byWeek.get(mondayOf(e.date))?.push(e);
  const box = el('div');
  sec.replaceChildren(el('h3', {}, 'Hours by week', el('span', { class: 'spacer' }), el('span', { class: 'sub', style: 'margin:0' }, 'Last 13 weeks')), box);

  const W = Math.max(320, box.clientWidth || 480), H = 250, top = 18, bottom = 26, left = 40, right = 4;
  const totals = weeks.map((w) => hoursOf(byWeek.get(w)));
  const ticks = niceTicks(Math.max(...totals, 1));
  const ymax = ticks.at(-1), plotH = H - top - bottom;
  const y = (v) => top + plotH - (v / ymax) * plotH;
  const slot = (W - left - right) / weeks.length, bw = Math.min(24, slot * 0.6);
  const picked = time.range.startsWith('w:') ? time.range.slice(2) : null;
  const g = svgEl('svg', { class: 'cols', viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'My hours by week' });
  for (const t of ticks) {
    g.append(svgEl('line', { x1: left, x2: W - right, y1: y(t), y2: y(t), stroke: t ? 'var(--grid)' : 'var(--line)', 'stroke-width': 1 }),
      svgEl('text', { x: left - 6, y: y(t) + 4, 'text-anchor': 'end' }, t.toLocaleString(undefined, { maximumFractionDigits: 2 })));
  }
  const labelEvery = Math.ceil(44 / slot) || 1;
  weeks.forEach((w, i) => {
    const cx = left + slot * i + slot / 2, h = totals[i];
    if (h > 0) {
      const ph = Math.max(1, y(0) - y(h));
      g.append(svgEl('path', { d: barPath(cx - bw / 2, y(0) - ph, bw, ph, 4), fill: 'var(--s1)', class: picked && picked !== w ? 'dim' : null }));
      if (slot >= 34) g.append(svgEl('text', { class: 'cap', x: cx, y: y(h) - 5, 'text-anchor': 'middle' }, h.toLocaleString(undefined, { maximumFractionDigits: 1 })));
    }
    if ((weeks.length - 1 - i) % labelEvery === 0) {
      g.append(svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: w === thisMon ? 'now' : null }, monDay(w)));
    }
    const hit = svgEl('rect', { class: 'hit', x: left + slot * i, y: top, width: slot, height: plotH });
    hit.addEventListener('click', () => { time.range = picked === w ? 'fy' : 'w:' + w; time.opp = null; renderTime(); });
    const list = byWeek.get(w);
    hover(hit, () => tipHtml(`Week of ${monDay(w)}${w === thisMon ? ' · this week' : ''}`, [
      ['Hours', fmtH(h)], ['Activities', list.length], ['Opportunities', new Set(list.map((e) => e.oppId)).size]]));
    g.append(hit);
  });
  box.append(g);
}

// Total hours per opportunity in the chosen period; click one to list its activities.
function renderOppTime(all, today) {

    by.get(k).entries.push(e);
  }
  const rows = [...by.values()].map((o) => ({ ...o, hours: hoursOf(o.entries) })).sort((a, b) => b.hours - a.hours);
  const TOP = 15, shown = rows.slice(0, TOP), max = Math.max(0.01, ...rows.map((o) => o.hours));
  const seg = el('div', { class: 'seg' }, [['week', 'Week'], ['prev', 'Prev'], ['d30', '30 days'], ['q', 'Quarter'], ['fy', 'Year'], ['all', 'All']].map(([v, t]) =>

    hover(track, () => tipHtml(o.name, [['Account', o.account || '—'], ['Hours', fmtH(o.hours)], ['Activities', o.entries.length],
      ['Share of period', Math.round(o.hours / Math.max(0.01, hoursOf(list)) * 100) + '%']]));
    grid.append(el('div', { class: 'lbl' + dim, title: o.account ? `${o.name} · ${o.account}` : o.name, onclick: choose }, o.name), track);

    el('div', { class: 'sub', style: 'margin:-4px 0 8px' }, `${range.label}: ${fmtH(hoursOf(list))} on ${plural(rows.length, 'opportunity', 'opportunities')}` +
      (rows.length > TOP ? ` · top ${TOP} shown` : '')),

// ---------- My Calendar ----------
// Your Salesforce calendar (Events you own), a week at a time. Events covered by a Deal Support are
// green, the rest red (grey once marked "No Deal Support needed"). Pick an event to create a Deal

const cal = { week: null, data: null, sel: null, loading: 0, sources: null, source: null };
const CAL_SOURCE = 'sfdesk.calSource';
const evTime = (s) => new Date(String(s).replace(/\+0000$/, 'Z'));
const hhmm = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// Calendars to show: your Salesforce events, or any calendar on this computer: the Mac's Internet Accounts
// when SF Desk runs on a Mac, or classic Outlook's when it runs on Windows; on Windows also your Microsoft 365
// calendars through Microsoft Graph (for the new Outlook), after a one-time sign-in. The choice is remembered
// on this machine; the first time, the Microsoft 365 or Exchange main calendar is picked if there is one.
async function loadSources() {
  // Asked again after a refusal, so allowing access in System Settings and clicking Reload picks it up.
  const wasRefused = !!cal.sources?.error || !!cal.sources?.graph?.error;
  if (!cal.sources || wasRefused) {
    try { cal.sources = await api('/calendar/sources'); } catch { cal.sources = { local: false, calendars: [] }; }
  }
  const { error, graph } = cal.sources;
  const calendars = [...(graph?.calendars || []), ...cal.sources.calendars];
  let saved = null;
  try { saved = localStorage.getItem(CAL_SOURCE); } catch {}
  const exchange = calendars.filter((c) => c.type === 'exchange');
  const pick = (saved === 'salesforce' || calendars.some((c) => c.id === saved)) ? saved
    : (graph?.calendars || []).find((c) => c.isDefault)?.id ||
      (exchange.find((c) => /^calendar$/i.test(c.title)) || exchange[0])?.id || 'salesforce';
  if (!cal.source || !calendars.some((c) => c.id === cal.source) && cal.source !== 'salesforce' || (wasRefused && !error)) cal.source = pick;
  cal.sourceNote = [error, graph?.error].filter(Boolean).join(' ');
  const select = document.getElementById('calSource');
  if (!select) return;
  const groups = new Map();
  for (const c of calendars) {
    if (!groups.has(c.account)) groups.set(c.account, []);
    groups.get(c.account).push(c);
  }
  const kind = (c) => c.source === 'graph' ? '' : cal.sources.platform === 'win32' ? ' (Outlook classic)' : c.type === 'exchange' ? ' (Exchange)' : '';
  select.replaceChildren(el('option', { value: 'salesforce' }, 'Salesforce events'),
    ...[...groups].map(([account, list]) => el('optgroup', { label: `${account}${kind(list[0])}` },
      list.map((c) => el('option', { value: c.id }, c.title)))),
    // On Windows, say why there are no classic Outlook calendars rather than leaving the group out.
    cal.sources.platform === 'win32' && !cal.sources.calendars.length ? el('optgroup', { label: 'Outlook (classic)' },
      el('option', { disabled: true, title: error || '' }, error ? `Not available: ${error.length > 90 ? error.slice(0, 90) + '…' : error}` : 'No calendars found in classic Outlook')) : null,
    graph ? el('optgroup', { label: 'Microsoft 365' },
      graph.signedIn ? el('option', { value: 'graph:signout' }, `Sign out of Microsoft 365${graph.account ? ` (${graph.account})` : ''}`)
        : el('option', { value: 'graph:signin' }, 'Sign in to read your Microsoft 365 calendar…')) : null);
  select.value = cal.source;
  select.hidden = !(cal.sources.local ?? cal.sources.mac);
  select.onchange = async () => {
    const value = select.value;
    if (value === 'graph:signin' || value === 'graph:signout') {
      select.value = cal.source;
      if (value === 'graph:signin') return graphSignIn();
      if (!confirm('Sign out of Microsoft 365? SF Desk forgets the sign-in and shows another calendar.')) return;
      await api('/graph/signout', { method: 'POST' }).catch(() => {});
      if (cal.source.startsWith('graph:')) cal.source = null;
      cal.sources = null;
      return loadSources().then(loadCalendar);
    }
    cal.source = value; cal.sel = null;
    try { localStorage.setItem(CAL_SOURCE, cal.source); } catch {}
    loadCalendar();
  };
}

// Microsoft 365 sign-in with a device code: show the code and Microsoft's page, then wait for it to finish.
async function graphSignIn() {
  const sub = document.getElementById('calSub');
  let info;
  try { info = await api('/graph/signin', { method: 'POST' }); } catch (e) { toast(e.message, 'err'); return; }
  const ticket = cal.graphTicket = {};
  const status = el('span', {}, ' Waiting for you to finish signing in…');
  sub.replaceChildren(el('div', { class: 'graph-signin', style: 'padding:10px 12px;border:1px solid var(--line, #ccc);border-radius:8px;margin:6px 0;line-height:1.6' },
    'To read your Microsoft 365 calendar, open ', el('a', { href: info.verificationUri, target: '_blank', rel: 'noopener' }, info.verificationUri),
    ' and enter the code ', el('b', { style: 'font-size:1.15em;letter-spacing:.08em;user-select:all' }, info.userCode), ' ',
    el('button', { onclick: () => navigator.clipboard?.writeText(info.userCode).then(() => toast('Code copied')) }, 'Copy code'), ' ',
    el('button', { onclick: () => { cal.graphTicket = null; loadCalendar(); } }, 'Cancel'),
    el('br'), 'Sign in with your work account and accept reading your calendar.', status));
  window.open(info.verificationUri, '_blank', 'noopener');
  while (cal.graphTicket === ticket) {
    await new Promise((r) => setTimeout(r, 3000));
    if (cal.graphTicket !== ticket) return;
    const st = await api('/graph/status').catch(() => ({}));
    if (st.signedIn) {
      cal.graphTicket = null;
      toast(`Signed in to Microsoft 365${st.account ? ` as ${st.account}` : ''}`);
      try { localStorage.removeItem(CAL_SOURCE); } catch {}
      cal.sources = null; cal.source = null;
      return loadSources().then(loadCalendar);
    }
    if (!st.pending && st.error) {
      cal.graphTicket = null;
      status.textContent = '';
      sub.replaceChildren(el('span', { style: 'color:var(--err, #b00020)' }, `Microsoft 365 sign-in didn't work: ${st.error}`));
      return;
    }
  }
}

function moveWeek(days) { cal.week = addDays(cal.week, days); cal.sel = null; loadCalendar(); }

async function loadCalendar() {
  const week = cal.week, ticket = ++cal.loading;
  const end = addDays(week, 7);
  document.getElementById('calWeek').textContent = `${monDay(week)} – ${monDay(addDays(week, 6))}, ${addDays(week, 6).slice(0, 4)}`;
  const params = new URLSearchParams({ from: localDate(week).toISOString(), to: localDate(end).toISOString(),
    d0: week, d1: addDays(week, 6), tz: new Date().getTimezoneOffset(), source: cal.source || 'salesforce' });
  document.getElementById('calSub').textContent = 'Loading…';
  try {
    const [data] = await Promise.all([api('/calendar?' + params), dsMeta ? null : api('/deal-supports/meta').then((m) => { dsMeta = m; })]);
    if (ticket !== cal.loading || !document.getElementById('calBody')) return;
    cal.data = data;
    renderCalendar();
  } catch (e) {
    if (ticket !== cal.loading) return;
    // This computer's calendar refused (no permission yet) or failed: say why and show Salesforce events instead.
    if (cal.source !== 'salesforce' && e.status !== 401) {
      cal.sourceNote = e.message;
      cal.source = 'salesforce';
      const select = document.getElementById('calSource');
      if (select) select.value = 'salesforce';
      return loadCalendar();
    }
    const sub = document.getElementById('calSub');
    if (sub) sub.textContent = e.message;
    document.getElementById('calBody')?.replaceChildren();
  }
}

function renderCalendar() {
  const { events } = cal.data;
  const by = { covered: 0, open: 0, skipped: 0 };
  for (const e of events) by[evStatus(e)]++;
  const fromMac = cal.data.source && cal.data.source !== 'salesforce';
  document.getElementById('calSub').textContent = (cal.sourceNote && !fromMac ? `${cal.sourceNote} Showing Salesforce events. · ` : '') + (events.length
    ? `${plural(events.length, 'event')} this week · ${by.covered} with a ${dsMeta.label} · ${by.open} without` +
      (by.skipped ? ` · ${by.skipped} marked not needed` : '') + ' · Click an event to see it or create a ' + dsMeta.label
    : fromMac ? 'No events in this calendar this week.' + (cal.data.note ? ` ${cal.data.note}` : '') : 'No Salesforce events this week. If your Outlook or Google calendar reaches Salesforce through Einstein Activity Capture, ' +
      'those meetings may not be stored as Salesforce events, so they can\'t be shown here.');

  // Monday to Friday, plus the weekend days that have something on them.
  const days = Array.from({ length: 7 }, (_, i) => addDays(cal.week, i))
    .filter((d, i) => i < 5 || events.some((e) => e.date === d));
  const timed = events.filter((e) => !e.allDay), allDay = events.filter((e) => e.allDay);
  // Hours shown: 8:00 to 18:00, widened to fit the week's events.
  let h0 = 8, h1 = 18;
  for (const e of timed) {
    const s = evTime(e.start), en = evTime(e.end);
    h0 = Math.min(h0, s.getHours());
    h1 = Math.max(h1, en.getDate() !== s.getDate() ? 24 : Math.ceil(en.getHours() + en.getMinutes() / 60));
  }
  const hourPx = 48, height = (h1 - h0) * hourPx, today = todayStr();
  const evBox = (e) => {
    const st = evStatus(e);
    const n = el('button', { class: `ev ${st}${cal.sel === e.id ? ' sel' : ''}`, title: `${e.title || e.subject} · ${STATUS_TEXT[st]}`,
      onclick: () => selectEvent(e.id) },
      el('div', { class: 's' }, e.title || e.subject),
      e.allDay ? null : el('div', { class: 't' }, `${hhmm(evTime(e.start))} – ${hhmm(evTime(e.end))}`));
    return n;
  };
  const cols = days.map((d) => {
    const col = el('div', { class: 'hours-col', style: `height:${height}px` });
    for (let h = h0; h < h1; h++) col.append(el('div', { class: 'hl', style: `top:${(h - h0) * hourPx}px` }));
    if (d === today) {
      const now = new Date(), m = (now.getHours() - h0) * 60 + now.getMinutes();
      if (m >= 0 && m <= (h1 - h0) * 60) col.append(el('div', { class: 'now-line', style: `top:${m / 60 * hourPx}px` }));
    }
    // Lay overlapping events side by side: group events that overlap, then give each the first free lane.
    const list = timed.filter((e) => e.date === d).map((e) => {
      const s = evTime(e.start), en = evTime(e.end);
      const a = (s.getHours() - h0) * 60 + s.getMinutes();
      const b = en.getDate() !== s.getDate() ? (h1 - h0) * 60 : (en.getHours() - h0) * 60 + en.getMinutes();
      return { e, a, b: Math.max(b, a + 20) };
    }).sort((x, y) => x.a - y.a || y.b - x.b);
    let group = [], groupEnd = -1;
    const flush = () => {
      const lanes = [];
      for (const it of group) {
        let lane = lanes.findIndex((end) => end <= it.a);
        if (lane < 0) { lane = lanes.length; lanes.push(0); }
        lanes[lane] = it.b; it.lane = lane;
      }
      for (const it of group) {
        const w = 100 / lanes.length;
        const n = evBox(it.e);
        n.style.cssText = `top:${it.a / 60 * hourPx}px;height:${(it.b - it.a) / 60 * hourPx - 2}px;left:calc(${it.lane * w}% + 2px);width:calc(${w}% - 4px)`;
        col.append(n);
      }
      group = []; groupEnd = -1;
    };
    for (const it of list) {
      if (group.length && it.a >= groupEnd) flush();
      group.push(it); groupEnd = Math.max(groupEnd, it.b);
    }
    flush();
    return col;
  });
  const gutter = el('div', { class: 'hours-col gutter', style: `height:${height}px` });
  for (let h = h0 + 1; h < h1; h++) {
    gutter.append(el('div', { class: 'hl-label', style: `top:${(h - h0) * hourPx}px` },
      new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' })));
  }
  const dayName = (d) => localDate(d).toLocaleDateString([], { weekday: 'short' });
  // Phones get a list of the week's days instead of the time grid.
  if (CAL_NARROW.matches) {
    const at = (e) => e.allDay ? '' : e.start;
    document.getElementById('calBody').replaceChildren(el('div', { class: 'agenda' }, days.map((d) => {

async function editDealSupport(id, host, rerender, reload) {

// Values for the new Deal Support form, taken from the event. When a Mac or Outlook event has a
// Salesforce copy (e.g. synced by Outreach), the name and description come from that copy.
// The meeting's time goes to customer-facing time when anyone outside the company attends; when only
// colleagues do, it goes to internal time and customer-facing time is 0 (Salesforce needs a value).
function eventPrefill(e) {
  const p = cal.data.prefill, v = {};
  if (p.nameField) v[p.nameField.name] = dsTitle(e).slice(0, p.nameField.length || 80);
  if (p.dateField) {
    v[p.dateField.name] = p.dateField.type === 'datetime' && !e.allDay
      ? `${e.date}T${hhmm24(evTime(e.start))}` : e.date;
  }
  const mins = e.minutes ?? (e.allDay ? null : (evTime(e.end) - evTime(e.start)) / 60000);
  const setTime = (f, m) => {
    const hours = Math.round(m / 60 * 100) / 100;
    if (f.unit === 'minutes') v[f.name] = Math.round(m);
    else if (f.unit === 'hours') v[f.name] = hours;
    else if (f.picklist) {
      const opt = f.picklist.find((o) => Math.abs(parseDuration(o) - hours) < 0.01);
      if (opt) v[f.name] = opt;
    } else v[f.name] = String(hours);
  };
  const internal = e.audience === 'internal' && p.internalField && p.hoursField;
  if (internal) setTime(p.hoursField, 0);
  if (mins != null && !e.allDay) {
    if (internal) setTime(p.internalField, mins);
    else if (p.hoursField) setTime(p.hoursField, mins);
  }
  const desc = dsNotes(e);
  // The details start with the meeting's subject, then what was written about it.
  // (The server copies the description into Meeting Overview.)
  if (p.descField) v[p.descField.name] = [dsTitle(e), desc].filter(Boolean).join('\n').slice(0, p.descField.length || 32000);
  if (p.userField?.onForm) v[p.userField.name] = me.user.id;

}
// An event's description without the online-meeting invitation (Teams, Zoom, Webex, Google Meet):
// the block from its "____" divider or "Microsoft Teams meeting" / "Join ..." line through the meeting
// Id, passcode, dial-in numbers and help links. What's left is what was written about the meeting.
function meetingNotes(text) {
  let lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const divider = (l) => /^\s*[_\-=]{10,}\s*$/.test(l);
  const opener = (l) => /^\s*(microsoft teams( meeting| need help)?|join (the meeting now|on your computer|zoom meeting|with google meet|webex meeting|from the meeting link)|.*is inviting you to a scheduled zoom meeting|you have been invited to a webex|join meeting)\b/i.test(l);
  const invite = (l) => /^\s*(meeting id|passcode|password|phone conference id|dial[- ]?in|dial by your location|one tap mobile|join by phone|find a local number|reset (dial-in )?pin|need help\?|meeting options|learn more|for organizers|join with a video conferencing device|or call in|access code|tap to join|\+?\d[\d\s().,#*-]{7,})/i.test(l) ||
    /(teams\.microsoft\.com|teams\.live\.com|zoom\.us\/|webex\.com|meet\.google\.com|aka\.ms\/JoinTeamsMeeting)/i.test(l);
  // Drop each invitation block: from an opening divider or line to the closing divider (or the end).
  for (let i = 0; i < lines.length; i++) {
    if (!(divider(lines[i]) && lines.slice(i + 1, i + 4).some(opener)) && !opener(lines[i])) continue;
    let j = i + 1;
    while (j < lines.length && !divider(lines[j])) j++;
    lines.splice(i, Math.min(j + 1, lines.length) - i);
    i--;
  }
  // Meeting footers: image placeholders ("[Company Logo]"), copyright notices and "Org help | Privacy and security" links.
  const footer = (l) => /^\s*\[[^\]]{1,60}\]\s*$/.test(l) || /^\s*(©|\(c\)|copyright\b)/i.test(l) || /all rights reserved\.?\s*$/i.test(l) ||
    /^\s*(org help|privacy and security|privacy statement)\b/i.test(l);
  lines = lines.filter((l) => !invite(l) && !divider(l) && !footer(l));
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

// The "create from event" form: pick an opportunity, then the Deal Support fields, prefilled from the event.
// With nothing written about the meeting but the invitation, the details default to

function descSources(descName) {

  return [find('Requested_SaaS_Activity__c', /requested.*activity/i),

function descDefault(e) {

    title: e.title || e.subject,

  });
  // The opportunity picker goes at the top of the form.
  form.querySelector('h3').after(el('div', { style: 'margin-bottom:12px' },
    el('div', { class: 'grid' }, el('label', {}, el('span', {}, 'Opportunity', el('span', { class: 'req' }, ' *')), picker.input)),
    picker.list, picker.status));
  return form;
}

// Type to filter all open opportunities (searched on the server's local copy, sorted by name).
// Arrow keys move through the list and Enter picks; suggested ones (see /opportunities/open) come first.
function oppCombobox({ picked, accounts = [], title = '', domains = [], onPick }) {
  const input = el('input', { type: 'search', placeholder: 'Type to find an open opportunity or account…', autocomplete: 'off',
    role: 'combobox', 'aria-label': 'Opportunity', 'aria-expanded': 'true' });
  const list = el('div', { class: 'opp-pick', role: 'listbox' }, el('div', { class: 'empty' }, 'Loading open opportunities…'));
  const status = el('div', { class: 'sub', style: 'margin:6px 0 0' });
  let rows = [], active = -1, ticket = 0, info = null, byDomain = null;
  const showStatus = () => {
    status.textContent = (picked ? `Picked: ${picked.Name}${picked.Account?.Name ? ` (${picked.Account.Name})` : ''}` : 'Nothing picked yet.') +
      (info ? ` · ${info.matched.toLocaleString()} of ${info.total.toLocaleString()} open opportunities match` +
        (info.matched > rows.length ? `, showing the first ${rows.length}` : '') : '') +
      (byDomain ? ` · Attendees from ${byDomain.map((a) => `${a.domain} → ${a.Name}`).join(', ')}` : '');
  };
  const choose = (o) => { picked = o; onPick(o); render(); };
  const render = () => {
    const shown = picked && !input.value.trim() && !rows.some((o) => o.Id === picked.Id) ? [picked, ...rows] : rows;
    list.replaceChildren(...(shown.length ? shown.map((o, i) => el('button', {
      type: 'button', role: 'option', 'aria-selected': String(picked?.Id === o.Id),
      class: [picked?.Id === o.Id && 'on', i === active && 'active'].filter(Boolean).join(' ') || null,
      onclick: () => choose(o),
    }, el('div', {}, o.Name, o.suggested ? el('span', { class: 'tag' }, o.via === 'domain' ? 'attendee match' : 'suggested') : null),
      el('div', { class: 'm' }, [o.Account?.Name, o.StageName, o.CloseDate && `closes ${o.CloseDate}`, o.Owner?.Name].filter(Boolean).join(' · '))))
      : [el('div', { class: 'empty' }, input.value.trim() ? 'No open opportunities match.' : 'No open opportunities.')]));
    list.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
    showStatus();
  };
  const load = async () => {
    const my = ++ticket;
    const params = new URLSearchParams({ q: input.value.trim(), limit: 100 });
    if (accounts.length) params.set('accounts', accounts.join(','));
    if (title) params.set('title', title);
    if (domains.length) params.set('domains', domains.join(','));
    try {
      const r = await api('/opportunities/open?' + params);
      if (my !== ticket) return;
      rows = r.records; info = r; active = -1;
      if (r.domainAccounts) byDomain = r.domainAccounts;
      if (r.pick && !picked && !input.value.trim()) { picked = r.pick; onPick(r.pick); }
      render();
    } catch (err) { if (my === ticket) list.replaceChildren(el('div', { class: 'empty' }, err.message)); }
  };
  let timer;
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 120); });
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      const n = list.querySelectorAll('button').length;
      if (n) { active = (active + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n; render(); }
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const btn = list.querySelectorAll('button')[active < 0 ? 0 : active];
      btn?.click();
    }
  });
  showStatus();
  load();
  return { input, list, status };
}

// ---------- Outlook add-in ----------
// In Outlook's task pane (/outlook/pane) the page shows just the meeting that is open in Outlook and the
// Time Entry tab's "create from event" form for it, prefilled the same way.
const IN_OUTLOOK = location.pathname === '/outlook/pane';

// Office.js item properties are plain values when reading a meeting and { getAsync } when editing one.
function officeGet(prop, ...args) {
  if (prop == null || typeof prop.getAsync !== 'function') return Promise.resolve(prop);
  return new Promise((resolve) => prop.getAsync(...args, (r) => resolve(r.status === 'succeeded' ? r.value : null)));
}

// The open meeting, in the shape POST /api/outlook/event takes.
async function outlookMeeting() {
  const item = Office.context.mailbox.item;
  if (!item || item.itemType !== 'appointment') return null;
  const [subject, start, end, location, body, required, optional, organizer] = await Promise.all([
    officeGet(item.subject), officeGet(item.start), officeGet(item.end), officeGet(item.location),
    officeGet(item.body, Office.CoercionType.Text), officeGet(item.requiredAttendees), officeGet(item.optionalAttendees),
    officeGet(item.organizer)]);
  const s = new Date(start), e = new Date(end);
  // Office.js doesn't say whether a meeting is all-day when reading it: midnight to midnight is.
  const allDay = s.getHours() === 0 && s.getMinutes() === 0 && e.getHours() === 0 && e.getMinutes() === 0 && e - s >= 86400_000;
  const people = [...(required || []), ...(optional || []), organizer].filter(Boolean)
    .map((a) => ({ name: a.displayName || '', email: a.emailAddress || '' }));
  return { itemId: item.itemId || '', subject: subject || '', start: s.toISOString(), end: e.toISOString(), allDay,
    date: localDay(s), tz: s.getTimezoneOffset(), location: location || '', body: body || '', attendees: people };
}

async function showOutlookPane() {
  document.getElementById('hdr').hidden = true;
  const app = document.getElementById('app');
  app.className = 'ol-pane';
  app.replaceChildren(el('div', { class: 'sub' }, 'Reading the meeting…'));
  if (typeof Office === 'undefined') return app.replaceChildren(el('div', { class: 'empty' }, 'Open this page from the SF Desk add-in in Outlook.'));
  await Office.onReady();
  const load = async () => {
    try {
      const m = await outlookMeeting();
      if (!m) return app.replaceChildren(el('div', { class: 'empty' }, 'Open a meeting in your Outlook calendar, then click Create Deal Support.'));
      dsMeta ||= await api('/deal-supports/meta');
      const r = await api('/outlook/event', { method: 'POST', body: m });
      cal.data = { prefill: r.prefill, events: [r.event] };
      renderOutlookPane(r.event, load);
    } catch (err) {
      if (err.status !== 401) app.replaceChildren(el('div', { class: 'empty' }, err.message));
    }
  };
  // The pane can stay open while another meeting is selected.
  Office.context.mailbox.addHandlerAsync?.(Office.EventType.ItemChanged, load);
  await load();
}

// Meetings with a Deal Support get an Outlook category of that name, so they stand out by color in the calendar
// without being opened. Categories need Mailbox 1.8; the category itself is added to Outlook's list the first time.
async function tagMeeting(name) {
  const item = Office.context.mailbox.item;
  if (!Office.context.requirements.isSetSupported('Mailbox', '1.8') || !item?.categories) return 'unsupported';
  const call = (fn, arg) => new Promise((resolve) => fn(arg, (r) => resolve(r)));
  const has = await call((a, cb) => item.categories.getAsync(cb));
  if (has.status === 'succeeded' && (has.value || []).some((c) => c.displayName === name)) return 'tagged';
  const master = Office.context.mailbox.masterCategories;
  const list = await call((a, cb) => master.getAsync(cb));
  if (list.status === 'succeeded' && !(list.value || []).some((c) => c.displayName === name)) {
    await call((a, cb) => master.addAsync(a, cb), [{ displayName: name, color: Office.MailboxEnums.CategoryColor.Preset4 }]);
  }
  const r = await call((a, cb) => item.categories.addAsync(a, cb), [name]);
  return r.status === 'succeeded' ? 'tagged' : 'failed';
}

function renderOutlookPane(e, reload) {
  const when = e.allDay ? `${localDate(e.date).toLocaleDateString()} (all day)`
    : `${evTime(e.start).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })}, ${hhmm(evTime(e.start))} – ${hhmm(evTime(e.end))}`;
  const st = e.supports.length ? 'covered' : 'open';
  const formBox = el('div');
  const open = () => formBox.replaceChildren(createFromEvent(e, () => formBox.replaceChildren(again), async (rec, opp) => {
    formBox.replaceChildren(el('section', {}, el('h3', {}, `Created ${dsMeta.label} ${rec?.Name || ''}`.trim()),
      el('p', { style: 'margin:0 0 10px' }, `On ${opp.Name}.`),
      el('a', { href: `${me.instanceUrl}/${rec.Id}`, target: '_blank', rel: 'noopener' }, 'Open in Salesforce ↗')));
    setTimeout(reload, 1500);
  }));
  const again = el('button', { class: 'primary', onclick: open }, `Create ${dsMeta.label}`);
  document.getElementById('app').replaceChildren(
    el('section', {},
      el('h3', {}, e.title || e.subject),
      el('div', { style: 'margin:-6px 0 10px' }, el('span', { class: 'status-pill ' + st }, STATUS_TEXT[st])),
      el('dl', {},
        el('dt', {}, 'When'), el('dd', {}, when),
        e.who ? [el('dt', {}, 'With'), el('dd', {}, e.who)] : null,
        e.what ? [el('dt', {}, 'Related to'), el('dd', {}, el('a', { href: `${me.instanceUrl}/${e.what.id}`, target: '_blank', rel: 'noopener' }, e.what.name || e.what.id),
          e.what.type ? ` (${e.what.type})` : '')] : null,
        e.supports.length ? [el('dt', {}, dsMeta.labelPlural), el('dd', {}, e.supports.map((r) => el('div', {},
          el('a', { href: `${me.instanceUrl}/${r.Id}`, target: '_blank', rel: 'noopener', title: r.Name || null }, dsNum(r.Name) || r.Id), r.oppName ? ` · ${r.oppName}` : '',
          r.how === 'matched' ? el('span', { class: 'tag', title: 'Yours, on the same date, on the same opportunity or account, or with the same name' }, 'matched') : null)))] : null,
      ),
    ),
    formBox,
  );
  // One Deal Support per meeting: a meeting that has one opens it for editing or removing.
  // Once it has one, the pane shows just the Deal Support, not the meeting: a summary, with Edit for the form.
  if (st === 'covered') {
    const host = { editing: null }, r = e.supports[0];
    const edit = () => editDealSupport(r.Id, host, show, reload);
    const note = el('div', { class: 'sub', style: 'margin:8px 0 0' });
    const summary = el('section', {},
      el('h3', {}, dsMeta.label, dsMeta.canUpdate ? el('button', { style: 'margin-left:10px', onclick: edit }, 'Edit') : null),
      el('a', { href: `${me.instanceUrl}/${r.Id}`, target: '_blank', rel: 'noopener', title: r.Name || null }, dsNum(r.Name) || r.Id), r.oppName ? ` · ${r.oppName}` : '',
      dsSummary(r.Id), note);
    tagMeeting(dsMeta.label).then((t) => {
      note.textContent = t === 'tagged' ? `Marked with the "${dsMeta.label}" category in your calendar.`
        : t === 'failed' ? `Couldn't add the "${dsMeta.label}" category to this meeting in Outlook.` : '';
    }).catch(() => {});
    function show() { document.getElementById('app').replaceChildren(host.editing?.box || summary); }
    return show();
  }
  if (!dsMeta.canCreate) return formBox.replaceChildren(el('div', { class: 'empty' }, `Your Salesforce user can't create ${dsMeta.labelPlural}.`));
  // A meeting with nothing yet opens straight into the form.
  open();
}

(async function init() {
  if (IN_OUTLOOK) {
    document.getElementById('ver').hidden = true;
    try {
      me = await api('/me');
      // With the Salesforce CLI login, connecting needs no clicks: do it once on opening.
      const tried = (v) => { try { return v === undefined ? sessionStorage.getItem('sfdeskTried') : v ? sessionStorage.setItem('sfdeskTried', '1') : sessionStorage.removeItem('sfdeskTried'); } catch { return '1'; } };
      if (!me.connected && me.cli && !tried()) {
        tried(true);
        return location.assign('/login?next=/outlook/pane');
      }
      if (!me.connected) return showConnect();
      tried(false);
      await showOutlookPane();
    } catch (e) {
      if (e.status !== 401) toast(e.message, 'err');
    }
    return;
  }
  try {
    me = await api('/me');
    if (me.version) document.getElementById('ver').textContent = `SF Desk v${me.version}`;
    if (!me.connected) return showConnect();
    showLoading('Loading your Salesforce data…');
    document.getElementById('who').textContent = me.user?.username || me.user?.name || '';
    document.getElementById('logout').hidden = false;
    meta = await api('/meta');
    await loadHidden();
    await loadAcctPrefs();
    showDashboard();
  } catch (e) {
    if (e.status !== 401) toast(e.message, 'err');
  }
})();
