<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Desk</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1b1f24; --muted: #667085; --line: #e3e6eb;
    --accent: #0b5cad; --accent-soft: #e8f1fb; --ok: #067647; --err: #b42318; --dirty: #fff6dd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .2px; }
  #who { margin-left: auto; color: var(--muted); font-size: 13px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  input, select, textarea { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  input:disabled, select:disabled, textarea:disabled { background: var(--bg); color: var(--muted); }
  .dirty { background: var(--dirty); border-color: #e6b94a; }

  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 50px); }
  #list { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #list .controls { padding: 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  #list .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  #list .controls input[type=checkbox] { width: auto; }
  #accounts { overflow: auto; flex: 1; }
  .acct { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .acct:hover { background: var(--bg); }
  .acct.sel { background: var(--accent-soft); }
  .acct .n { font-weight: 600; }
  .acct .m { color: var(--muted); font-size: 12px; }
  .group { padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); position: sticky; top: 0; }
  section h3 label { display: flex; gap: 6px; align-items: center; font-weight: 400; font-size: 13px; color: var(--muted); }
  section h3 input[type=checkbox] { width: auto; }
  .acct { display: flex; gap: 8px; align-items: flex-start; }
  .acct .body { flex: 1; min-width: 0; }
  .acct input[type=checkbox], td.pick input { width: auto; margin-top: 3px; }
  .is-hidden { opacity: .55; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; font-weight: 400; }
  .selbar { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .selbar[hidden] { display: none; }
  .selbar input { width: auto; } label.selbar { white-space: nowrap; font-weight: 400; }
  td.pick, th.pick { width: 1%; }
  .empty { padding: 24px 16px; color: var(--muted); }

  #detail { overflow: auto; padding: 18px 22px 40px; min-width: 0; }
  .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .title-row h2 { margin: 0; font-size: 20px; }
  .rep-pill { align-self: center; display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 12px; border-radius: 999px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; }
  .rep-pill .k { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .4px; opacity: .85; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
  section h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  section h3 .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 14px; }
  .grid label span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .grid label.wide { grid-column: 1 / -1; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.closed td { opacity: .65; }
  tr.new td { background: #fafbfc; }
  td.actions { white-space: nowrap; width: 1%; }
  .tablewrap { overflow-x: auto; }
  .col-name { min-width: 180px; } .col-stage { min-width: 150px; } .col-num { min-width: 100px; } .col-date { min-width: 140px; } .col-next { min-width: 180px; }

  .back { margin-bottom: 8px; }
  .ds-row { cursor: pointer; }
  .ds-row:hover td { background: var(--bg); }
  .ds-more td { background: #fafbfc; }
  .ds-more dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 14px; margin: 4px 0; }
  .ds-more dt { font-size: 12px; color: var(--muted); }
  .ds-more dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .grid label span.req { display: inline; color: var(--err); }
  [hidden] { display: none !important; }
  .grid input[type=checkbox] { width: auto; }
  details.optional summary { cursor: pointer; color: var(--accent); margin: 12px 0 8px; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  .center { display: grid; place-items: center; height: calc(100vh - 50px); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px; max-width: 420px; text-align: center; }
  .card p { color: var(--muted); }

  #toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px; border-radius: 8px; background: #1b1f24; color: #fff; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; }
  #toast.ok { background: var(--ok); } #toast.err { background: var(--err); }

  /* ---------- dashboard ---------- */
  header nav { display: flex; gap: 4px; margin-left: 12px; }
  header nav button { border-color: transparent; background: none; color: var(--muted); }
  header nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .dash { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #a3a29c; --grid: #eceef1;
    max-width: 1180px; margin: 0 auto; padding: 18px 22px 48px; height: calc(100vh - 50px); overflow: auto; }
  .dash-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 2px; }
  .dash-head h2 { margin: 0; font-size: 20px; }
  .dash-head label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .dash-head input { width: auto; }
  .tiles { display: grid; grid-template-columns: 1.4fr repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
  .tiles.even { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  button.tile { text-align: left; font: inherit; color: inherit; cursor: pointer; }
  button.tile:hover { border-color: var(--accent); }
  button.tile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .picks { display: flex; gap: 12px; flex-wrap: wrap; }
  .picks select { width: auto; max-width: 280px; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { white-space: nowrap; overflow-wrap: normal; font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile.hero .v { font-size: clamp(28px, 3.4vw, 44px); line-height: 1.1; }
  .tile .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile.warn .d { color: var(--err); }
  .charts { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; }
  .charts section { margin-bottom: 0; }
  .dash section { margin-bottom: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .fynav { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
  .fynav button { padding: 2px 8px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .hbars { display: grid; grid-template-columns: fit-content(40%) minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
  .hbars .lbl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; cursor: pointer; }
  .hbars .track { display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; padding: 3px 0; }
  .hbars .bar { height: 20px; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; flex: none; }
  .hbars .val { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .hbars .val span { color: var(--muted); }
  .dim { opacity: .35; }
  svg.cols { display: block; width: 100%; overflow: visible; }
  svg.cols text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
  svg.cols text.now { fill: var(--ink); font-weight: 700; }
  svg.cols text.cap { fill: var(--ink); font-variant-numeric: tabular-nums; }
  svg.cols .hit { fill: transparent; cursor: pointer; }
  svg.cols .hit:hover { fill: rgba(11, 92, 173, .06); }
  #tip { position: fixed; pointer-events: none; z-index: 10; background: #1b1f24; color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; max-width: 260px; }
  #tip b { display: block; margin-bottom: 3px; }
  #tip .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  #tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .deals td { white-space: nowrap; } .deals td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .deals th.n { text-align: right; }
  .deals tfoot td { font-weight: 600; border-top: 2px solid var(--line); border-bottom: 0; }
  .deals tbody tr { cursor: pointer; } .deals tbody tr.nolink { cursor: default; } .deals tr.subtotal td { font-weight: 600; background: var(--bg); } .deals tbody tr:hover td { background: var(--bg); }
  .deals td.wrap { white-space: normal; min-width: 180px; }
  .pastdue { color: var(--err); }
  /* ---------- my calendar ---------- */
  .cal { --covered: #c9f2d6; --covered-line: #12924a; --open: #fdd3cf; --open-line: #d92d20; --skip: #eef0f3; --skip-line: #98a2b3; --hour: 48px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 18px 22px 40px; height: calc(100vh - 50px); overflow: auto; }
  .cal.with-panel { grid-template-columns: minmax(0, 1fr) 400px; }
  .cal-main { min-width: 0; }
  .cal-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .cal-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border-left: 3px solid; }
  .week { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .week-row { display: grid; grid-template-columns: 52px repeat(var(--days), minmax(0, 1fr)); }
  .week-row > div { border-left: 1px solid var(--line); min-width: 0; }
  .week-row > div:first-child { border-left: 0; }
  .day-head { padding: 6px 8px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .day-head b { display: block; font-size: 16px; color: var(--ink); }
  .day-head.today b { color: var(--accent); }
  .allday { padding: 3px; border-bottom: 1px solid var(--line); min-height: 26px; display: grid; gap: 3px; align-content: start; }
  .gutter-label { font-size: 11px; color: var(--muted); padding: 4px 6px; text-align: right; }
  .hours-col { position: relative; }
  .hours-col .hl { position: absolute; left: 0; right: 0; border-top: 1px solid #f0f1f4; }
  .hours-col .now-line { position: absolute; left: 0; right: 0; border-top: 2px solid var(--accent); z-index: 2; }
  .gutter .hl-label { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .ev { position: absolute; border-radius: 4px; padding: 2px 5px; font-size: 12px; line-height: 1.3; overflow: hidden; cursor: pointer;
    border-left: 3px solid; text-align: left; font-family: inherit; color: var(--ink); min-height: 18px; }
  .allday .ev { position: static; }
  .ev.covered { background: var(--covered); border-color: var(--covered-line); }
  .ev.open { background: var(--open); border-color: var(--open-line); }
  .ev.skipped { background: var(--skip); border-color: var(--skip-line); color: var(--muted); }
  .ev.sel { box-shadow: 0 0 0 2px var(--accent); z-index: 3; }
  .ev .t { font-size: 11px; opacity: .8; }
  .ev .s { font-weight: 600; overflow-wrap: anywhere; }
  .cal-panel section { margin-bottom: 14px; }
  button.linkish { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-align: left; display: block; }
  button.icon-btn { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; }
  button.icon-btn:hover { color: var(--accent); }
  td.edit-cell { width: 1%; padding-right: 0; }
  section.ds-edit { margin-bottom: 14px; }
  .deals tr.sel td { background: var(--accent-soft); }
  .cal-panel .grid { grid-template-columns: 1fr; }
  .cal-panel .desc { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; font-size: 13px; background: var(--bg); border-radius: 6px; padding: 8px; }
  .cal-panel dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; margin: 0 0 10px; font-size: 13px; }
  .cal-panel dt { color: var(--muted); } .cal-panel dd { margin: 0; overflow-wrap: anywhere; }
  .status-pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 10px; padding: 1px 9px; }
  .status-pill.covered { background: var(--covered); color: #05603a; } .status-pill.open { background: var(--open); color: #912018; }
  .status-pill.skipped { background: var(--skip); color: var(--muted); }
  .opp-pick { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; }
  .opp-pick button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 6px 8px; }
  .opp-pick button:last-child { border-bottom: 0; }
  .opp-pick button.on { background: var(--accent-soft); }
  .opp-pick button.active { outline: 2px solid var(--accent); outline-offset: -2px; }
  .opp-pick .m { color: var(--muted); font-size: 12px; }
  .panel-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  @media (max-width: 1000px) { .cal.with-panel { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 1000px) {
    .tiles { grid-template-columns: repeat(2, 1fr); } .tile.hero { grid-column: 1 / -1; }
    .tiles.even { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .charts { grid-template-columns: 1fr; }
  }

  @media (max-width: 760px) {
    .tiles.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    main { grid-template-columns: 1fr; height: auto; }
    #list { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>SF Desk</h1>
  <nav id="nav" hidden>
    <button id="navDash" onclick="showDashboard()">Dashboard</button>
    <button id="navTime" onclick="showTime()">My Time</button>
    <button id="navCal" onclick="showCalendar()">My Calendar</button>
    <button id="navAccts" onclick="showMain()">Accounts</button>
  </nav>
  <span id="who"></span>
  <button id="logout" hidden>Disconnect</button>
</header>
<div id="app"></div>
<div id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>

<script src="xlsx.js"></script>
<script>
const ACCOUNT_UI = [
  ['Name', 'text'], ['Type', 'picklist'], ['Industry', 'picklist'], ['Phone', 'text'], ['Website', 'text'],
  ['AnnualRevenue', 'number'], ['NumberOfEmployees', 'number'], ['BillingCity', 'text'], ['BillingState', 'text'],
  ['Description', 'textarea'],
];
const OPP_UI = [
  ['Name', 'text', 'col-name'], ['StageName', 'picklist', 'col-stage'], ['Amount', 'number', 'col-num'],
  ['CloseDate', 'date', 'col-date'], ['Probability', 'number', 'col-num'], ['NextStep', 'text', 'col-next'],
];
const LABELS = { StageName: 'Stage', AnnualRevenue: 'Annual revenue', NumberOfEmployees: 'Employees',
  BillingCity: 'Billing city', BillingState: 'Billing state', CloseDate: 'Close date', NextStep: 'Next step',
  Probability: 'Probability %' };
const label = (f) => LABELS[f] || f;

let me = null, meta = null, current = null, accounts = [], leadSeOnly = true, dsMeta = null;
// Account list: filter to one sales rep (account owner) and/or group the list by rep.
// Opportunities: closed ones are hidden unless showClosed is ticked.
let repFilter = '', groupByRep = false, showClosed = false, sortRecent = false;
const acctOwners = new Map(); // account Id -> { id, name } of its owner, for every account loaded this session

// Hidden records live in the local database (never in Salesforce). Lists leave them out
// unless "Show hidden" is ticked; ticked rows can be hidden or unhidden in one go.
let hidden = new Map();          // id -> { id, type, name, hiddenAt }
let showHiddenAccts = false, showHiddenOpps = false;
const pickedAccts = new Set(), pickedOpps = new Set();
const isHidden = (id) => hidden.has(id);

async function loadHidden() {
  setHidden(await api('/hidden'));
}
function setHidden(list) {
  hidden = new Map(list.map((h) => [h.id, h]));
}
async function setHiddenState(type, recs, hide) {
  const ids = recs.map((r) => r.Id);
  const names = Object.fromEntries(recs.map((r) => [r.Id, r.Name]));
  setHidden(await api(hide ? '/hidden' : '/hidden/remove', { method: 'POST', body: { type, ids, names } }));
  const what = `${ids.length} ${type === 'Account' ? 'account' : 'opportunit'}${type === 'Account' ? (ids.length === 1 ? '' : 's') : (ids.length === 1 ? 'y' : 'ies')}`;
  toast(hide ? `Hid ${what}. Tick "Show hidden" to see them again.` : `Unhid ${what}.`, 'ok');
}

// ---------- helpers ----------
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : String(c));
  return n;
}

async function api(path, { method = 'GET', body } = {}) {
  const r = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-SFDesk': '1' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) showConnect(data.error);
    throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  }
  // The server answered from its local copy because Salesforce couldn't be reached.
  const cached = r.headers.get('X-SFDesk-Cached');
  if (cached) {
    const when = isNaN(Date.parse(cached)) ? '' : ' from ' + new Date(cached).toLocaleString();
    toast(`Salesforce is unreachable. Showing your saved copy${when}; changes can't be saved until it's back.`, 'err');
  }
  return data;
}

let toastTimer;
function toast(msg, kind = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = kind; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = 'none'), kind === 'err' ? 8000 : 3000);
}

const money = (n) => n == null ? '' : n.toLocaleString(undefined, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });

function field(def, value, editable, onChange) {
  const [name, kind] = def;
  let n;
  if (kind === 'picklist') {
    const options = [...(meta.picklists[name] || [])];
    if (value && !options.includes(value)) options.unshift(value);
    n = el('select', {}, el('option', { value: '' }, '—'), options.map((o) => el('option', { value: o }, o)));
  } else if (kind === 'textarea') {
    n = el('textarea', { rows: 3 });
  } else {
    n = el('input', { type: kind === 'number' ? 'number' : kind === 'date' ? 'date' : 'text', step: kind === 'number' ? 'any' : null });
  }
  n.value = value ?? '';
  n.dataset.field = name;
  n.dataset.kind = kind;
  n.disabled = !editable;
  n.setAttribute('aria-label', label(name));
  n.addEventListener('input', onChange);
  n.addEventListener('change', onChange);
  return n;
}

function readValue(n) {
  if (n.value === '') return null;
  return n.dataset.kind === 'number' ? Number(n.value) : n.value;
}

// Returns only changed fields, and highlights them.
function changes(container, original) {
  const out = {};
  container.querySelectorAll('[data-field]').forEach((n) => {
    const v = readValue(n), o = original[n.dataset.field] ?? null;
    if (v !== o) { out[n.dataset.field] = v; n.classList.add('dirty'); } else n.classList.remove('dirty');
  });
  return out;
}

function renderList() {
  const box = document.getElementById('accounts');
  const hiddenCount = accounts.filter((a) => isHidden(a.Id)).length;
  document.getElementById('hiddenAcctLabel').textContent = `Show hidden (${hiddenCount})`;
  const shown = showHiddenAccts ? accounts : accounts.filter((a) => !isHidden(a.Id));
  for (const id of [...pickedAccts]) if (!shown.some((a) => a.Id === id)) pickedAccts.delete(id);
  renderAcctSelbar();
  renderReps();
  if (!shown.length) {
    return box.replaceChildren(el('div', { class: 'empty' },
      accounts.length ? 'All accounts here are hidden. Tick "Show hidden" to see them.' : 'No accounts found.'));
  }
  const row = (a) => {
    const pick = el('input', { type: 'checkbox', checked: pickedAccts.has(a.Id), 'aria-label': `Select ${a.Name}` });
    pick.addEventListener('click', (e) => e.stopPropagation());
    pick.addEventListener('change', () => { pick.checked ? pickedAccts.add(a.Id) : pickedAccts.delete(a.Id); renderAcctSelbar(); });
    return el('div', {
      class: 'acct' + (current?.account.Id === a.Id ? ' sel' : '') + (isHidden(a.Id) ? ' is-hidden' : ''),
      onclick: () => openAccount(a.Id),
    },
      pick,
      el('div', { class: 'body' },
        el('div', { class: 'n' }, a.Name, isHidden(a.Id) ? el('span', { class: 'tag' }, 'Hidden') : null),
        el('div', { class: 'm' }, [a.Type, a.Industry, [a.BillingCity, a.BillingState].filter(Boolean).join(', ')].filter(Boolean).join(' · ') || '—'),
      ),
    );
  };
  if (!groupByRep) return box.replaceChildren(...shown.map(row));
  // Group by sales rep (account owner), reps A–Z, each group keeping the list's order.
  const groups = new Map();
  for (const a of shown) {
    const rep = a.Owner?.Name || 'No owner';
    if (!groups.has(rep)) groups.set(rep, []);
    groups.get(rep).push(a);
  }
  box.replaceChildren(...[...groups].sort((x, y) => x[0].localeCompare(y[0])).flatMap(([rep, list]) =>
    [el('div', { class: 'group' }, `${rep} (${list.length})`), ...list.map(row)]));
}

// Sales rep choices: owners of the accounts seen this session that aren't hidden (all of them while
// "Show hidden" is ticked). Remembering every account seen means picking a rep doesn't shrink the list.
function renderReps() {
  const select = document.getElementById('repSelect');
  if (!select) return;
  const byId = new Map();
  for (const [acctId, r] of acctOwners) if (showHiddenAccts || !isHidden(acctId)) byId.set(r.id, r.name);
  if (repFilter && !byId.has(repFilter)) byId.set(repFilter, [...acctOwners.values()].find((r) => r.id === repFilter)?.name || repFilter);
  select.replaceChildren(el('option', { value: '' }, 'All sales reps'),
    ...[...byId].sort((x, y) => x[1].localeCompare(y[1])).map(([id, name]) => el('option', { value: id }, name)));
  select.value = repFilter;
}

// The "N selected · Hide · Unhide" bar shown above a list while rows are ticked.
function selbar(bar, picked, records, type, after) {
  const recs = records.filter((r) => picked.has(r.Id));
  bar.hidden = !recs.length;
  if (!recs.length) return bar.replaceChildren();
  const toHide = recs.filter((r) => !isHidden(r.Id)), toShow = recs.filter((r) => isHidden(r.Id));
  const act = (list, hide) => async () => {
    try { await setHiddenState(type, list, hide); picked.clear(); after(); } catch (e) { toast(e.message, 'err'); }
  };
  bar.replaceChildren(
    el('span', {}, `${recs.length} selected`),
    toHide.length ? el('button', { onclick: act(toHide, true) }, `Hide ${toHide.length}`) : null,
    toShow.length ? el('button', { onclick: act(toShow, false) }, `Unhide ${toShow.length}`) : null,
    el('button', { onclick: () => { picked.clear(); after(); } }, 'Clear'),
  );
}

// ---------- account Deal Supports ----------
// Everyone's Deal Supports on this account and its opportunities for the last 30, 60 or 90 days or this
// fiscal year: count, hours and the list (newest first; click one to open it in Salesforce).
let acctDsRange = '90', acctDsGroup = false;
async function loadAccountDealSupports(accountId) {
  const sec = document.getElementById('acctDs');
  sec.replaceChildren(el('h3', {}, 'Deal Supports'), el('div', { class: 'empty' }, 'Loading…'));
  const today = todayStr(), fyStart = `${fiscal(today).fy - 1}-02-01`;
  const since = [addDays(today, -90), fyStart].sort()[0];
  try {
    const data = await api(`/accounts/${accountId}/deal-supports?since=${since}`);
    if (document.getElementById('acctDs') === sec && current?.account.Id === accountId) renderAccountDealSupports(data, fyStart);
  } catch (e) {
    sec.replaceChildren(el('h3', {}, 'Deal Supports'), el('div', { class: 'empty' }, e.message));
  }
}

function renderAccountDealSupports(data, fyStart) {
  const sec = document.getElementById('acctDs');
  const today = todayStr();
  const ranges = { 30: ['Last 30 days', addDays(today, -30)], 60: ['Last 60 days', addDays(today, -60)],
    90: ['Last 90 days', addDays(today, -90)], fy: [`${fyName(fiscal(today).fy)} to date`, fyStart] };
  const [rangeLabel, from] = ranges[acctDsRange];
  const toHours = (v) => v == null || v === '' ? 0
    : data.hoursUnit === 'text' ? parseDuration(v) : data.hoursUnit === 'minutes' ? Number(v) / 60 : Number(v) || 0;
  const list = data.records.filter((r) => r.date && r.date >= from && r.date <= today);
  const total = list.reduce((s, r) => s + toHours(r.hours), 0);
  const seg = el('span', { class: 'seg' }, Object.entries({ 30: '30 days', 60: '60 days', 90: '90 days', fy: fyName(fiscal(today).fy) })
    .map(([k, t]) => el('button', { class: acctDsRange === k ? 'on' : null, onclick: () => { acctDsRange = k; renderAccountDealSupports(data, fyStart); } }, t)));
  const showRole = list.some((r) => r.role);
  const showActivity = !!data.activityLabel;
  // The opportunity only when it tells rows apart: not when they're all on one, nor when the name already says it.
  const opps = new Set(list.map((r) => r.oppId));
  // Grouped by opportunity (the default), each group's subtotal names it, so the column isn't needed.
  const bySe = acctDsGroup && !!data.whoLabel;
  const showOpp = bySe && opps.size > 1 && list.some((r) => r.oppName && !String(r.Name || '').toLowerCase().includes(r.oppName.toLowerCase()));
  // The record number only (e.g. "DR-012345" -> "012345") keeps the first column narrow; the full name is its tooltip.
  const num = (name) => (String(name || '').match(/\d+(?!.*\d)/) || [name])[0];
  const ncols = 3 + showActivity + showOpp + !!data.whoLabel + showRole;
  const row = (r) => el('tr', { class: 'nolink' },
    el('td', {}, el('a', { href: `${me.instanceUrl}/${r.Id}`, target: '_blank', rel: 'noopener', title: `${r.Name || r.Id} · Open in Salesforce` }, num(r.Name) || r.Id)),
    el('td', {}, r.date),
    showActivity ? el('td', { class: 'wrap' }, r.activity) : null,
    showOpp ? el('td', { class: 'wrap' }, r.oppName) : null,
    data.whoLabel ? el('td', {}, r.who) : null,
    showRole ? el('td', {}, r.role) : null,
    el('td', { class: 'n' }, fmtH(toHours(r.hours))));
  const sumRow = (text, rows, cls) => el('tr', { class: 'nolink ' + cls },
    el('td', { colspan: ncols - 1 }, `${text} (${rows.length})`),
    el('td', { class: 'n' }, fmtH(rows.reduce((s, r) => s + toHours(r.hours), 0))));
  const tbody = el('tbody');
  const blocks = [];
  {
    // One block per opportunity (or per Assigned SE when ticked), A–Z, each ending in its subtotal.
    const groups = new Map();
    for (const r of list) {
      const k = (bySe ? r.who : r.oppName) || '(none)';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    }
    for (const [k, rows] of [...groups].sort((x, y) => x[0].localeCompare(y[0]))) {
      blocks.push([k, rows]);
      tbody.append(...rows.map(row), sumRow(`Subtotal ${k}`, rows, 'subtotal'));
    }
  }
  if (!list.length) tbody.append(el('tr', {}, el('td', { colspan: ncols, class: 'empty' }, `No ${data.labelPlural.toLowerCase()} in this period.`)));
  const group = data.whoLabel ? el('label', { class: 'selbar' }, el('input', { type: 'checkbox', checked: acctDsGroup,
    onchange: (e) => { acctDsGroup = e.target.checked; renderAccountDealSupports(data, fyStart); } }), `Group by ${data.whoLabel}`) : null;
  sec.replaceChildren(
    el('h3', {}, `${data.labelPlural}: ${rangeLabel}`, el('span', { class: 'spacer' }), group, seg,
      el('button', { disabled: !list.length, onclick: () => exportAccountDealSupports(data, blocks, bySe, toHours, rangeLabel) }, 'Export to Excel')),
    el('div', { class: 'tiles', style: 'grid-template-columns:repeat(2, minmax(0, 220px));margin-bottom:12px' },
      el('div', { class: 'tile' }, el('div', { class: 'k' }, data.labelPlural), el('div', { class: 'v' }, list.length.toLocaleString())),
      el('div', { class: 'tile' }, el('div', { class: 'k' }, data.hoursLabel), el('div', { class: 'v' }, fmtH(total)))),
    el('div', { class: 'tablewrap' }, el('table', { class: 'deals' },
      el('thead', {}, el('tr', {}, el('th', {}, '#'), el('th', {}, data.dateLabel),
        showActivity ? el('th', {}, data.activityLabel) : null, showOpp ? el('th', {}, 'Opportunity') : null,
        data.whoLabel ? el('th', {}, data.whoLabel) : null, showRole ? el('th', {}, 'Role') : null, el('th', { class: 'n' }, 'Hours'))),
      tbody,
      list.length ? el('tfoot', {}, sumRow('Total', list, '')) : null)),
  );
}

// The panel's rows as shown (same period and grouping), with full names, subtotals, the total and links.
function exportAccountDealSupports(data, blocks, bySe, toHours, rangeLabel) {
  const showRole = blocks.some(([, rows]) => rows.some((r) => r.role));
  const cols = [
    { header: data.label, width: 34 }, { header: data.dateLabel, type: 'date', width: 13 },
    ...(data.activityLabel ? [{ header: data.activityLabel, width: 22 }] : []), { header: 'Opportunity', width: 36 },
    ...(data.whoLabel ? [{ header: data.whoLabel, width: 22 }] : []), ...(showRole ? [{ header: 'Role', width: 14 }] : []),
    { header: 'Hours', type: 'number', width: 10 }, { header: 'Salesforce link', width: 45 },
  ];
  const line = (r) => [r.Name || r.Id, r.date, ...(data.activityLabel ? [r.activity] : []), r.oppName,
    ...(data.whoLabel ? [r.who] : []), ...(showRole ? [r.role] : []), toHours(r.hours), `${me.instanceUrl}/${r.Id}`];
  const sumLine = (label, rows) => ({ bold: true, values: [label, ...Array(cols.length - 3).fill(''), rows.reduce((s, r) => s + toHours(r.hours), 0), ''] });
  const rows = [];
  for (const [k, list] of blocks) rows.push(...list.map(line), sumLine(`Subtotal ${k}`, list));
  rows.push(sumLine('Total', blocks.flatMap(([, list]) => list)));
  const acct = current?.account?.Name || 'Account';
  downloadXlsx(`${acct} - ${data.labelPlural} - ${rangeLabel}${bySe ? ' by SE' : ''} - ${todayStr()}.xlsx`.replace(/[\\/:*?"<>|]/g, '-'),
    data.labelPlural, cols, rows)
    .catch((e) => toast("Couldn't build the Excel file: " + e.message, 'err'));
}

function renderSub() {
  const a = current.account;

    `${openOpps.length} open opportunities · ${money(pipeline)} open pipeline` +
    (current.opportunities.some((o) => isHidden(o.Id)) ? ' (hidden ones not counted)' : '');

function renderAccountForm() {
  const a = current.account;
  const sec = document.getElementById('acctSection');
  const form = el('div', { class: 'grid' });
  const save = el('button', { class: 'primary', disabled: true }, 'Save account');
  const revert = el('button', { disabled: true }, 'Revert');
  const onChange = () => { const dirty = Object.keys(changes(form, a)).length > 0; save.disabled = revert.disabled = !dirty; };

  for (const def of ACCOUNT_UI) {
    form.append(el('label', { class: def[1] === 'textarea' ? 'wide' : null },
      el('span', {}, label(def[0])), field(def, a[def[0]], meta.editable.Account.includes(def[0]), onChange)));
  }
  revert.addEventListener('click', renderAccountForm);
  save.addEventListener('click', async () => {
    const fields = changes(form, a);
    save.disabled = true;
    try {
      const rec = await api('/accounts/' + a.Id, { method: 'PATCH', body: { fields, lastModified: a.LastModifiedDate } });

function renderOpps() {
  renderSub();
  const sec = document.getElementById('oppSection');
  const all = current.opportunities;
  // Hidden ones go first (unless "Show hidden"), then closed ones (unless "Show closed").
  const visible = showHiddenOpps ? all : all.filter((o) => !isHidden(o.Id));
  const hiddenCount = all.length - visible.length;
  const shown = showClosed ? visible : visible.filter((o) => !o.IsClosed);
  const closed = visible.length - visible.filter((o) => !o.IsClosed).length;
  for (const id of [...pickedOpps]) if (!shown.some((o) => o.Id === id)) pickedOpps.delete(id);
  const tbody = el('tbody', {}, shown.map(oppRow));
  if (!shown.length) {
    const msg = !all.length ? 'No opportunities on this account yet.'
      : closed ? `No open opportunities. Tick "Show closed" to see the ${closed} closed one${closed === 1 ? '' : 's'}.`
      : 'All opportunities on this account are hidden.';
    tbody.append(el('tr', {}, el('td', { colspan: OPP_UI.length + 2, class: 'empty' }, msg)));
  }
  const newRow = meta.canCreateOpportunity ? newOppRow(tbody) : null;
  const showHidden = el('input', { type: 'checkbox', checked: showHiddenOpps });
  showHidden.addEventListener('change', () => { showHiddenOpps = showHidden.checked; renderOpps(); });
  const toggle = el('input', { type: 'checkbox', checked: showClosed,
    onchange: (e) => { showClosed = e.target.checked; renderOpps(); } });
  const bar = el('div', { class: 'selbar', id: 'oppSelbar', hidden: true });
  sec.replaceChildren(
    el('h3', {}, showClosed ? `Opportunities (${shown.length})` : `Open opportunities (${shown.length})`,
      el('span', { class: 'spacer' }), bar,
      el('label', { class: 'selbar' }, toggle, `Show closed (${closed})`),
      hiddenCount ? el('label', { class: 'selbar' }, showHidden, `Show hidden (${hiddenCount})`) : null),
    el('div', { class: 'tablewrap' }, el('table', {},
      el('thead', {}, el('tr', {}, el('th', { class: 'pick' }, ''), OPP_UI.map(([f, , c]) => el('th', { class: c }, label(f))), el('th', {}, ''))),
      tbody,
      newRow ? el('tfoot', {}, newRow) : null,
    )),
  );
  renderOppSelbar();
}

function renderOppSelbar() {
  selbar(document.getElementById('oppSelbar'), pickedOpps, current.opportunities, 'Opportunity', renderOpps);
}

function oppRow(o) {
  const tr = el('tr', { class: [o.IsClosed && 'closed', isHidden(o.Id) && 'is-hidden'].filter(Boolean).join(' ') || null });
  const save = el('button', { class: 'primary', disabled: true }, 'Save');
  const onChange = () => { save.disabled = !Object.keys(changes(tr, o)).length; };
  const pick = el('input', { type: 'checkbox', checked: pickedOpps.has(o.Id), 'aria-label': `Select ${o.Name}`, title: isHidden(o.Id) ? 'Hidden' : null });
  pick.addEventListener('change', () => { pick.checked ? pickedOpps.add(o.Id) : pickedOpps.delete(o.Id); renderOppSelbar(); });
  tr.append(el('td', { class: 'pick' }, pick));
  for (const def of OPP_UI) tr.append(el('td', {}, field(def, o[def[0]], meta.editable.Opportunity.includes(def[0]), onChange)));
  tr.append(el('td', { class: 'actions' }, save, ' ', el('button', { onclick: () => openOpportunity(o.Id), title: 'Focus on this opportunity and its deal supports' }, 'Open')));

  save.addEventListener('click', async () => {
    const fields = changes(tr, o);
    save.disabled = true;
    try {
      const rec = await api('/opportunities/' + o.Id, { method: 'PATCH', body: { fields, lastModified: o.LastModifiedDate } });
      const i = current.opportunities.findIndex((x) => x.Id === o.Id);
      current.opportunities[i] = rec;
      tr.replaceWith(oppRow(rec));
      toast(`Saved "${rec.Name}" to Salesforce`, 'ok');
    } catch (e) { toast(e.message, 'err'); save.disabled = false; }

}

function newOppRow(tbody) {
  const tr = el('tr', { class: 'new' });
  const blank = {};
  const add = el('button', { class: 'primary' }, 'Add');
  tr.append(el('td', { class: 'pick' }));
  for (const def of OPP_UI) {
    const n = field(def, null, true, () => {});
    if (def[0] === 'Name') n.placeholder = 'New opportunity name';
    tr.append(el('td', {}, n));
  }
  tr.append(el('td', { class: 'actions' }, add));

  add.addEventListener('click', async () => {
    const fields = changes(tr, blank);
    const missing = ['Name', 'StageName', 'CloseDate'].filter((k) => !fields[k]);
    if (missing.length) return toast('Required: ' + missing.map(label).join(', '), 'err');
    add.disabled = true;
    try {
      const rec = await api('/opportunities', { method: 'POST', body: { fields: { ...fields, AccountId: current.account.Id } } });
      current.opportunities.push(rec);
      renderOpps();
      toast(`Created "${rec.Name}" in Salesforce`, 'ok');
    } catch (e) { toast(e.message, 'err'); add.disabled = false; }
  });
  return tr;
}

// ---------- opportunity focus ----------
const OPP_FOCUS_UI = [...OPP_UI, ['Description', 'textarea']];
const shortDate = (d) => d ? new Date(String(d).replace(/\+0000$/, 'Z')).toLocaleDateString() : '';

function openOpportunity(id) {
  const o = current.opportunities.find((x) => x.Id === id);
  if (!o) return;
  const a = current.account;
  document.getElementById('detail').replaceChildren(
    el('button', { class: 'back', onclick: renderDetail }, `← ${a.Name}`),
    el('div', { class: 'title-row' },
      el('h2', {}, o.Name),
      el('a', { href: `${me.instanceUrl}/${o.Id}`, target: '_blank', rel: 'noopener' }, 'Open in Salesforce ↗'),
    ),
    el('div', { class: 'sub' }, [a.Name, o.StageName, money(o.Amount), o.CloseDate && `closes ${o.CloseDate}`, `Owner: ${o.Owner?.Name || '—'}`].filter(Boolean).join(' · ')),
    el('section', { id: 'focusOpp' }),
    el('section', { id: 'dealSupports' }, el('h3', {}, 'Deal Supports'), el('div', { class: 'empty' }, 'Loading…')),
  );
  renderFocusOpp(o);
  loadDealSupports(o);
}

function renderFocusOpp(o) {
  const sec = document.getElementById('focusOpp');
  const form = el('div', { class: 'grid' });

  }

}

async function loadDealSupports(o) {
  const sec = document.getElementById('dealSupports');
  try {
    dsMeta ||= await api('/deal-supports/meta');

  } catch (e) {
    sec.replaceChildren(el('h3', {}, 'Deal Supports'), el('div', { class: 'empty' }, e.message));
  }

// Show a field value from a Deal Support record as text.
function dsText(f, v) {
  if (v == null || v === '') return '';
  if (f.type === 'boolean') return v ? 'Yes' : 'No';
  if (f.type === 'currency') return money(v);
  if (f.type === 'percent') return v + '%';
  if (f.type === 'datetime') return new Date(String(v).replace(/\+0000$/, 'Z')).toLocaleString();
  if (f.type === 'multipicklist') return String(v).split(';').join(', ');
  return String(v);
}

// Up to five columns for the list: the name, then required fields, then status/type-like picklists.
function dsColumns() {
  const name = dsMeta.fields.find((f) => f.name === 'Name');
  const rest = dsMeta.fields.filter((f) => f !== name && f.type !== 'textarea' && f.type !== 'reference');
  const picked = [...rest.filter((f) => f.required),
    ...rest.filter((f) => f.type === 'picklist' && /status|type|stage|request|product/i.test(f.name + f.label))];
  return [name, ...picked].filter((f, i, all) => f && all.indexOf(f) === i).slice(0, 5);
}

function renderDealSupports(o, records) {
  const sec = document.getElementById('dealSupports');
  const cols = dsColumns();
  const ncols = cols.length + 2;
  const tbody = el('tbody');
  for (const r of records) {
    const more = el('tr', { class: 'ds-more', hidden: true }, el('td', { colspan: ncols },
      el('dl', {}, dsMeta.fields.filter((f) => r[f.name] != null && r[f.name] !== '' && f.type !== 'reference')
        .map((f) => el('div', {}, el('dt', {}, f.label), el('dd', {}, dsText(f, r[f.name]))))),
      el('a', { href: `${me.instanceUrl}/${r.Id}`, target: '_blank', rel: 'noopener' }, 'Open in Salesforce ↗'),
    ));
    tbody.append(
      el('tr', { class: 'ds-row', onclick: () => { more.hidden = !more.hidden; } },
        cols.map((f) => el('td', {}, dsText(f, r[f.name]) || '—')),
        el('td', {}, r.CreatedBy?.Name || ''),
        el('td', {}, shortDate(r.CreatedDate)),
      ),
      more,
    );
  }
  if (!records.length) tbody.append(el('tr', {}, el('td', { colspan: ncols, class: 'empty' }, `No ${dsMeta.labelPlural.toLowerCase()} on this opportunity yet.`)));

  const formBox = el('div');
  const add = dsMeta.canCreate ? el('button', { class: 'primary', onclick: () => {
    add.hidden = true;
    formBox.replaceChildren(dealSupportForm(o, () => { add.hidden = false; formBox.replaceChildren(); }));
  } }, `New ${dsMeta.label}`) : null;

  sec.replaceChildren(
    el('h3', {}, `${dsMeta.labelPlural} (${records.length})`, el('span', { class: 'spacer' }),
      el('button', { onclick: () => loadDealSupports(o) }, 'Reload'), add),
    formBox,
    el('div', { class: 'tablewrap' }, el('table', {},
      el('thead', {}, el('tr', {}, cols.map((f) => el('th', {}, f.label)), el('th', {}, 'Created by'), el('th', {}, 'Created'))),
      tbody,
    )),
  );
}

function dsInput(f) {
  let n;
  if (f.type === 'picklist' || f.type === 'multipicklist') {
    n = el('select', { multiple: f.type === 'multipicklist' },
      f.type === 'picklist' ? el('option', { value: '' }, '—') : null,
      (f.picklist || []).map((v) => el('option', { value: v }, v)));
  } else if (f.type === 'boolean') {
    n = el('input', { type: 'checkbox' });
  } else if (f.type === 'textarea') {
    n = el('textarea', { rows: 3, maxlength: f.length });
  } else {
    const type = { date: 'date', datetime: 'datetime-local', double: 'number', currency: 'number', percent: 'number',
      int: 'number', email: 'email', url: 'url', phone: 'tel' }[f.type] || 'text';
    n = el('input', { type, step: type === 'number' ? 'any' : null, maxlength: type === 'text' ? f.length : null,
      placeholder: f.type === 'reference' ? `${f.referenceTo?.[0] || 'Record'} Id` : null });
  }
  if (f.defaultValue != null) {
    if (f.type === 'boolean') n.checked = f.defaultValue === true || f.defaultValue === 'true';
    else if (typeof f.defaultValue !== 'object') n.value = f.defaultValue;
  }
  n.setAttribute('aria-label', f.label);
  return n;
}

function dsValue(f, n) {
  if (f.type === 'boolean') return n.checked;
  if (f.type === 'multipicklist') return [...n.selectedOptions].map((x) => x.value).join(';') || null;
  if (n.value === '') return null;
  if (['double', 'currency', 'percent', 'int'].includes(f.type)) return Number(n.value);
  if (f.type === 'datetime') return new Date(n.value).toISOString();
  return n.value;
}

// opts.values prefills fields by name; opts.submit(fields) does the create instead of posting to `o`
// (My Calendar uses both); opts.title replaces the heading. opts.edit makes it an edit form for the
// record in opts.values: fields Salesforce won't let you change are read-only, and submit gets only
// the changed fields (null for a cleared one).
function dealSupportForm(o, close, opts = {}) {
  const fields = dsMeta.fields.filter((f) => f.createable);
  const inputs = new Map(fields.map((f) => [f, dsInput(f)]));
  for (const [f, n] of inputs) {
    if (opts.edit) {
      if (f.type === 'boolean') n.checked = false; else if (f.type !== 'multipicklist') n.value = '';
      if (f.updateable === false) n.disabled = true;
    }
    const v = opts.values?.[f.name];
    if (v == null || v === '') continue;
    if (f.type === 'boolean') n.checked = !!v;
    else if (f.type === 'multipicklist') for (const x of n.options) x.selected = String(v).split(';').includes(x.value);
    else if (f.type === 'datetime') n.value = `${localDay(new Date(v))}T${hhmm24(new Date(v))}`;
    else n.value = v;
  }
  const initial = new Map([...inputs].map(([f, n]) => [f, JSON.stringify(dsValue(f, n))]));
  const cell = (f) => el('label', { class: f.type === 'textarea' ? 'wide' : null },
    el('span', {}, f.label, f.required ? el('span', { class: 'req' }, ' *') : null), inputs.get(f));
  // Shown up front: required fields, then the time fields (customer-facing, internal, travel) with a live total.
  const time = fields.filter((f) => f.timeEntry);
  const required = fields.filter((f) => f.required && !f.timeEntry);
  const optional = fields.filter((f) => !f.required && !f.timeEntry);
  const total = el('output', { style: 'display:block;padding:6px 0;font-weight:600' });
  const showTotal = () => {
    const h = time.reduce((s, f) => s + (Number(inputs.get(f).value) || 0), 0);
    total.textContent = h.toLocaleString(undefined, { maximumFractionDigits: 2 });
  };
  for (const f of time) inputs.get(f).addEventListener('input', showTotal);
  showTotal();
  const create = el('button', { class: 'primary' }, opts.edit ? 'Save changes' : `Create ${dsMeta.label}`);
  const box = el('section', {},
    el('h3', {}, opts.title || `New ${dsMeta.label} for ${o.Name}`),
    el('div', { class: 'grid' }, required.map(cell)),
    time.length ? el('div', { class: 'grid', style: 'margin-top:10px' }, time.map(cell),
      time.length > 1 ? el('label', {}, el('span', {}, 'Total time'), total) : null) : null,
    optional.length ? el('details', { class: 'optional' },
      el('summary', {}, `More fields (${optional.length})`), el('div', { class: 'grid' }, optional.map(cell))) : null,
    el('div', { class: 'form-actions' }, el('button', { onclick: close }, 'Cancel'), create),
  );
  create.addEventListener('click', async () => {
    const body = {}, now = new Map();
    for (const [f, n] of inputs) {
      const v = dsValue(f, n);
      now.set(f, v);
      if (opts.edit) { if (!n.disabled && JSON.stringify(v) !== initial.get(f)) body[f.name] = v; }
      else if (v !== null && !(f.type === 'boolean' && v === false && f.defaultValue !== true)) body[f.name] = v;
    }
    const missing = fields.filter((f) => f.required && now.get(f) == null);
    if (missing.length) return toast('Required: ' + missing.map((f) => f.label).join(', '), 'err');
    create.disabled = true;
    try {
      if (opts.submit) return await opts.submit(body);
      const rec = await api(`/opportunities/${o.Id}/deal-supports`, { method: 'POST', body: { fields: body } });
      toast(`Created ${dsMeta.label}${rec?.Name ? ` "${rec.Name}"` : ''} in Salesforce`, 'ok');
      loadDealSupports(o);
    } catch (e) {
      toast(e.message, 'err'); create.disabled = false;
      // Salesforce wants a field that sits under "More fields": open it so the field can be filled in.
      const named = optional.find((f) => e.message.includes(f.name) || e.message.includes(f.label));
      if (named) { box.querySelector('details.optional').open = true; inputs.get(named).focus(); }
    }
  });
  return box;
}

// ---------- dashboard ----------
// Statistics on the open opportunities in your list (hidden records left out): totals by stage,
// and the forecast by close date per fiscal month, quarter or year.
// The fiscal year starts Feb 1 and is named for the calendar year it ends in: FY27 = Feb 2026 – Jan 2027.
const FY_START = 1; // month index (0 = January)
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fyName = (fy) => 'FY' + String(fy % 100).padStart(2, '0');
// Forecast categories, bottom of the stack first, with their series colors.
const FORECAST = [['Commit', 'var(--s1)'], ['Best Case', 'var(--s2)'], ['Pipeline', 'var(--s3)'], ['Omitted', 'var(--s4)']];

function fiscal(date) { // 'YYYY-MM-DD' -> { y, m, fy, q }
  const y = Number(date.slice(0, 4)), m = Number(date.slice(5, 7)) - 1;
  const fy = m >= FY_START ? y + 1 : y;
  return { y, m, fy, q: Math.floor(((m - FY_START + 12) % 12) / 3) + 1 };
}
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const periodKey = (view, f) => view === 'year' ? fyName(f.fy)
  : view === 'quarter' ? `${fyName(f.fy)} Q${f.q}` : `${f.y}-${String(f.m + 1).padStart(2, '0')}`;
const amt = (o) => Number(o.Amount) || 0;
const sum = (list) => list.reduce((s, o) => s + amt(o), 0);
const weighted = (list) => list.reduce((s, o) => s + amt(o) * (Number(o.Probability) || 0) / 100, 0);
const compact = (n) => n.toLocaleString(undefined, { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: n >= 1e6 ? 1 : 0 });
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;

const dash = { all: [], view: 'month', fy: null, pick: null };

async function showDashboard() {
  setNav('dash');
  current = null;
  const mine = el('input', { type: 'checkbox', checked: leadSeOnly });
  mine.addEventListener('change', () => { leadSeOnly = mine.checked; loadDashboard(); });
  document.getElementById('app').replaceChildren(el('div', { class: 'dash' },
    el('div', { class: 'dash-head' },
      el('h2', {}, 'Pipeline'),
      el('label', {}, mine, "Only where I'm Lead SE"),
      el('span', { class: 'spacer', style: 'flex:1' }),
      el('button', { onclick: loadDashboard }, 'Reload'),
    ),
    el('div', { class: 'sub', id: 'dashSub' }, 'Loading…'),
    el('div', { id: 'dashBody' }),
  ));
  loadDashboard();
}

async function loadDashboard() {
  try {
    const { opportunities } = await api('/pipeline?leadse=' + (leadSeOnly ? '1' : '0'));
    dash.all = opportunities.filter((o) => o.CloseDate);
    if (document.getElementById('dashBody')) renderDashboard();
  } catch (e) {
    const sub = document.getElementById('dashSub');
    if (sub) sub.textContent = e.message;
  }
}

function renderDashboard() {
  document.getElementById('tip').style.display = 'none';
  const opps = dash.all.filter((o) => !isHidden(o.Id) && !isHidden(o.AccountId));
  const hiddenCount = dash.all.length - opps.length;
  const today = todayStr(), now = fiscal(today);
  dash.fy ??= now.fy;
  document.getElementById('dashSub').textContent =
    `${plural(opps.length, 'open opportunity', 'open opportunities')}${leadSeOnly ? " where you're Lead SE" : ''}` +
    (hiddenCount ? `, not counting ${hiddenCount} hidden` : '') +
    ` · Fiscal years start Feb 1 and are named for the year they end in (${fyName(now.fy)} = Feb ${now.fy - 1} – Jan ${now.fy})`;

  const inQ = opps.filter((o) => { const f = fiscal(o.CloseDate); return f.fy === now.fy && f.q === now.q; });
  const inFy = opps.filter((o) => fiscal(o.CloseDate).fy === now.fy);
  const late = opps.filter((o) => o.CloseDate < today);
  const tile = (k, v, d, cls = '') => el('div', { class: 'tile ' + cls }, el('div', { class: 'k' }, k), el('div', { class: 'v' }, v), el('div', { class: 'd' }, d));

  document.getElementById('dashBody').replaceChildren(
    el('div', { class: 'tiles' },
      tile('Open pipeline', compact(sum(opps)), `${money(sum(opps))} · ${plural(opps.length, 'opportunity', 'opportunities')}`, 'hero'),
      tile('Weighted pipeline', compact(weighted(opps)), 'Amount × probability'),
      tile(`This quarter (${fyName(now.fy)} Q${now.q})`, compact(sum(inQ)), `${plural(inQ.length, 'deal')} · ${compact(weighted(inQ))} weighted`),
      tile(`This fiscal year (${fyName(now.fy)})`, compact(sum(inFy)), `${plural(inFy.length, 'deal')} · ${compact(weighted(inFy))} weighted`),
      tile('Past close date', compact(sum(late)), late.length ? `⚠ ${plural(late.length, 'deal')} still open` : 'None overdue', late.length ? 'warn' : ''),
    ),
    el('div', { class: 'charts' },
      el('section', { id: 'stageChart' }),
      el('section', { id: 'forecastChart' }),
    ),
    el('section', { id: 'dealList' }),
  );
  renderStageChart(opps);
  renderForecastChart(opps, now, today);
  renderDeals(opps, today);
}

// Pipeline by stage: one horizontal bar per stage, in the org's stage order.
function renderStageChart(opps) {
  const sec = document.getElementById('stageChart');
  const by = new Map();
  for (const o of opps) {
    const k = o.StageName || 'No stage';
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(o);
  }
  const order = meta.picklists.StageName || [];
  const stages = [...by.keys()].sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));
  const max = Math.max(1, ...stages.map((k) => sum(by.get(k))));
  const pick = dash.pick?.kind === 'stage' ? dash.pick.key : null;
  const grid = el('div', { class: 'hbars' });
  for (const k of stages) {
    const list = by.get(k), total = sum(list);
    const choose = () => { dash.pick = pick === k ? null : { kind: 'stage', key: k, label: k }; renderDashboard(); };
    const dim = pick && pick !== k ? ' dim' : '';
    const track = el('div', { class: 'track' + dim, onclick: choose },
      el('div', { class: 'bar', style: `width: calc((100% - 96px) * ${total / max})` }),
      el('div', { class: 'val' }, compact(total), el('span', {}, ` · ${list.length}`)));
    hover(track, () => tipHtml(k, [['Total', money(total)], ['Weighted', money(weighted(list))], ['Opportunities', list.length]]));
    grid.append(el('div', { class: 'lbl' + dim, title: k, onclick: choose }, k), track);
  }
  sec.replaceChildren(el('h3', {}, 'Pipeline by stage'),
    stages.length ? grid : el('div', { class: 'empty' }, 'No open opportunities.'));
}

// Forecast by close date: stacked columns per fiscal month / quarter / year, by forecast category.
function renderForecastChart(opps, now, today) {
  const sec = document.getElementById('forecastChart');
  const view = dash.view;
  const fys = opps.map((o) => fiscal(o.CloseDate).fy);
  const minFy = Math.min(now.fy, ...fys), maxFy = Math.max(now.fy, ...fys);
  dash.fy = Math.min(maxFy, Math.max(minFy, dash.fy));

  // The periods to show, in order.
  let periods = [];
  if (view === 'month') {
    for (let i = 0; i < 12; i++) {
      const m = (FY_START + i) % 12, y = dash.fy - 1 + (FY_START + i >= 12 ? 1 : 0);
      periods.push({ key: periodKey('month', { y, m }), label: MONTHS[m], long: `${MONTHS[m]} ${y} (${fyName(dash.fy)})` });
    }
  } else {
    const lo = Math.min(...(opps.length ? fys : [now.fy])), hi = Math.max(now.fy, ...fys);
    for (let fy = Math.min(lo, now.fy); fy <= hi; fy++) {
      if (view === 'year') periods.push({ key: fyName(fy), label: fyName(fy), long: `${fyName(fy)} (Feb ${fy - 1} – Jan ${fy})` });
      else for (let q = 1; q <= 4; q++) periods.push({ key: `${fyName(fy)} Q${q}`, label: `Q${q} ${fyName(fy)}`, long: `${fyName(fy)} Q${q}` });
    }
    // Drop empty quarters at either end, but keep the current one.
    const nowKey = periodKey(view, now);
    const has = new Set(opps.map((o) => periodKey(view, fiscal(o.CloseDate))));
    while (periods.length > 1 && !has.has(periods[0].key) && periods[0].key !== nowKey) periods.shift();
    while (periods.length > 1 && !has.has(periods.at(-1).key) && periods.at(-1).key !== nowKey) periods.pop();
  }
  const byKey = new Map(periods.map((p) => [p.key, []]));
  for (const o of opps) byKey.get(periodKey(view, fiscal(o.CloseDate)))?.push(o);
  const nowKey = periodKey(view, now);

  // Stack by forecast category when the org returns it, else one series.
  const useCats = opps.some((o) => o.ForecastCategoryName);
  const cats = useCats ? FORECAST.filter(([c]) => opps.some((o) => o.ForecastCategoryName === c)) : [['Amount', 'var(--s1)']];
  if (useCats && opps.some((o) => !FORECAST.some(([c]) => c === o.ForecastCategoryName))) cats.push(['Other', 'var(--s4)']);
  const catOf = (o) => !useCats ? 'Amount' : FORECAST.some(([c]) => c === o.ForecastCategoryName) ? o.ForecastCategoryName : 'Other';

  const seg = el('div', { class: 'seg' }, [['month', 'Month'], ['quarter', 'Quarter'], ['year', 'Year']].map(([v, t]) =>
    el('button', { class: view === v ? 'on' : null, onclick: () => { dash.view = v; dash.pick = null; renderDashboard(); } }, t)));
  const fynav = view === 'month' ? el('span', { class: 'fynav' },
    el('button', { disabled: dash.fy <= minFy, onclick: () => { dash.fy--; dash.pick = null; renderDashboard(); }, 'aria-label': 'Previous fiscal year' }, '‹'),
    fyName(dash.fy),
    el('button', { disabled: dash.fy >= maxFy, onclick: () => { dash.fy++; dash.pick = null; renderDashboard(); }, 'aria-label': 'Next fiscal year' }, '›')) : null;
  const legend = cats.length > 1 ? el('div', { class: 'legend' },
    cats.map(([c, color]) => el('span', {}, el('i', { style: `background:${color}` }), c))) : null;
  const box = el('div');
  sec.replaceChildren(el('h3', {}, 'Forecast by close date', el('span', { class: 'spacer' }), fynav, seg), legend, box);

  // Draw once the section is in the page, so its width is known.
  const W = Math.max(320, box.clientWidth || 600), H = 250, top = 18, bottom = 26, left = 46, right = 4;
  const totals = periods.map((p) => sum(byKey.get(p.key)));
  const ticks = niceTicks(Math.max(...totals, 1));
  const ymax = ticks.at(-1), plotH = H - top - bottom;
  const y = (v) => top + plotH - (v / ymax) * plotH;
  const slot = (W - left - right) / periods.length;
  const bw = Math.min(24, slot * 0.6);
  const pick = dash.pick?.kind === 'period' ? dash.pick.key : null;
  const g = svgEl('svg', { class: 'cols', viewBox: `0 0 ${W} ${H}`, height: H, role: 'img',
    'aria-label': 'Open pipeline by close date' });
  for (const t of ticks) {
    g.append(svgEl('line', { x1: left, x2: W - right, y1: y(t), y2: y(t), stroke: t ? 'var(--grid)' : 'var(--line)', 'stroke-width': 1 }),
      svgEl('text', { x: left - 6, y: y(t) + 4, 'text-anchor': 'end' }, t ? compact(t) : '$0'));
  }
  const labelEvery = Math.ceil(28 / slot) || 1;
  periods.forEach((p, i) => {
    const list = byKey.get(p.key), cx = left + slot * i + slot / 2, x = cx - bw / 2;
    const parts = cats.map(([c, color]) => [c, color, sum(list.filter((o) => catOf(o) === c))]).filter((s) => s[2] > 0);
    const col = svgEl('g', { class: pick && pick !== p.key ? 'dim' : null });
    let base = 0;
    parts.forEach(([, color, v], j) => {
      const y0 = y(base), y1 = y(base + v), last = j === parts.length - 1;
      const h = Math.max(1, y0 - y1 - (j ? 2 : 0)); // 2px surface gap between stacked segments
      col.append(svgEl('path', { d: barPath(x, y0 - (j ? 2 : 0) - h, bw, h, last ? 4 : 0), fill: color }));
      base += v;
    });
    g.append(col);
    if (totals[i] && slot >= 40) g.append(svgEl('text', { class: 'cap', x: cx, y: y(totals[i]) - 5, 'text-anchor': 'middle' }, compact(totals[i])));
    if (i % labelEvery === 0 || p.key === nowKey) {
      g.append(svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: p.key === nowKey ? 'now' : null }, p.label));
    }
    const hit = svgEl('rect', { class: 'hit', x: left + slot * i, y: top, width: slot, height: plotH });
    hit.addEventListener('click', () => {
      dash.pick = pick === p.key ? null : { kind: 'period', view, key: p.key, label: p.long };
      renderDashboard();
    });
    hover(hit, () => tipHtml(p.long + (p.key === nowKey ? ' · now' : ''), [
      ...(cats.length > 1 ? parts.map(([c, color, v]) => [c, money(v), color]) : []),
      ['Total', money(totals[i])], ['Weighted', money(weighted(list))], ['Opportunities', list.length]]));
    g.append(hit);
  });
  box.append(g);
}

// Round axis steps: 0 and 4–5 clean values covering max.
function niceTicks(max) {
  const raw = max / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => s >= raw);
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out.at(-1) < max) out.push(out.at(-1) + step);
  return out;
}

// A column with square bottom and rounded top corners (r = 0 for a square top).
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function svgEl(tag, attrs = {}, text) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}

function tipHtml(title, rows) {
  return [el('b', {}, title), ...rows.map(([k, v, color]) =>
    el('div', { class: 'row' }, el('span', {}, color ? el('i', { style: `background:${color}` }) : null, k), el('span', {}, String(v))))];
}

function hover(node, content) {
  const tip = document.getElementById('tip');
  node.addEventListener('mouseenter', () => { tip.replaceChildren(...content()); tip.style.display = 'block'; });
  node.addEventListener('mousemove', (e) => {
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
  node.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}

// ---------- My Time ----------
// Your hours from the Deal Supports where you are the chosen user (Owner by default), across all
// opportunities: this week, last week, the last 30 days, this fiscal quarter and year, per week,
// and per opportunity. Weeks start on Monday.
const time = { data: null, range: 'fy', opp: null };
// Field picks that differ from the server's defaults, kept in this browser. (v2: picks saved by the
// first version, which had different defaults, are ignored.)
const TIME_PREFS = 'sfdesk.time.v2';
const timePrefs = () => { try { return JSON.parse(localStorage.getItem(TIME_PREFS)) || {}; } catch { return {}; } };
const saveTimePrefs = (key, value, dflt) => {
  try {
    const p = timePrefs();
    if (value === dflt) delete p[key]; else p[key] = value;
    localStorage.setItem(TIME_PREFS, JSON.stringify(p));
  } catch {}
};

const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10) + n, 12); return ymd(d); };
const mondayOf = (s) => addDays(s, -((new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10), 12).getDay() + 6) % 7));
const monDay = (s) => `${MONTHS[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}`;
const fmtH = (h) => h.toLocaleString(undefined, { maximumFractionDigits: 1 }) + ' h';
const hoursOf = (list) => list.reduce((s, e) => s + e.hours, 0);

// "1.5 hours", "30 min", "1 hr 30 mins", "0:45" -> hours. A bare number counts as hours.
function parseDuration(v) {
  const t = String(v).toLowerCase();
  const hm = t.match(/(\d+):(\d{2})/);
  if (hm) return +hm[1] + +hm[2] / 60;
  let h = 0, any = false;
  for (const [, n, u = 'h'] of t.matchAll(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m)?\b/g)) {
    h += u.startsWith('m') ? n / 60 : +n;
    any = true;
  }
  if (!any && /half/.test(t)) return 0.5;
  return any ? h : 0;
}

// The fields the hours, date and "mine" come from: the saved choice if still offered, else the server's pick.
function timeChoice() {
  const d = time.data, p = timePrefs();
  const hoursOpts = d.hoursFields.flatMap((f) => f.unit === 'text' ? [{ ...f, key: f.name + '|text' }]
    : [{ ...f, key: `${f.name}|${f.unit}` }, { ...f, unit: f.unit === 'hours' ? 'minutes' : 'hours', key: `${f.name}|${f.unit === 'hours' ? 'minutes' : 'hours'}` }]);
  const hours = hoursOpts.find((o) => o.key === p.hours) || hoursOpts[0];
  const date = d.dateFields.find((f) => f.name === p.date) || d.dateFields[0];
  return { hoursOpts, hours, date };
}

function timeEntries() {
  const d = time.data, { hours, date } = timeChoice();
  return d.records.map((r) => {
    const raw = r[hours.name], dv = r[date.name];
    const opp = d.oppRel ? r[d.oppRel] : null;
    return {
      id: r.Id,
      name: r.Name,
      date: !dv ? null : String(dv).length > 10 ? ymd(new Date(String(dv).replace(/\+0000$/, 'Z'))) : String(dv).slice(0, 10),
      hours: raw == null || raw === '' ? 0 : hours.unit === 'text' ? parseDuration(raw) : hours.unit === 'minutes' ? Number(raw) / 60 : Number(raw) || 0,
      oppId: r[d.oppField] || null,
      oppName: opp?.Name || (r[d.oppField] ? 'Opportunity' : 'No opportunity'),
      accountId: opp?.AccountId || null,
      accountName: opp?.Account?.Name || '',
      role: d.roleField ? r[d.roleField] || '' : '',
    };
  });
}

// The periods on the tiles, plus "all time" and any week picked on the chart.
function timeRanges(today) {
  const now = fiscal(today), mon = mondayOf(today), qm = (FY_START + (now.q - 1) * 3) % 12;
  const span = (a, b) => (e) => e.date && e.date >= a && e.date <= b;
  return {
    week: { label: 'This week', sub: `${monDay(mon)} – ${monDay(addDays(mon, 6))}`, test: span(mon, addDays(mon, 6)) },
    prev: { label: 'Previous week', sub: `${monDay(addDays(mon, -7))} – ${monDay(addDays(mon, -1))}`, test: span(addDays(mon, -7), addDays(mon, -1)) },
    d30: { label: 'Last 30 days', sub: `${monDay(addDays(today, -29))} – ${monDay(today)}`, test: span(addDays(today, -29), today) },
    q: { label: `This quarter (${fyName(now.fy)} Q${now.q})`, sub: `${MONTHS[qm]} – ${MONTHS[(qm + 2) % 12]}`, test: (e) => { if (!e.date) return false; const f = fiscal(e.date); return f.fy === now.fy && f.q === now.q; } },
    fy: { label: `This fiscal year (${fyName(now.fy)})`, sub: `Feb ${now.fy - 1} – Jan ${now.fy}`, test: (e) => !!e.date && fiscal(e.date).fy === now.fy },
    all: { label: 'All time', sub: null, test: () => true },
  };
}
function timeRange(today) {
  const ranges = timeRanges(today), r = time.range;
  if (r.startsWith('w:')) {
    const a = r.slice(2), b = addDays(a, 6);
    return { label: `Week of ${monDay(a)} ${a.slice(0, 4)}`, test: (e) => e.date && e.date >= a && e.date <= b };
  }
  return ranges[r] || ranges.fy;
}

async function showTime() {
  setNav('time');
  current = null;
  document.getElementById('app').replaceChildren(el('div', { class: 'dash' },
    el('div', { class: 'dash-head' },
      el('h2', {}, 'My Time'),
      el('span', { id: 'timePicks', class: 'picks' }),
      el('span', { class: 'spacer', style: 'flex:1' }),
      el('button', { onclick: loadTime }, 'Reload'),
    ),
    el('div', { class: 'sub', id: 'timeSub' }, 'Loading…'),
    el('div', { id: 'timeBody' }),
  ));
  loadTime();
}

async function loadTime() {
  try {
    const by = timePrefs().by;
    time.data = await api('/my-time' + (by ? '?by=' + encodeURIComponent(by) : ''));
    if (document.getElementById('timeBody')) renderTime();
  } catch (e) {
    const sub = document.getElementById('timeSub');
    if (sub) sub.textContent = e.message;
  }
}

function renderTime() {
  document.getElementById('tip').style.display = 'none';
  const d = time.data, today = todayStr(), now = fiscal(today);
  const { hoursOpts, hours, date } = timeChoice();
  const by = d.userFields.find((f) => f.name === d.by) || d.userFields[0];

  // Which fields count: picked here, remembered on this machine. Each shows how many of your records fill it.
  // "Total Time (Hours)" needs no "(hours)"; only say the unit when the label doesn't, or when reading it the other way.
  const unitLabel = (o) => o.unit === 'text' ? o.label
    : o.key !== hoursOpts.find((x) => x.name === o.name).key ? `${o.label} (read as ${o.unit})`
    : new RegExp(o.unit === 'hours' ? 'hour|hrs' : 'min', 'i').test(o.label) ? o.label : `${o.label} (${o.unit})`;
  const counted = (f) => f.count != null ? ` · ${plural(f.count, 'record').replace(/^\d+/, f.count.toLocaleString())}` : '';
  const pick = (labelText, opts, value, onPick) => {
    const s = el('select', {}, opts.map(([v, t]) => el('option', { value: v, selected: v === value }, t)));
    s.addEventListener('change', () => onPick(s.value));
    return el('label', {}, labelText, s);
  };
  document.getElementById('timePicks').replaceChildren(
    pick('Mine by', d.userFields.map((f) => [f.name, f.label + counted(f)]), by.name,
      (v) => { saveTimePrefs('by', v, d.userFields[0].name); loadTime(); }),
    pick('Hours from', hoursOpts.map((o) => [o.key, unitLabel(o) + counted(o)]), hours.key,
      (v) => { saveTimePrefs('hours', v, hoursOpts[0].key); renderTime(); }),
    d.dateFields.length > 1 ? pick('Date', d.dateFields.map((f) => [f.name, f.label]), date.name,
      (v) => { saveTimePrefs('date', v, d.dateFields[0].name); renderTime(); }) : null,
  );

  const all = timeEntries();
  const undated = all.filter((e) => !e.date).length;
  document.getElementById('timeSub').textContent =
    `${plural(all.length, d.label, d.labelPlural)} where ${by.label} is you · hours from ${hours.label}` +
    `, dated by ${date.label}${undated ? ` (${undated} undated, counted only in All time)` : ''}` +
    ` · Weeks start Monday · ${fyName(now.fy)} = Feb ${now.fy - 1} – Jan ${now.fy}`;

  const ranges = timeRanges(today);
  const tile = (key) => {
    const r = ranges[key], list = all.filter(r.test), opps = new Set(list.map((e) => e.oppId)).size;
    return el('button', { class: 'tile' + (time.range === key ? ' on' : ''), title: 'Show this period below',
      onclick: () => { time.range = key; time.opp = null; renderTime(); } },
      el('div', { class: 'k' }, r.label), el('div', { class: 'v' }, fmtH(hoursOf(list))),
      el('div', { class: 'd' }, [r.sub, list.length ? `${plural(list.length, 'activity', 'activities')} · ${plural(opps, 'opp', 'opps')}` : 'Nothing logged'].filter(Boolean).join(' · ')));
  };
  document.getElementById('timeBody').replaceChildren(
    el('div', { class: 'tiles even' }, ['week', 'prev', 'd30', 'q', 'fy'].map(tile)),
    el('div', { class: 'charts' },
      el('section', { id: 'weekChart' }),
      el('section', { id: 'oppTime' }),
    ),
    el('section', { id: 'timeList' }),
  );
  renderWeekChart(all, today);
  renderOppTime(all, today);
  renderTimeList(all, today);
}

// Hours per week for the last 13 weeks; click a week to list it.
function renderWeekChart(all, today) {
  const sec = document.getElementById('weekChart');
  const thisMon = mondayOf(today);
  const weeks = Array.from({ length: 13 }, (_, i) => addDays(thisMon, (i - 12) * 7));
  const byWeek = new Map(weeks.map((w) => [w, []]));
  for (const e of all) if (e.date) byWeek.get(mondayOf(e.date))?.push(e);
  const box = el('div');
  sec.replaceChildren(el('h3', {}, 'Hours by week', el('span', { class: 'spacer' }), el('span', { class: 'sub', style: 'margin:0' }, 'Last 13 weeks')), box);

  const W = Math.max(320, box.clientWidth || 480), H = 250, top = 18, bottom = 26, left = 40, right = 4;
  const totals = weeks.map((w) => hoursOf(byWeek.get(w)));
  const ticks = niceTicks(Math.max(...totals, 1));
  const ymax = ticks.at(-1), plotH = H - top - bottom;
  const y = (v) => top + plotH - (v / ymax) * plotH;
  const slot = (W - left - right) / weeks.length, bw = Math.min(24, slot * 0.6);
  const picked = time.range.startsWith('w:') ? time.range.slice(2) : null;
  const g = svgEl('svg', { class: 'cols', viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'My hours by week' });
  for (const t of ticks) {
    g.append(svgEl('line', { x1: left, x2: W - right, y1: y(t), y2: y(t), stroke: t ? 'var(--grid)' : 'var(--line)', 'stroke-width': 1 }),
      svgEl('text', { x: left - 6, y: y(t) + 4, 'text-anchor': 'end' }, t.toLocaleString(undefined, { maximumFractionDigits: 2 })));
  }
  const labelEvery = Math.ceil(44 / slot) || 1;
  weeks.forEach((w, i) => {
    const cx = left + slot * i + slot / 2, h = totals[i];
    if (h > 0) {
      const ph = Math.max(1, y(0) - y(h));
      g.append(svgEl('path', { d: barPath(cx - bw / 2, y(0) - ph, bw, ph, 4), fill: 'var(--s1)', class: picked && picked !== w ? 'dim' : null }));
      if (slot >= 34) g.append(svgEl('text', { class: 'cap', x: cx, y: y(h) - 5, 'text-anchor': 'middle' }, h.toLocaleString(undefined, { maximumFractionDigits: 1 })));
    }
    if ((weeks.length - 1 - i) % labelEvery === 0) {
      g.append(svgEl('text', { x: cx, y: H - 8, 'text-anchor': 'middle', class: w === thisMon ? 'now' : null }, monDay(w)));
    }
    const hit = svgEl('rect', { class: 'hit', x: left + slot * i, y: top, width: slot, height: plotH });
    hit.addEventListener('click', () => { time.range = picked === w ? 'fy' : 'w:' + w; time.opp = null; renderTime(); });
    const list = byWeek.get(w);
    hover(hit, () => tipHtml(`Week of ${monDay(w)}${w === thisMon ? ' · this week' : ''}`, [
      ['Hours', fmtH(h)], ['Activities', list.length], ['Opportunities', new Set(list.map((e) => e.oppId)).size]]));
    g.append(hit);
  });
  box.append(g);
}

// Total hours per opportunity in the chosen period; click one to list its activities.
function renderOppTime(all, today) {
  const sec = document.getElementById('oppTime');
  const range = timeRange(today);
  const list = all.filter(range.test);
  const by = new Map();
  for (const e of list) {
    const k = e.oppId || '';
    if (!by.has(k)) by.set(k, { id: e.oppId, name: e.oppName, account: e.accountName, entries: [] });
    by.get(k).entries.push(e);
  }
  const rows = [...by.values()].map((o) => ({ ...o, hours: hoursOf(o.entries) })).sort((a, b) => b.hours - a.hours);
  const TOP = 15, shown = rows.slice(0, TOP), max = Math.max(0.01, ...rows.map((o) => o.hours));
  const seg = el('div', { class: 'seg' }, [['week', 'Week'], ['prev', 'Prev'], ['d30', '30 days'], ['q', 'Quarter'], ['fy', 'Year'], ['all', 'All']].map(([v, t]) =>
    el('button', { class: time.range === v ? 'on' : null, onclick: () => { time.range = v; time.opp = null; renderTime(); } }, t)));
  const grid = el('div', { class: 'hbars' });
  for (const o of shown) {
    const choose = () => { time.opp = time.opp === o.id ? null : o.id; renderTime(); };
    const dim = time.opp !== null && time.opp !== o.id ? ' dim' : '';
    const track = el('div', { class: 'track' + dim, onclick: choose },
      el('div', { class: 'bar', style: `width: calc((100% - 110px) * ${o.hours / max})` }),
      el('div', { class: 'val' }, fmtH(o.hours), el('span', {}, ` · ${o.entries.length}`)));
    hover(track, () => tipHtml(o.name, [['Account', o.account || '—'], ['Hours', fmtH(o.hours)], ['Activities', o.entries.length],
      ['Share of period', Math.round(o.hours / Math.max(0.01, hoursOf(list)) * 100) + '%']]));
    grid.append(el('div', { class: 'lbl' + dim, title: o.account ? `${o.name} · ${o.account}` : o.name, onclick: choose }, o.name), track);
  }
  sec.replaceChildren(el('h3', {}, 'Hours by opportunity', el('span', { class: 'spacer' }), seg),
    el('div', { class: 'sub', style: 'margin:-4px 0 8px' }, `${range.label}: ${fmtH(hoursOf(list))} on ${plural(rows.length, 'opportunity', 'opportunities')}` +
      (rows.length > TOP ? ` · top ${TOP} shown` : '')),
    rows.length ? grid : el('div', { class: 'empty' }, 'No time logged in this period.'));
}

// ---------- My Calendar ----------
// Your Salesforce calendar (Events you own), a week at a time. Events covered by a Deal Support are
// green, the rest red (grey once marked "No Deal Support needed"). Pick an event to create a Deal
// Support from it: choose the opportunity, and the form is prefilled from the event.
const cal = { week: null, data: null, sel: null, loading: 0, sources: null, source: null };
const CAL_SOURCE = 'sfdesk.calSource';
const evTime = (s) => new Date(String(s).replace(/\+0000$/, 'Z'));
const hhmm = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const evStatus = (e) => e.supports.length ? 'covered' : e.skipped ? 'skipped' : 'open';
const STATUS_TEXT = { covered: 'Has a Deal Support', open: 'No Deal Support', skipped: 'No Deal Support needed' };
const localDate = (s) => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
