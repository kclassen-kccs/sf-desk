// Calendars to show: your Salesforce events, or (when SF Desk runs on a Mac) any calendar from the Mac's
// Internet Accounts. The choice is remembered on this machine; the first time, the Exchange account's
// main calendar is picked if there is one.
async function loadSources() {
  // Asked again after a refusal, so allowing access in System Settings and clicking Reload picks it up.
  const wasRefused = !!cal.sources?.error;
  if (!cal.sources || wasRefused) {
    try { cal.sources = await api('/calendar/sources'); } catch { cal.sources = { mac: false, calendars: [] }; }
  }
  const { calendars, error } = cal.sources;
  let saved = null;
  try { saved = localStorage.getItem(CAL_SOURCE); } catch {}
  const exchange = calendars.filter((c) => c.type === 'exchange');
  const pick = (saved === 'salesforce' || calendars.some((c) => c.id === saved)) ? saved
    : (exchange.find((c) => /^calendar$/i.test(c.title)) || exchange[0])?.id || 'salesforce';
  if (!cal.source || (wasRefused && !error)) cal.source = pick;
  cal.sourceNote = error || '';
  const select = document.getElementById('calSource');
  if (!select) return;
  const groups = new Map();
  for (const c of calendars) {
    if (!groups.has(c.account)) groups.set(c.account, []);
    groups.get(c.account).push(c);
  }
  select.replaceChildren(el('option', { value: 'salesforce' }, 'Salesforce events'),
    ...[...groups].map(([account, list]) => el('optgroup', { label: `${account}${list[0].type === 'exchange' ? ' (Exchange)' : ''}` },
      list.map((c) => el('option', { value: c.id }, c.title)))));
  select.value = cal.source;
  select.hidden = !cal.sources.mac;
  select.onchange = () => {
    cal.source = select.value; cal.sel = null;
    try { localStorage.setItem(CAL_SOURCE, cal.source); } catch {}
    loadCalendar();
  };
}

function moveWeek(days) { cal.week = addDays(cal.week, days); cal.sel = null; loadCalendar(); }

async function loadCalendar() {
  const week = cal.week, ticket = ++cal.loading;
  const end = addDays(week, 7);
  document.getElementById('calWeek').textContent = `${monDay(week)} – ${monDay(addDays(week, 6))}, ${addDays(week, 6).slice(0, 4)}`;
  const params = new URLSearchParams({ from: localDate(week).toISOString(), to: localDate(end).toISOString(),
    d0: week, d1: addDays(week, 6), tz: new Date().getTimezoneOffset(), source: cal.source || 'salesforce' });
  document.getElementById('calSub').textContent = 'Loading…';
  try {
    const [data] = await Promise.all([api('/calendar?' + params), dsMeta ? null : api('/deal-supports/meta').then((m) => { dsMeta = m; })]);
    if (ticket !== cal.loading || !document.getElementById('calBody')) return;
    cal.data = data;
    renderCalendar();
  } catch (e) {
    if (ticket !== cal.loading) return;
    // The Mac calendar refused (no permission yet) or failed: say why and show Salesforce events instead.
    if (cal.source !== 'salesforce' && e.status !== 401) {
      cal.sourceNote = e.message;
      cal.source = 'salesforce';
      const select = document.getElementById('calSource');
      if (select) select.value = 'salesforce';
      return loadCalendar();
    }
    const sub = document.getElementById('calSub');
    if (sub) sub.textContent = e.message;
    document.getElementById('calBody')?.replaceChildren();
  }
}

function renderCalendar() {
  const { events } = cal.data;
  const by = { covered: 0, open: 0, skipped: 0 };
  for (const e of events) by[evStatus(e)]++;
  const fromMac = cal.data.source && cal.data.source !== 'salesforce';
  document.getElementById('calSub').textContent = (cal.sourceNote && !fromMac ? `${cal.sourceNote} Showing Salesforce events. · ` : '') + (events.length
    ? `${plural(events.length, 'event')} this week · ${by.covered} with a ${dsMeta.label} · ${by.open} without` +
      (by.skipped ? ` · ${by.skipped} marked not needed` : '') + ' · Click an event to see it or create a ' + dsMeta.label
    : fromMac ? 'No events in this calendar this week.' : 'No Salesforce events this week. If your Outlook or Google calendar reaches Salesforce through Einstein Activity Capture, ' +
      'those meetings may not be stored as Salesforce events, so they can\'t be shown here.');

  // Monday to Friday, plus the weekend days that have something on them.
  const days = Array.from({ length: 7 }, (_, i) => addDays(cal.week, i))
    .filter((d, i) => i < 5 || events.some((e) => e.date === d));
  const timed = events.filter((e) => !e.allDay), allDay = events.filter((e) => e.allDay);
  // Hours shown: 8:00 to 18:00, widened to fit the week's events.
  let h0 = 8, h1 = 18;
  for (const e of timed) {
    const s = evTime(e.start), en = evTime(e.end);
    h0 = Math.min(h0, s.getHours());
    h1 = Math.max(h1, en.getDate() !== s.getDate() ? 24 : Math.ceil(en.getHours() + en.getMinutes() / 60));
  }
  const hourPx = 48, height = (h1 - h0) * hourPx, today = todayStr();
  const evBox = (e) => {
    const st = evStatus(e);
    const n = el('button', { class: `ev ${st}${cal.sel === e.id ? ' sel' : ''}`, title: `${e.title || e.subject} · ${STATUS_TEXT[st]}`,
      onclick: () => selectEvent(e.id) },
      el('div', { class: 's' }, e.title || e.subject),
      e.allDay ? null : el('div', { class: 't' }, `${hhmm(evTime(e.start))} – ${hhmm(evTime(e.end))}`));
    return n;
  };
  const cols = days.map((d) => {
    const col = el('div', { class: 'hours-col', style: `height:${height}px` });
    for (let h = h0; h < h1; h++) col.append(el('div', { class: 'hl', style: `top:${(h - h0) * hourPx}px` }));
    if (d === today) {
      const now = new Date(), m = (now.getHours() - h0) * 60 + now.getMinutes();
      if (m >= 0 && m <= (h1 - h0) * 60) col.append(el('div', { class: 'now-line', style: `top:${m / 60 * hourPx}px` }));
    }
    // Lay overlapping events side by side: group events that overlap, then give each the first free lane.
    const list = timed.filter((e) => e.date === d).map((e) => {
      const s = evTime(e.start), en = evTime(e.end);
      const a = (s.getHours() - h0) * 60 + s.getMinutes();
      const b = en.getDate() !== s.getDate() ? (h1 - h0) * 60 : (en.getHours() - h0) * 60 + en.getMinutes();
      return { e, a, b: Math.max(b, a + 20) };
    }).sort((x, y) => x.a - y.a || y.b - x.b);
    let group = [], groupEnd = -1;
    const flush = () => {
      const lanes = [];
      for (const it of group) {
        let lane = lanes.findIndex((end) => end <= it.a);
        if (lane < 0) { lane = lanes.length; lanes.push(0); }
        lanes[lane] = it.b; it.lane = lane;
      }
      for (const it of group) {
        const w = 100 / lanes.length;
        const n = evBox(it.e);
        n.style.cssText = `top:${it.a / 60 * hourPx}px;height:${(it.b - it.a) / 60 * hourPx - 2}px;left:calc(${it.lane * w}% + 2px);width:calc(${w}% - 4px)`;
        col.append(n);
      }
      group = []; groupEnd = -1;
    };
    for (const it of list) {
      if (group.length && it.a >= groupEnd) flush();
      group.push(it); groupEnd = Math.max(groupEnd, it.b);
    }
    flush();
    return col;
  });
  const gutter = el('div', { class: 'hours-col gutter', style: `height:${height}px` });
  for (let h = h0 + 1; h < h1; h++) {
    gutter.append(el('div', { class: 'hl-label', style: `top:${(h - h0) * hourPx}px` },
      new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' })));
  }
  const dayName = (d) => localDate(d).toLocaleDateString([], { weekday: 'short' });
  document.getElementById('calBody').replaceChildren(el('div', { class: 'week', style: `--days:${days.length}` },
    el('div', { class: 'week-row' }, el('div', { class: 'day-head' }),
      days.map((d) => el('div', { class: 'day-head' + (d === today ? ' today' : '') }, dayName(d), el('b', {}, +d.slice(8, 10))))),
    allDay.length ? el('div', { class: 'week-row' }, el('div', { class: 'gutter-label' }, 'All day'),
      days.map((d) => el('div', { class: 'allday' }, allDay.filter((e) => e.date === d).map(evBox)))) : null,
    el('div', { class: 'week-row' }, gutter, cols),
  ), el('section', { id: 'calWeekDs', style: 'margin-top:18px' }));
  renderWeekDealSupports();
  renderEventPanel();
}

// Edit one of the week's Deal Supports: the create form, prefilled from the record, above the list.
async function editWeekDealSupport(r) {
  if (cal.editing?.id === r.Id) return cal.editing.box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const close = () => { cal.editing = null; renderWeekDealSupports(); };
  let data;
  try { data = await api(`/deal-supports/${r.Id}`); } catch (err) { return toast(err.message, 'err'); }
  let picked = data.opportunity;
  const picker = dsMeta.oppUpdateable ? oppCombobox({ picked, onPick: (o) => { picked = o; } }) : null;
  const box = dealSupportForm(null, close, {
    edit: true,
    title: `Edit ${dsMeta.label} ${data.record.Name || ''}`.trim(),
    values: data.record,
    submit: async (fields) => {
      if (!picked) throw new Error('Pick the opportunity this ' + dsMeta.label + ' is for.');
      const moved = picked.Id !== data.opportunity?.Id;
      await api(`/deal-supports/${r.Id}`, { method: 'PATCH', body: { fields, opportunityId: moved ? picked.Id : undefined } });
      toast(`Saved ${dsMeta.label}${data.record.Name ? ` "${data.record.Name}"` : ''}`, 'ok');
      cal.editing = null;
      await loadCalendar();
    },
  });
  box.querySelector('h3').after(el('div', { style: 'margin-bottom:12px' },
    picker ? [el('div', { class: 'grid' }, el('label', {}, el('span', {}, 'Opportunity', el('span', { class: 'req' }, ' *')), picker.input)),
      picker.list, picker.status]
      : el('div', {}, 'Opportunity: ', el('b', {}, picked?.Name || '—'))));
  box.classList.add('ds-edit');
  cal.editing = { id: r.Id, box };

  box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function selectEvent(id) {
  cal.sel = cal.sel === id ? null : id;
  renderCalendar();
}

// Values for the new Deal Support form, taken from the event.
function eventPrefill(e) {
  const p = cal.data.prefill, v = {};
  if (p.nameField) v[p.nameField.name] = (e.title || e.subject).slice(0, p.nameField.length || 80);
  if (p.dateField) {
    v[p.dateField.name] = p.dateField.type === 'datetime' && !e.allDay
      ? `${e.date}T${hhmm24(evTime(e.start))}` : e.date;
  }
  const mins = e.minutes ?? (e.allDay ? null : (evTime(e.end) - evTime(e.start)) / 60000);
  if (p.hoursField && mins != null && !e.allDay) {
    const hours = Math.round(mins / 60 * 100) / 100;
    if (p.hoursField.unit === 'minutes') v[p.hoursField.name] = Math.round(mins);
    else if (p.hoursField.unit === 'hours') v[p.hoursField.name] = hours;
    else if (p.hoursField.picklist) {
      const opt = p.hoursField.picklist.find((o) => Math.abs(parseDuration(o) - hours) < 0.01);
      if (opt) v[p.hoursField.name] = opt;
    } else v[p.hoursField.name] = String(hours);
  }
  if (p.descField && e.description) v[p.descField.name] = e.description.slice(0, p.descField.length || 32000);
  if (p.userField?.onForm) v[p.userField.name] = me.user.id;
  return v;
}
const hhmm24 = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
const localDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  const sfLink = (id, text) => el('a', { href: `${me.instanceUrl}/${id}`, target: '_blank', rel: 'noopener' }, text);
  const skip = el('button', { onclick: async () => {

    st === 'covered' ? `Create another ${dsMeta.label}` : `Create ${dsMeta.label}`);
  if (!dsMeta.canCreate) create.hidden = true;

  panel.replaceChildren(
    el('section', {},
      el('h3', {}, e.title || e.subject, el('span', { class: 'spacer' }), el('button', { onclick: () => selectEvent(e.id), 'aria-label': 'Close' }, '✕')),
      el('div', { style: 'margin:-6px 0 10px' }, el('span', { class: 'status-pill ' + st }, STATUS_TEXT[st])),
      el('dl', {},
        el('dt', {}, 'When'), el('dd', {}, when),
        e.calendar ? [el('dt', {}, 'Calendar'), el('dd', {}, e.calendar)] : null,

        e.supports.length ? [el('dt', {}, dsMeta.labelPlural), el('dd', {}, e.supports.map((r) => el('div', {},
          sfLink(r.Id, r.Name || r.Id), r.oppName ? ` · ${r.oppName}` : '',
          r.how === 'matched' ? el('span', { class: 'tag', title: 'Yours, on the same date, on the same opportunity or account (from the title or attendees for Mac events), or with the same name' }, 'matched') : null)))] : null,
      ),
      e.description ? el('div', { class: 'desc' }, e.description) : el('div', { class: 'sub' }, 'No description on this event.'),
      el('div', { class: 'panel-actions', style: 'margin-top:12px' }, create, st !== 'covered' ? skip : null, e.sfEvent === false ? null : sfLink(e.id, 'Open event in Salesforce ↗')),
    ),
    formBox,
  );
}

// The "create from event" form: pick an opportunity, then the Deal Support fields, prefilled from the event.
function createFromEvent(e, close) {
  let picked = e.what?.type === 'Opportunity' ? { Id: e.what.id, Name: e.what.name } : null;
  const picker = oppCombobox({
    picked,
    // Opportunities on the event's account, or on accounts named in its title, are listed first.
    accounts: [e.what?.type === 'Account' && e.what.id].filter(Boolean),
    title: e.title || e.subject,
    onPick: (o) => { picked = o; },
  });
  const form = dealSupportForm(null, close, {
    title: `New ${dsMeta.label} from this event`,
    values: eventPrefill(e),
    submit: async (fields) => {
      if (!picked) throw new Error('Pick the opportunity this ' + dsMeta.label + ' is for.');
      const rec = await api(`/calendar/events/${e.id}/deal-support`, { method: 'POST', body: { opportunityId: picked.Id, fields } });
      toast(`Created ${dsMeta.label}${rec?.Name ? ` "${rec.Name}"` : ''} on ${picked.Name}`, 'ok');
      await loadCalendar();
    },
  });
  // The opportunity picker goes at the top of the form.
  form.querySelector('h3').after(el('div', { style: 'margin-bottom:12px' },
    el('div', { class: 'grid' }, el('label', {}, el('span', {}, 'Opportunity', el('span', { class: 'req' }, ' *')), picker.input)),
    picker.list, picker.status));
  return form;
}

// Type to filter all open opportunities (searched on the server's local copy, sorted by name).
// Arrow keys move through the list and Enter picks; suggested ones (see /opportunities/open) come first.
function oppCombobox({ picked, accounts = [], title = '', onPick }) {
  const input = el('input', { type: 'search', placeholder: 'Type to find an open opportunity or account…', autocomplete: 'off',
    role: 'combobox', 'aria-label': 'Opportunity', 'aria-expanded': 'true' });
  const list = el('div', { class: 'opp-pick', role: 'listbox' }, el('div', { class: 'empty' }, 'Loading open opportunities…'));
  const status = el('div', { class: 'sub', style: 'margin:6px 0 0' });
  let rows = [], active = -1, ticket = 0, info = null;
  const showStatus = () => {
    status.textContent = (picked ? `Picked: ${picked.Name}${picked.Account?.Name ? ` (${picked.Account.Name})` : ''}` : 'Nothing picked yet.') +
      (info ? ` · ${info.matched.toLocaleString()} of ${info.total.toLocaleString()} open opportunities match` +
        (info.matched > rows.length ? `, showing the first ${rows.length}` : '') : '');
  };
  const choose = (o) => { picked = o; onPick(o); render(); };
  const render = () => {
    const shown = picked && !input.value.trim() && !rows.some((o) => o.Id === picked.Id) ? [picked, ...rows] : rows;
    list.replaceChildren(...(shown.length ? shown.map((o, i) => el('button', {
      type: 'button', role: 'option', 'aria-selected': String(picked?.Id === o.Id),
      class: [picked?.Id === o.Id && 'on', i === active && 'active'].filter(Boolean).join(' ') || null,
      onclick: () => choose(o),
    }, el('div', {}, o.Name, o.suggested ? el('span', { class: 'tag' }, 'suggested') : null),
      el('div', { class: 'm' }, [o.Account?.Name, o.StageName, o.CloseDate && `closes ${o.CloseDate}`, o.Owner?.Name].filter(Boolean).join(' · '))))
      : [el('div', { class: 'empty' }, input.value.trim() ? 'No open opportunities match.' : 'No open opportunities.')]));
    list.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
    showStatus();
  };
  const load = async () => {
    const my = ++ticket;
    const params = new URLSearchParams({ q: input.value.trim(), limit: 100 });
    if (accounts.length) params.set('accounts', accounts.join(','));
    if (title) params.set('title', title);
    try {
      const r = await api('/opportunities/open?' + params);
      if (my !== ticket) return;
      rows = r.records; info = r; active = -1;
      render();
    } catch (err) { if (my === ticket) list.replaceChildren(el('div', { class: 'empty' }, err.message)); }
  };
  let timer;
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 120); });
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      const n = list.querySelectorAll('button').length;
      if (n) { active = (active + (ev.key === 'ArrowDown' ? 1 : n - 1)) % n; render(); }
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const btn = list.querySelectorAll('button')[active < 0 ? 0 : active];
      btn?.click();
    }
  });
  showStatus();
  load();
  return { input, list, status };
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (document.getElementById('forecastChart')) renderDashboard();
    if (document.getElementById('weekChart') && time.data) renderTime();
  }, 150);
});

// ---------- boot ----------
document.getElementById('logout').addEventListener('click', async () => {
  await api('/logout', { method: 'POST' }).catch(() => {});
  current = null; dsMeta = null;
  showConnect('Disconnected.');
});

(async function init() {
  try {
    me = await api('/me');
    if (!me.connected) return showConnect();
    document.getElementById('who').textContent = me.user?.username || me.user?.name || '';
    document.getElementById('logout').hidden = false;
    meta = await api('/meta');
    await loadHidden();
    showDashboard();
  } catch (e) {
    if (e.status !== 401) toast(e.message, 'err');
  }
})();
</script>
